name: Hakkimizda public smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify Hakkimizda hero and footer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify bundled Hakkimizda hero
        shell: bash
        run: |
          set -Eeuo pipefail

          asset="public/about/about-collaboration-hero.jpg"
          test -f "$asset"
          bytes="$(wc -c < "$asset" | tr -d ' ')"
          mime="$(file --brief --mime-type "$asset")"
          details="$(file "$asset")"
          magic="$(xxd -p -l 2 "$asset")"
          tail_magic="$(tail -c 2 "$asset" | xxd -p)"

          echo "$details | ${bytes} bytes"
          [[ "$mime" == "image/jpeg" ]]
          [[ "$details" == *"1280x720"* ]]
          (( bytes >= 50000 ))
          [[ "$magic" == "ffd8" ]]
          [[ "$tail_magic" == "ffd9" ]]

          grep -Fq 'src="/api/site-assets/about-hero?v=20260827-final"' src/components/content/AboutExperience.tsx
          grep -Fq '/about/about-collaboration-hero.jpg?v=20260827-final' src/app/api/site-assets/about-hero/route.ts
          grep -Fq '<Link href="/hakkimizda">Hakkımızda</Link>' src/app/page.tsx
          grep -Fq '<Link href="/iletisim">İletişim</Link>' src/app/page.tsx

      - name: Verify live Hakkimizda after main deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail

          USER_AGENT="IlkOku-Hakkimizda-Smoke/1.0"
          deadline=$((SECONDS + 300))

          while (( SECONDS < deadline )); do
            home="$(mktemp)"
            about="$(mktemp)"
            asset="$(mktemp)"
            headers="$(mktemp)"
            sitemap="$(mktemp)"

            home_code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --output "$home" --write-out '%{http_code}' 'https://ilkoku.com/' || true)"
            about_code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --output "$about" --write-out '%{http_code}' 'https://ilkoku.com/hakkimizda' || true)"
            asset_code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output "$asset" --write-out '%{http_code}' 'https://ilkoku.com/api/site-assets/about-hero?v=20260827-final' || true)"
            sitemap_code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --output "$sitemap" --write-out '%{http_code}' 'https://ilkoku.com/sitemap.xml' || true)"

            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$headers")"
            bytes="$(wc -c < "$asset" | tr -d ' ')"
            magic="$(xxd -p -l 2 "$asset" 2>/dev/null || true)"
            tail_magic="$(tail -c 2 "$asset" 2>/dev/null | xxd -p || true)"
            details="$(file "$asset")"

            echo "home=$home_code about=$about_code hero=$asset_code type=${content_type:-YOK} bytes=$bytes sitemap=$sitemap_code"
            echo "$details"

            if [[ "$home_code" == "200" ]] \
              && [[ "$about_code" == "200" ]] \
              && [[ "$asset_code" == "200" ]] \
              && [[ "$sitemap_code" == "200" ]] \
              && [[ "${content_type,,}" == image/jpeg* ]] \
              && [[ "$details" == *"1280x720"* ]] \
              && (( bytes >= 50000 )) \
              && [[ "$magic" == "ffd8" ]] \
              && [[ "$tail_magic" == "ffd9" ]] \
              && grep -Fq 'href="/hakkimizda"' "$home" \
              && grep -Fq 'href="/iletisim"' "$home" \
              && grep -Fq '/api/site-assets/about-hero?v=20260827-final' "$about" \
              && grep -Fq 'https://ilkoku.com/hakkimizda' "$sitemap"; then
              rm -f "$home" "$about" "$asset" "$headers" "$sitemap"
              echo "PASS: Hakkimizda hero JPEG 1280x720, homepage footer links and sitemap are live."
              exit 0
            fi

            rm -f "$home" "$about" "$asset" "$headers" "$sitemap"
            sleep 10
          done

          echo "FAIL: Hakkimizda live contract did not become healthy within 5 minutes." >&2
          exit 1

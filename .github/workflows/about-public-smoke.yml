name: Hakkimizda public smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify Hakkimizda hero and footer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify bundled Hakkimizda hero
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require('fs');
          const readPart = (index) => {
            const source = fs.readFileSync(`src/components/content/about-hero-data/part${index}.ts`, 'utf8');
            const match = source.match(/^export default "([A-Za-z0-9+/=]+)";\s*$/s);
            if (!match) throw new Error(`Hero part${index} biçimi geçersiz.`);
            return match[1];
          };

          const image = Buffer.from(readPart(0) + readPart(1), 'base64');
          if (image.length < 50000) throw new Error(`Hero JPEG çok küçük: ${image.length} bytes`);
          if (image[0] !== 0xff || image[1] !== 0xd8) throw new Error('JPEG başlangıç imzası geçersiz.');
          if (image.at(-2) !== 0xff || image.at(-1) !== 0xd9) throw new Error('JPEG bitiş imzası geçersiz.');

          const sofMarkers = new Set([0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf]);
          let offset = 2;
          let width = 0;
          let height = 0;
          while (offset + 9 < image.length) {
            if (image[offset] !== 0xff) { offset += 1; continue; }
            while (image[offset] === 0xff) offset += 1;
            const marker = image[offset++];
            if (marker === 0xd8 || marker === 0x01 || (marker >= 0xd0 && marker <= 0xd7)) continue;
            if (marker === 0xd9 || marker === 0xda) break;
            if (offset + 1 >= image.length) break;
            const length = image.readUInt16BE(offset);
            if (length < 2 || offset + length > image.length) break;
            if (sofMarkers.has(marker)) {
              height = image.readUInt16BE(offset + 3);
              width = image.readUInt16BE(offset + 5);
              break;
            }
            offset += length;
          }
          console.log(`Bundled hero -> image/jpeg | ${width}x${height} | ${image.length} bytes`);
          if (width !== 1280 || height !== 720) throw new Error(`Hero çözünürlüğü beklenen 1280x720 değil: ${width}x${height}`);
          NODE

          grep -Fq 'src="/api/site-assets/about-hero?v=20260827-final"' src/components/content/AboutExperience.tsx
          grep -Fq 'Buffer.from(heroPart0 + heroPart1, "base64")' src/app/api/site-assets/about-hero/route.ts
          grep -Fq '<Link href="/hakkimizda">Hakkımızda</Link>' src/app/page.tsx
          grep -Fq '<Link href="/iletisim">İletişim</Link>' src/app/page.tsx

      - name: Verify live Hakkimizda after main deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail

          USER_AGENT="IlkOku-Hakkimizda-Smoke/1.0"
          deadline=$((SECONDS + 300))

          while (( SECONDS < deadline )); do
            home="$(mktemp)"
            about="$(mktemp)"
            asset="$(mktemp)"
            headers="$(mktemp)"
            sitemap="$(mktemp)"

            home_code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --output "$home" --write-out '%{http_code}' 'https://ilkoku.com/' || true)"
            about_code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --output "$about" --write-out '%{http_code}' 'https://ilkoku.com/hakkimizda' || true)"
            asset_code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output "$asset" --write-out '%{http_code}' 'https://ilkoku.com/api/site-assets/about-hero?v=20260827-final' || true)"
            sitemap_code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --output "$sitemap" --write-out '%{http_code}' 'https://ilkoku.com/sitemap.xml' || true)"

            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$headers")"
            bytes="$(wc -c < "$asset" | tr -d ' ')"
            magic="$(xxd -p -l 2 "$asset" 2>/dev/null || true)"
            tail_magic="$(tail -c 2 "$asset" 2>/dev/null | xxd -p || true)"
            details="$(file "$asset")"

            echo "home=$home_code about=$about_code hero=$asset_code type=${content_type:-YOK} bytes=$bytes sitemap=$sitemap_code"
            echo "$details"

            if [[ "$home_code" == "200" ]] \
              && [[ "$about_code" == "200" ]] \
              && [[ "$asset_code" == "200" ]] \
              && [[ "$sitemap_code" == "200" ]] \
              && [[ "${content_type,,}" == image/jpeg* ]] \
              && [[ "$details" == *"1280x720"* ]] \
              && (( bytes >= 50000 )) \
              && [[ "$magic" == "ffd8" ]] \
              && [[ "$tail_magic" == "ffd9" ]] \
              && grep -Fq 'href="/hakkimizda"' "$home" \
              && grep -Fq 'href="/iletisim"' "$home" \
              && grep -Fq '/api/site-assets/about-hero?v=20260827-final' "$about" \
              && grep -Fq 'https://ilkoku.com/hakkimizda' "$sitemap"; then
              rm -f "$home" "$about" "$asset" "$headers" "$sitemap"
              echo "PASS: Hakkimizda hero JPEG 1280x720, homepage footer links and sitemap are live."
              exit 0
            fi

            rm -f "$home" "$about" "$asset" "$headers" "$sitemap"
            sleep 10
          done

          echo "FAIL: Hakkimizda live contract did not become healthy within 5 minutes." >&2
          exit 1

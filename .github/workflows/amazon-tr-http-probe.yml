name: Amazon TR HTTP probe

on:
  push:
    branches:
      - diagnostic/amazon-tr-http-probe-20260930

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe public Amazon TR ranked book routes
        shell: bash
        run: |
          node <<'NODE'
          const urls = [
            "https://www.amazon.com.tr/gp/bestsellers/books",
            "https://www.amazon.com.tr/gp/bestsellers/books/ref=zg_bs_pg_2_books?ie=UTF8&pg=2",
            "https://www.amazon.com.tr/gp/new-releases/books",
            "https://www.amazon.com.tr/gp/new-releases/books/ref=zg_bsnr_pg_2_books?ie=UTF8&pg=2",
          ];

          const headers = {
            Accept: "text/html,application/xhtml+xml",
            "Accept-Language": "tr-TR,tr;q=0.9,en;q=0.5",
            "User-Agent": "IlkOkuBookIndex/0.1 (+https://ilkoku.com)",
          };

          for (const url of urls) {
            try {
              const response = await fetch(url, {
                cache: "no-store",
                headers,
                redirect: "follow",
                signal: AbortSignal.timeout(20000),
              });
              const body = await response.text();
              const ranks = [...body.matchAll(/zg-bdg-text[^>]*>\s*#(\d{1,3})/giu)].map(m => Number(m[1]));
              const asins = [...body.matchAll(/data-asin=["']([^"']+)["']/giu)].map(m => m[1]).filter(Boolean);
              console.log(JSON.stringify({
                requestedUrl: url,
                status: response.status,
                ok: response.ok,
                finalUrl: response.url,
                bytes: body.length,
                asinCount: new Set(asins).size,
                rankCount: ranks.length,
                firstRanks: ranks.slice(0, 6),
                hasRobotCheck: /robot check|captcha|validateCaptcha/i.test(body),
              }));
            } catch (error) {
              console.log(JSON.stringify({
                requestedUrl: url,
                error: error instanceof Error ? error.message : String(error),
              }));
            }
          }
          NODE

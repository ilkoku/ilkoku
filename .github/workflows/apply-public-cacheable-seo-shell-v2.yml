name: Apply public cacheable SEO shell v2

on:
  push:
    branches:
      - fix/public-cacheable-seo-shell

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def remove_imports(text, lines, path):
              for line in lines:
                  if line not in text:
                      raise SystemExit(f"{path}: missing import {line.strip()}")
                  text = text.replace(line, "", 1)
              return text

          # Shared public header: no server-side session/cookie dependency.
          path = "src/components/layout/PublicSiteHeader.tsx"
          text = read(path)
          text = remove_imports(text, [
              'import { authContent } from "@/content";\n',
              'import { logoutAction } from "@/features/auth/actions";\n',
              'import { getRoleNavigation } from "@/features/auth/destination";\n',
              'import { getCurrentProfile } from "@/features/auth/profile";\n',
          ], path)
          text, n = re.subn(
              r'export async function PublicSiteHeader\(\) \{\n\s*const \[profile, identity\] = await Promise\.all\(\[getCurrentProfile\(\), getPublicSiteIdentity\(\)\]\);\n\s*const navigation = profile \? await getRoleNavigation\(profile\) : null;\n\s*const pendingRole =[\s\S]*?;\n',
              'export async function PublicSiteHeader() {\n  const identity = await getPublicSiteIdentity();\n',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"{path}: session prelude match count {n}")
          text, n = re.subn(
              r'<details className="public-site-header__account">[\s\S]*?</details>',
              '''<details className="public-site-header__account">
            <summary aria-label="Hesap menüsünü aç">
              <AccountIcon />
            </summary>
            <div className="public-site-header__account-menu">
              <Link href="/hesabim">Hesabım</Link>
              <Link href="/giris">Giriş Yap</Link>
              <Link href="/kayit">Üye Ol</Link>
            </div>
          </details>''',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"{path}: account block match count {n}")
          write(path, text)

          # Canonical trust footer: no server-side session/cookie dependency.
          path = "src/components/content/PublicTrustFooter.tsx"
          text = read(path)
          text = remove_imports(text, [
              'import { logoutAction } from "@/features/auth/actions";\n',
              'import { getRoleNavigation } from "@/features/auth/destination";\n',
              'import { getCurrentProfile } from "@/features/auth/profile";\n',
          ], path)
          text, n = re.subn(
              r'export async function PublicTrustFooter\(\) \{\n\s*const \[profile, identity\] = await Promise\.all\(\[getCurrentProfile\(\), getPublicSiteIdentity\(\)\]\);\n\s*const navigation = profile \? await getRoleNavigation\(profile\) : null;\n',
              'export async function PublicTrustFooter() {\n  const identity = await getPublicSiteIdentity();\n',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"{path}: session prelude match count {n}")
          text, n = re.subn(
              r'<div className="public-trust-footer__column">\n\s*<h3>Hesap</h3>[\s\S]*?</div>\n\n\s*<nav className="public-trust-footer__column" aria-label="Destek bağlantıları">',
              '''<div className="public-trust-footer__column">
          <h3>Hesap</h3>
          <Link href="/hesabim">Hesabım</Link>
          <Link href="/giris">Giriş Yap</Link>
          <Link href="/kayit">Üye Ol</Link>
          <Link href="/sifremi-unuttum">Şifremi Unuttum</Link>
        </div>

        <nav className="public-trust-footer__column" aria-label="Destek bağlantıları">''',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"{path}: account column match count {n}")
          write(path, text)

          # Homepage shell: remove session dependency and render account-neutral public HTML.
          path = "src/app/onizleme/ana-sayfa-yeni/HomepageExperience.tsx"
          text = read(path)
          text = remove_imports(text, [
              'import { authContent } from "@/content";\n',
              'import { logoutAction } from "@/features/auth/actions";\n',
              'import { getRoleNavigation } from "@/features/auth/destination";\n',
              'import { getCurrentProfile } from "@/features/auth/profile";\n',
          ], path)
          text, n = re.subn(
              r'export default async function HomepageExperience\(\) \{\n\s*const \[profile, roleCardState, homepageState\] = await Promise\.all\(\[\n\s*getCurrentProfile\(\),\n\s*getPublishedRoleCardsState\("tr"\),\n\s*getPublishedHomepageState\("tr"\),\n\s*\]\);\n\n\s*const navigation = profile \? await getRoleNavigation\(profile\) : null;\n\s*const pendingRole = .*?;\n',
              'export default async function HomepageExperience() {\n  const [roleCardState, homepageState] = await Promise.all([\n    getPublishedRoleCardsState("tr"),\n    getPublishedHomepageState("tr"),\n  ]);\n',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"{path}: session prelude match count {n}")
          text, n = re.subn(
              r'<div className="nx-account__menu">[\s\S]*?</div>\n\s*</details>',
              '''<div className="nx-account__menu">
              <Link href="/hesabim">Hesabım</Link><Link href="/giris">Giriş Yap</Link><a href="#roller">Üye Ol</a>
            </div>
          </details>''',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"{path}: account menu match count {n}")
          text, n = re.subn(
              r'<LiveHomepageFooter\n\s*signedIn=\{Boolean\(profile && navigation\)\}\n\s*workspaceHref=\{navigation\?\.workspaceHref\}\n',
              '<LiveHomepageFooter\n        signedIn={false}\n',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"{path}: footer props match count {n}")
          write(path, text)

          # Indexable public routes use ISR instead of force-dynamic.
          public_pages = [
              "src/app/page.tsx",
              "src/app/yardim/page.tsx",
              "src/app/editorler/page.tsx",
              "src/app/iletisim/page.tsx",
              "src/app/hakkimizda/page.tsx",
              "src/app/nasil-calisir/page.tsx",
              "src/app/editoryal-standartlar/page.tsx",
              "src/app/icerik-ve-yas-politikasi/page.tsx",
              "src/app/topluluk-kurallari/page.tsx",
              "src/app/telif-bildirimi/page.tsx",
              "src/app/yazarlar-icin/page.tsx",
              "src/app/editorler-icin/page.tsx",
              "src/app/yayinevleri-icin/page.tsx",
          ]
          touched = []
          for path in public_pages:
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"missing public route {path}")
              text = p.read_text()
              marker = 'export const dynamic = "force-dynamic";'
              if marker in text:
                  text = text.replace(marker, 'export const revalidate = 300;', 1)
                  p.write_text(text)
                  touched.append(path)
          if "src/app/page.tsx" not in touched:
              raise SystemExit("homepage force-dynamic marker missing")

          # Update contracts to protect the new architecture.
          path = "scripts/security-contract-public-site-header.test.mjs"
          text = read(path)
          text = text.replace('  assert.match(header, /navigation\\.workspaceHref/);\n  assert.match(header, /logoutAction/);\n', '  assert.doesNotMatch(header, /getCurrentProfile|navigation\\.workspaceHref|logoutAction/);\n')
          write(path, text)

          path = "scripts/security-contract-cms-footer-workbench.test.mjs"
          text = read(path)
          text = text.replace('  has(footer, "getCurrentProfile", "session-aware footer account state");\n  has(footer, "getRoleNavigation", "role-aware workspace footer link");\n', '  lacks(footer, "getCurrentProfile", "public footer must not read session server-side");\n  lacks(footer, "getRoleNavigation", "public footer must not resolve workspace server-side");\n')
          write(path, text)

          new_test = Path("scripts/security-contract-public-cacheable-seo.test.mjs")
          new_test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst read = (path) => fs.readFileSync(path, "utf8");\n\ntest("public SEO shell is cacheable and session-neutral", () => {\n  const homepage = read("src/app/page.tsx");\n  const experience = read("src/app/onizleme/ana-sayfa-yeni/HomepageExperience.tsx");\n  const header = read("src/components/layout/PublicSiteHeader.tsx");\n  const footer = read("src/components/content/PublicTrustFooter.tsx");\n\n  assert.match(homepage, /export const revalidate = 300;/u);\n  assert.doesNotMatch(homepage, /force-dynamic/u);\n  for (const source of [experience, header, footer]) {\n    assert.doesNotMatch(source, /getCurrentProfile/u);\n    assert.doesNotMatch(source, /getRoleNavigation/u);\n  }\n});\n''')

          path = "package.json"
          text = read(path)
          needle = "scripts/security-contract-public-site-header.test.mjs "
          if "scripts/security-contract-public-cacheable-seo.test.mjs" not in text:
              if needle not in text:
                  raise SystemExit("package security test insertion point missing")
              text = text.replace(needle, needle + "scripts/security-contract-public-cacheable-seo.test.mjs ", 1)
          write(path, text)
          PY

      - name: Run focused contracts
        run: node --test scripts/security-contract-public-site-header.test.mjs scripts/security-contract-cms-footer-workbench.test.mjs scripts/security-contract-public-cacheable-seo.test.mjs

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app src/components scripts package.json
          git commit -m "fix: make public SEO shell cacheable"
          git push origin HEAD:fix/public-cacheable-seo-shell

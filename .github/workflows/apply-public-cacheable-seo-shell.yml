name: Apply public cacheable SEO shell

on:
  push:
    branches:
      - fix/public-cacheable-seo-shell

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded public SEO cache refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one guarded match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Public site header must not read the authenticated session on the server.
          path = "src/components/layout/PublicSiteHeader.tsx"
          p = Path(path)
          text = p.read_text()
          for line in [
              'import { authContent } from "@/content";\n',
              'import { logoutAction } from "@/features/auth/actions";\n',
              'import { getRoleNavigation } from "@/features/auth/destination";\n',
              'import { getCurrentProfile } from "@/features/auth/profile";\n',
          ]:
              if line not in text:
                  raise SystemExit(f"{path}: missing guarded import {line.strip()}")
              text = text.replace(line, "", 1)
          old = '''export async function PublicSiteHeader() {
            const [profile, identity] = await Promise.all([getCurrentProfile(), getPublicSiteIdentity()]);
            const navigation = profile ? await getRoleNavigation(profile) : null;
            const pendingRole =
              navigation?.pendingRequest?.requestedRole ??
              (profile?.role === "editor_pending" ? "editor" : null);
          '''
          new = '''export async function PublicSiteHeader() {
            const identity = await getPublicSiteIdentity();
          '''
          if old not in text:
              raise SystemExit(f"{path}: public header session prelude drifted")
          text = text.replace(old, new, 1)
          old = '''            <summary
              aria-label={
                profile
                  ? `${profile.fullName} hesap menüsünü aç`
                  : "Hesap menüsünü aç"
              }
            >
              <AccountIcon />
            </summary>

            <div className="public-site-header__account-menu">
              {profile && navigation ? (
                <>
                  <div className="public-site-header__identity">
                    <strong>{profile.fullName}</strong>
                    <span>Aktif rol: {authContent.roles[profile.role]}</span>
                    {navigation.hasPendingRequest ? (
                      <small>
                        {pendingRole
                          ? `${authContent.roles[pendingRole]} başvurunuz inceleniyor`
                          : "Başvurunuz inceleniyor"}
                      </small>
                    ) : null}
                  </div>
                  <Link href="/hesabim">Hesabım</Link>
                  <Link href={navigation.workspaceHref}>
                    {navigation.hasPendingRequest
                      ? "Mevcut çalışma alanına dön"
                      : "Çalışma Alanım"}
                  </Link>
                  <form action={logoutAction}>
                    <button
                      className="public-site-header__logout"
                      type="submit"
                    >
                      Çıkış Yap
                    </button>
                  </form>
                </>
              ) : (
                <>
                  <Link href="/giris">Giriş Yap</Link>
                  <Link href="/kayit">Üye Ol</Link>
                </>
              )}
            </div>
          '''
          new = '''            <summary aria-label="Hesap menüsünü aç">
              <AccountIcon />
            </summary>

            <div className="public-site-header__account-menu">
              <Link href="/hesabim">Hesabım</Link>
              <Link href="/giris">Giriş Yap</Link>
              <Link href="/kayit">Üye Ol</Link>
            </div>
          '''
          if old not in text:
              raise SystemExit(f"{path}: public header account block drifted")
          p.write_text(text.replace(old, new, 1))

          # Homepage experience must remain public/cacheable; account state is handled behind /hesabim.
          path = "src/app/onizleme/ana-sayfa-yeni/HomepageExperience.tsx"
          p = Path(path)
          text = p.read_text()
          for line in [
              'import { authContent } from "@/content";\n',
              'import { logoutAction } from "@/features/auth/actions";\n',
              'import { getRoleNavigation } from "@/features/auth/destination";\n',
              'import { getCurrentProfile } from "@/features/auth/profile";\n',
          ]:
              if line not in text:
                  raise SystemExit(f"{path}: missing guarded import {line.strip()}")
              text = text.replace(line, "", 1)
          old = '''export default async function HomepageExperience() {
            const [profile, roleCardState, homepageState] = await Promise.all([
              getCurrentProfile(),
              getPublishedRoleCardsState("tr"),
              getPublishedHomepageState("tr"),
            ]);

            const navigation = profile ? await getRoleNavigation(profile) : null;
            const pendingRole = navigation?.pendingRequest?.requestedRole ?? (profile?.role === "editor_pending" ? "editor" : null);
          '''
          new = '''export default async function HomepageExperience() {
            const [roleCardState, homepageState] = await Promise.all([
              getPublishedRoleCardsState("tr"),
              getPublishedHomepageState("tr"),
            ]);
          '''
          if old not in text:
              raise SystemExit(f"{path}: homepage session prelude drifted")
          text = text.replace(old, new, 1)
          old = '''            <div className="nx-account__menu">
              {profile && navigation ? <>
                <div className="nx-account__identity"><strong>{profile.fullName}</strong><span>Aktif rol: {authContent.roles[profile.role]}</span>{navigation.hasPendingRequest ? <small>{pendingRole ? `${authContent.roles[pendingRole]} başvurunuz inceleniyor` : "Başvurunuz inceleniyor"}</small> : null}</div>
                <Link href="/hesabim">Hesabım</Link><Link href={navigation.workspaceHref}>{navigation.hasPendingRequest ? "Mevcut çalışma alanına dön" : "Çalışma Alanım"}</Link><form action={logoutAction}><button type="submit">Çıkış Yap</button></form>
              </> : <><Link href="/giris">Giriş Yap</Link><a href="#roller">Üye Ol</a></>}
            </div>
          '''
          new = '''            <div className="nx-account__menu">
              <Link href="/hesabim">Hesabım</Link><Link href="/giris">Giriş Yap</Link><a href="#roller">Üye Ol</a>
            </div>
          '''
          if old not in text:
              raise SystemExit(f"{path}: homepage account block drifted")
          p.write_text(text.replace(old, new, 1))

          # Indexable public routes should be ISR/cacheable instead of force-dynamic.
          public_pages = [
              "src/app/page.tsx",
              "src/app/yardim/page.tsx",
              "src/app/editorler/page.tsx",
              "src/app/iletisim/page.tsx",
              "src/app/hakkimizda/page.tsx",
              "src/app/nasil-calisir/page.tsx",
              "src/app/editoryal-standartlar/page.tsx",
              "src/app/icerik-ve-yas-politikasi/page.tsx",
              "src/app/topluluk-kurallari/page.tsx",
              "src/app/telif-bildirimi/page.tsx",
              "src/app/yazarlar-icin/page.tsx",
              "src/app/editorler-icin/page.tsx",
              "src/app/yayinevleri-icin/page.tsx",
          ]
          changed = []
          for path in public_pages:
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"missing public route: {path}")
              text = p.read_text()
              marker = 'export const dynamic = "force-dynamic";'
              if marker in text:
                  text = text.replace(marker, 'export const revalidate = 300;', 1)
                  p.write_text(text)
                  changed.append(path)
          if "src/app/page.tsx" not in changed:
              raise SystemExit("homepage was not force-dynamic; guarded assumption changed")

          # Regression contract: public SEO surfaces must never be tied back to server session rendering.
          test_path = Path("scripts/security-contract-public-cacheable-seo.test.mjs")
          test_path.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst source = (path) => fs.readFileSync(path, "utf8");\n\ntest("public SEO shell stays cacheable and session-neutral", () => {\n  const homepage = source("src/app/page.tsx");\n  const experience = source("src/app/onizleme/ana-sayfa-yeni/HomepageExperience.tsx");\n  const header = source("src/components/layout/PublicSiteHeader.tsx");\n\n  assert.doesNotMatch(homepage, /force-dynamic/u);\n  assert.match(homepage, /export const revalidate = 300;/u);\n\n  for (const text of [experience, header]) {\n    assert.doesNotMatch(text, /getCurrentProfile/u);\n    assert.doesNotMatch(text, /getRoleNavigation/u);\n    assert.doesNotMatch(text, /logoutAction/u);\n  }\n  assert.match(header, /href=\\"\\/hesabim\\"/u);\n  assert.match(header, /href=\\"\\/giris\\"/u);\n});\n''')

          package = Path("package.json")
          text = package.read_text()
          needle = "scripts/security-contract-public-site-header.test.mjs "
          insertion = "scripts/security-contract-public-site-header.test.mjs scripts/security-contract-public-cacheable-seo.test.mjs "
          if needle not in text:
              raise SystemExit("package.json security test insertion point drifted")
          package.write_text(text.replace(needle, insertion, 1))
          PY

      - name: Commit refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app src/components/layout/PublicSiteHeader.tsx scripts/security-contract-public-cacheable-seo.test.mjs package.json
          git commit -m "fix: make public SEO shell cacheable"
          git push origin HEAD:fix/public-cacheable-seo-shell

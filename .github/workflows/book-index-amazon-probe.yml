name: Book Index Amazon Probe

on:
  push:
    branches:
      - feature/book-index-amazon-sources
    paths:
      - ".github/workflows/book-index-amazon-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect Amazon TR rendered bestseller DOM
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          url="https://www.amazon.com.tr/gp/bestsellers/books"
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --user-agent="$ua" --virtual-time-budget=10000 --dump-dom "$url"             > /tmp/amazon-tr.html 2>/tmp/chrome.err || true

          echo "BYTES=$(wc -c < /tmp/amazon-tr.html)"
          echo "ROBOT_CHECK=$(grep -Eoi 'robot check|automated access|captcha|api-services-support@amazon' /tmp/amazon-tr.html | head -n 5 | tr '\n' ' ' || true)"
          echo "ASIN_COUNT=$(grep -Eo 'data-asin=["'"'"'][A-Z0-9]{10}["'"'"']' /tmp/amazon-tr.html | wc -l || true)"
          echo "RANK_COUNT=$(grep -Eo 'zg-bdg-text[^>]*>#[0-9]+' /tmp/amazon-tr.html | wc -l || true)"
          echo "DP_LINK_COUNT=$(grep -Eo 'href=["'"'"'][^"'"'"']*/dp/[A-Z0-9]{10}[^"'"'"']*["'"'"']' /tmp/amazon-tr.html | wc -l || true)"

          python3 - <<'PY'
          from pathlib import Path
          import re, html
          text=Path("/tmp/amazon-tr.html").read_text(errors="replace")

          for token in ["zg-grid-general-faceout", "zg-bdg-text", "data-asin=", "/dp/"]:
              print("\nTOKEN",token,"COUNT",text.count(token))
              p=text.find(token)
              if p>=0:
                  print(text[max(0,p-1200):p+6000])

          print("\n--- FIRST 20 ASINS ---")
          asins=[]
          for asin in re.findall(r'data-asin=["\']([A-Z0-9]{10})["\']',text):
              if asin not in asins: asins.append(asin)
          print(asins[:20])

          print("\n--- FIRST 20 RANKS ---")
          ranks=re.findall(r'class=["\'][^"\']*zg-bdg-text[^"\']*["\'][^>]*>\s*#([0-9]+)',text,re.I)
          print(ranks[:20])
          PY

name: Book Index Amazon Probe

on:
  push:
    branches:
      - feature/book-index-amazon-sources
    paths:
      - ".github/workflows/book-index-amazon-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Probe Amazon bestseller pages transparently
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"

          probe() {
            name="$1"
            url="$2"
            out="/tmp/$name.html"
            code="$(curl -L --silent --show-error --max-time 30 -A "$ua"               -H 'Accept: text/html,application/xhtml+xml'               -o "$out" -w "%{http_code}" "$url" || true)"
            echo "=== $name ==="
            echo "URL=$url"
            echo "HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0)"
            echo "TITLE=$(grep -oim1 '<title[^>]*>[^<]*' "$out" 2>/dev/null | sed -E 's/<title[^>]*>//I' || true)"
            echo "ROBOT_CHECK=$(grep -Eoi 'robot check|automated access|captcha|sorry|api-services-support@amazon' "$out" 2>/dev/null | head -n 5 | tr '\n' ' ' || true)"
            echo "RANK_MARKERS=$(grep -Eo '#[0-9]{1,3}' "$out" 2>/dev/null | head -n 10 | tr '\n' ' ' || true)"
            echo "ASIN_MARKERS=$(grep -Eo 'data-asin=["'"'"'][A-Z0-9]{10}["'"'"']' "$out" 2>/dev/null | head -n 10 | tr '\n' ' ' || true)"
          }

          probe amazon-tr "https://www.amazon.com.tr/gp/bestsellers/books"
          probe amazon-us "https://www.amazon.com/Best-Sellers-Books/zgbs/books"

          echo "=== ROBOTS TR ==="
          curl -L --silent --show-error --max-time 20 -A "$ua"             "https://www.amazon.com.tr/robots.txt" | head -n 220 || true

          echo "=== ROBOTS US ==="
          curl -L --silent --show-error --max-time 20 -A "$ua"             "https://www.amazon.com/robots.txt" | head -n 220 || true

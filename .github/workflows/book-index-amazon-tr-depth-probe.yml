name: Book Index Amazon TR depth probe

on:
  push:
    branches:
      - research/book-index-amazon-tr-depth-01ak-ae
    paths:
      - ".github/workflows/book-index-amazon-tr-depth-probe.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/book-index-amazon-tr-depth-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Observe public Amazon TR bestseller ranks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch two public bestseller pages without collecting
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          urls=(
            'https://www.amazon.com.tr/gp/bestsellers/books'
            'https://www.amazon.com.tr/gp/bestsellers/books/ref=zg_bs_pg_2_books?ie=UTF8&pg=2'
          )

          for page in 1 2; do
            body="$tmpdir/page-$page.html"
            headers="$tmpdir/page-$page.headers"
            url="${urls[$((page - 1))]}"

            code="$(curl               --silent               --show-error               --compressed               --max-time 20               --user-agent 'IlkOkuBookIndex/0.1 (+https://ilkoku.com)'               --header 'Accept: text/html,application/xhtml+xml'               --header 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.5'               --dump-header "$headers"               --output "$body"               --write-out '%{http_code}'               "$url" || true)"

            bytes="$(wc -c < "$body" | tr -d ' ')"
            printf 'page=%s http_status=%s body_bytes=%s\n' "$page" "$code" "$bytes"

            case "$code" in
              200)
                node - "$body" "$page" <<'NODE'
          const fs = require("node:fs");

          const path = process.argv[2];
          const page = Number(process.argv[3]);
          const html = fs.readFileSync(path, "utf8");

          const ranks = [...html.matchAll(/\bzg-bdg-text\b[^>]*>\s*#(\d{1,3})\s*</giu)]
            .map((match) => Number(match[1]))
            .filter(Number.isInteger);
          const uniqueRanks = [...new Set(ranks)];

          const asins = [...html.matchAll(/\bdata-asin=["']([^"']+)["']/giu)]
            .map((match) => match[1].trim())
            .filter(Boolean);
          const uniqueAsins = [...new Set(asins)];

          const expectedStart = page === 1 ? 1 : 51;
          const expectedEnd = page === 1 ? 50 : 100;
          const expected = Array.from(
            { length: expectedEnd - expectedStart + 1 },
            (_, index) => expectedStart + index,
          );
          const rankSet = new Set(uniqueRanks);
          const missing = expected.filter((rank) => !rankSet.has(rank));

          console.log(`page=${page} rank_count=${ranks.length} unique_rank_count=${uniqueRanks.length}`);
          console.log(`page=${page} ranks=${uniqueRanks.join(",") || "NONE"}`);
          console.log(`page=${page} missing_expected=${missing.join(",") || "NONE"}`);
          console.log(`page=${page} asin_count=${asins.length} unique_asin_count=${uniqueAsins.length}`);
          NODE
                ;;
              403|429|503)
                printf 'page=%s access_state=blocked_or_unavailable\n' "$page"
                ;;
              000|'')
                printf 'page=%s access_state=request_failed\n' "$page"
                ;;
              *)
                printf 'page=%s access_state=http_%s\n' "$page" "$code"
                ;;
            esac
          done


      - name: Observe rendered DOM without login or cookies
        shell: bash
        run: |
          set -euo pipefail

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "render_probe=browser_unavailable"
            exit 0
          fi

          "$chrome" --version | sed 's/^/render_probe_browser=/'

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          urls=(
            'https://www.amazon.com.tr/gp/bestsellers/books'
            'https://www.amazon.com.tr/gp/bestsellers/books/ref=zg_bs_pg_2_books?ie=UTF8&pg=2'
          )

          for page in 1 2; do
            body="$tmpdir/rendered-$page.html"
            netlog="$tmpdir/net-$page.json"
            url="${urls[$((page - 1))]}"

            "$chrome"               --headless=new               --disable-gpu               --disable-dev-shm-usage               --no-sandbox               --lang=tr-TR               --window-size=1920,20000               --virtual-time-budget=10000               --log-net-log="$netlog"               --net-log-capture-mode=Everything               --dump-dom               "$url" > "$body" 2>/dev/null || true

            node - "$body" "$page" <<'NODE'
          const fs = require("node:fs");

          const path = process.argv[2];
          const page = Number(process.argv[3]);
          const html = fs.existsSync(path) ? fs.readFileSync(path, "utf8") : "";

          const ranks = [...html.matchAll(/\bzg-bdg-text\b[^>]*>\s*#(\d{1,3})\s*</giu)]
            .map((match) => Number(match[1]))
            .filter(Number.isInteger);
          const uniqueRanks = [...new Set(ranks)];

          const asins = [...html.matchAll(/\bdata-asin=["']([^"']+)["']/giu)]
            .map((match) => match[1].trim())
            .filter(Boolean);
          const uniqueAsins = [...new Set(asins)];

          const expectedStart = page === 1 ? 1 : 51;
          const expectedEnd = page === 1 ? 50 : 100;
          const expected = Array.from(
            { length: expectedEnd - expectedStart + 1 },
            (_, index) => expectedStart + index,
          );
          const rankSet = new Set(uniqueRanks);
          const missing = expected.filter((rank) => !rankSet.has(rank));

          console.log(`render_page=${page} bytes=${Buffer.byteLength(html)} rank_count=${ranks.length} unique_rank_count=${uniqueRanks.length}`);
          console.log(`render_page=${page} ranks=${uniqueRanks.join(",") || "NONE"}`);
          console.log(`render_page=${page} missing_expected=${missing.join(",") || "NONE"}`);
          console.log(`render_page=${page} asin_count=${asins.length} unique_asin_count=${uniqueAsins.length}`);
          NODE

            node - "$netlog" "$page" <<'NODE'
          const fs = require("node:fs");

          const path = process.argv[2];
          const page = Number(process.argv[3]);
          if (!fs.existsSync(path)) {
            console.log(`render_page=${page} netlog=missing`);
            process.exit(0);
          }

          let payload;
          try {
            payload = JSON.parse(fs.readFileSync(path, "utf8"));
          } catch {
            console.log(`render_page=${page} netlog=invalid_json`);
            process.exit(0);
          }

          const events = Array.isArray(payload?.events) ? payload.events : [];
          const nextPageMatcher = /\/acp\/eu-south-2\/p13n-zg-list-grid-desktop\/[^/]+\/nextPage/iu;
          const seeds = events.filter((event) => {
            const url = event?.params?.url;
            return typeof url === "string" && nextPageMatcher.test(url);
          });

          const typeMap = new Map(
            Object.entries(payload?.constants?.logEventTypes ?? {}).map(([name, value]) => [value, name]),
          );

          if (seeds.length === 0) {
            console.log(`render_page=${page} next_page_request=NOT_FOUND`);
            process.exit(0);
          }

          const seenSourceIds = new Set();
          for (const seed of seeds) {
            const sourceId = seed?.source?.id;
            if (sourceId == null || seenSourceIds.has(sourceId)) continue;
            seenSourceIds.add(sourceId);

            const sourceEvents = events.filter((event) => event?.source?.id === sourceId);
            const rawUrl = seed.params.url;
            const parsed = new URL(rawUrl);
            const queryKeys = [...parsed.searchParams.keys()].sort();
            const safePath = parsed.pathname.replace(
              /\/p13n-zg-list-grid-desktop\/[^/]+\/nextPage$/iu,
              "/p13n-zg-list-grid-desktop/{dynamic}/nextPage",
            );

            const methods = [...new Set(
              sourceEvents
                .map((event) => event?.params?.method)
                .filter((value) => typeof value === "string"),
            )];

            const responseCodes = new Set();
            for (const event of sourceEvents) {
              const directCode = event?.params?.response_code ?? event?.params?.status_code;
              if (Number.isInteger(directCode)) responseCodes.add(directCode);

              const headers = event?.params?.headers;
              if (Array.isArray(headers)) {
                for (const header of headers) {
                  if (typeof header !== "string") continue;
                  const match = header.match(/^HTTP\/\S+\s+(\d{3})\b/iu);
                  if (match) responseCodes.add(Number(match[1]));
                }
              }
            }

            const eventNames = [...new Set(
              sourceEvents
                .map((event) => typeMap.get(event.type))
                .filter(Boolean),
            )].sort();

            console.log(
              `render_page=${page} next_page_request=FOUND method=${methods.join(",") || "UNKNOWN"} status=${[...responseCodes].join(",") || "UNKNOWN"} path=${parsed.origin}${safePath} query_keys=${queryKeys.join(",") || "NONE"} source_event_count=${sourceEvents.length}`,
            );
            console.log(
              `render_page=${page} next_page_event_types=${eventNames.join(",") || "UNKNOWN"}`,
            );
          }
          NODE
          done

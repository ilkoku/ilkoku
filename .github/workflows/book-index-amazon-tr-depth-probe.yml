name: Book Index Amazon TR depth probe

on:
  push:
    branches:
      - research/book-index-amazon-tr-depth-01ak-ae
    paths:
      - ".github/workflows/book-index-amazon-tr-depth-probe.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/book-index-amazon-tr-depth-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Observe public Amazon TR bestseller ranks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch two public bestseller pages without collecting
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          urls=(
            'https://www.amazon.com.tr/gp/bestsellers/books'
            'https://www.amazon.com.tr/gp/bestsellers/books/ref=zg_bs_pg_2_books?ie=UTF8&pg=2'
          )

          for page in 1 2; do
            body="$tmpdir/page-$page.html"
            headers="$tmpdir/page-$page.headers"
            url="${urls[$((page - 1))]}"

            code="$(curl               --silent               --show-error               --compressed               --max-time 20               --user-agent 'IlkOkuBookIndex/0.1 (+https://ilkoku.com)'               --header 'Accept: text/html,application/xhtml+xml'               --header 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.5'               --dump-header "$headers"               --output "$body"               --write-out '%{http_code}'               "$url" || true)"

            bytes="$(wc -c < "$body" | tr -d ' ')"
            printf 'page=%s http_status=%s body_bytes=%s\n' "$page" "$code" "$bytes"

            case "$code" in
              200)
                node - "$body" "$page" <<'NODE'
          const fs = require("node:fs");

          const path = process.argv[2];
          const page = Number(process.argv[3]);
          const html = fs.readFileSync(path, "utf8");

          const ranks = [...html.matchAll(/\bzg-bdg-text\b[^>]*>\s*#(\d{1,3})\s*</giu)]
            .map((match) => Number(match[1]))
            .filter(Number.isInteger);
          const uniqueRanks = [...new Set(ranks)];

          const asins = [...html.matchAll(/\bdata-asin=["']([^"']+)["']/giu)]
            .map((match) => match[1].trim())
            .filter(Boolean);
          const uniqueAsins = [...new Set(asins)];

          const expectedStart = page === 1 ? 1 : 51;
          const expectedEnd = page === 1 ? 50 : 100;
          const expected = Array.from(
            { length: expectedEnd - expectedStart + 1 },
            (_, index) => expectedStart + index,
          );
          const rankSet = new Set(uniqueRanks);
          const missing = expected.filter((rank) => !rankSet.has(rank));

          console.log(`page=${page} rank_count=${ranks.length} unique_rank_count=${uniqueRanks.length}`);
          console.log(`page=${page} ranks=${uniqueRanks.join(",") || "NONE"}`);
          console.log(`page=${page} missing_expected=${missing.join(",") || "NONE"}`);
          console.log(`page=${page} asin_count=${asins.length} unique_asin_count=${uniqueAsins.length}`);
          NODE
                ;;
              403|429|503)
                printf 'page=%s access_state=blocked_or_unavailable\n' "$page"
                ;;
              000|'')
                printf 'page=%s access_state=request_failed\n' "$page"
                ;;
              *)
                printf 'page=%s access_state=http_%s\n' "$page" "$code"
                ;;
            esac
          done


      - name: Observe rendered DOM without login or cookies
        shell: bash
        run: |
          set -euo pipefail

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "render_probe=browser_unavailable"
            exit 0
          fi

          "$chrome" --version | sed 's/^/render_probe_browser=/'

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          urls=(
            'https://www.amazon.com.tr/gp/bestsellers/books'
            'https://www.amazon.com.tr/gp/bestsellers/books/ref=zg_bs_pg_2_books?ie=UTF8&pg=2'
          )

          for page in 1 2; do
            body="$tmpdir/rendered-$page.html"
            netlog="$tmpdir/net-$page.json"
            url="${urls[$((page - 1))]}"

            "$chrome"               --headless=new               --disable-gpu               --disable-dev-shm-usage               --no-sandbox               --lang=tr-TR               --window-size=1920,20000               --virtual-time-budget=10000               --log-net-log="$netlog"               --net-log-capture-mode=Everything               --dump-dom               "$url" > "$body" 2>/dev/null || true

            node - "$body" "$page" <<'NODE'
          const fs = require("node:fs");

          const path = process.argv[2];
          const page = Number(process.argv[3]);
          const html = fs.existsSync(path) ? fs.readFileSync(path, "utf8") : "";

          const ranks = [...html.matchAll(/\bzg-bdg-text\b[^>]*>\s*#(\d{1,3})\s*</giu)]
            .map((match) => Number(match[1]))
            .filter(Number.isInteger);
          const uniqueRanks = [...new Set(ranks)];

          const asins = [...html.matchAll(/\bdata-asin=["']([^"']+)["']/giu)]
            .map((match) => match[1].trim())
            .filter(Boolean);
          const uniqueAsins = [...new Set(asins)];

          const expectedStart = page === 1 ? 1 : 51;
          const expectedEnd = page === 1 ? 50 : 100;
          const expected = Array.from(
            { length: expectedEnd - expectedStart + 1 },
            (_, index) => expectedStart + index,
          );
          const rankSet = new Set(uniqueRanks);
          const missing = expected.filter((rank) => !rankSet.has(rank));

          console.log(`render_page=${page} bytes=${Buffer.byteLength(html)} rank_count=${ranks.length} unique_rank_count=${uniqueRanks.length}`);
          console.log(`render_page=${page} ranks=${uniqueRanks.join(",") || "NONE"}`);
          console.log(`render_page=${page} missing_expected=${missing.join(",") || "NONE"}`);
          console.log(`render_page=${page} asin_count=${asins.length} unique_asin_count=${uniqueAsins.length}`);
          NODE

            node - "$netlog" "$page" <<'NODE'
          const fs = require("node:fs");

          const path = process.argv[2];
          const page = Number(process.argv[3]);
          if (!fs.existsSync(path)) {
            console.log(`render_page=${page} netlog=missing`);
            process.exit(0);
          }

          let payload;
          try {
            payload = JSON.parse(fs.readFileSync(path, "utf8"));
          } catch {
            console.log(`render_page=${page} netlog=invalid_json`);
            process.exit(0);
          }

          const events = Array.isArray(payload?.events) ? payload.events : [];
          const nextPageMatcher = /\/acp\/eu-south-2\/p13n-zg-list-grid-desktop\/[^/]+\/nextPage/iu;
          const seeds = events.filter((event) => {
            const url = event?.params?.url;
            return typeof url === "string" && nextPageMatcher.test(url);
          });

          const typeMap = new Map(
            Object.entries(payload?.constants?.logEventTypes ?? {}).map(([name, value]) => [value, name]),
          );

          if (seeds.length === 0) {
            console.log(`render_page=${page} next_page_request=NOT_FOUND`);
            process.exit(0);
          }

          const seenSourceIds = new Set();
          for (const seed of seeds) {
            const sourceId = seed?.source?.id;
            if (sourceId == null || seenSourceIds.has(sourceId)) continue;
            seenSourceIds.add(sourceId);

            const sourceEvents = events.filter((event) => event?.source?.id === sourceId);
            const rawUrl = seed.params.url;
            const parsed = new URL(rawUrl);
            const queryKeys = [...parsed.searchParams.keys()].sort();
            const safePath = parsed.pathname.replace(
              /\/p13n-zg-list-grid-desktop\/[^/]+\/nextPage$/iu,
              "/p13n-zg-list-grid-desktop/{dynamic}/nextPage",
            );

            const methods = [...new Set(
              sourceEvents
                .map((event) => event?.params?.method)
                .filter((value) => typeof value === "string"),
            )];

            const responseCodes = new Set();
            for (const event of sourceEvents) {
              const directCode = event?.params?.response_code ?? event?.params?.status_code;
              if (Number.isInteger(directCode)) responseCodes.add(directCode);

              const headers = event?.params?.headers;
              if (Array.isArray(headers)) {
                for (const header of headers) {
                  if (typeof header !== "string") continue;
                  const match = header.match(/^HTTP\/\S+\s+(\d{3})\b/iu);
                  if (match) responseCodes.add(Number(match[1]));
                }
              }
            }

            const eventNames = [...new Set(
              sourceEvents
                .map((event) => typeMap.get(event.type))
                .filter(Boolean),
            )].sort();

            console.log(
              `render_page=${page} next_page_request=FOUND method=${methods.join(",") || "UNKNOWN"} status=${[...responseCodes].join(",") || "UNKNOWN"} path=${parsed.origin}${safePath} query_keys=${queryKeys.join(",") || "NONE"} source_event_count=${sourceEvents.length}`,
            );
            console.log(
              `render_page=${page} next_page_event_types=${eventNames.join(",") || "UNKNOWN"}`,
            );
          }
          NODE
          done


      - name: Characterize nextPage request and response without sensitive values
        shell: bash
        run: |
          set -euo pipefail

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "cdp_probe=browser_unavailable"
            exit 0
          fi

          tmpdir="$(mktemp -d)"
          profile="$tmpdir/profile"
          mkdir -p "$profile"

          "$chrome"             --headless=new             --disable-gpu             --disable-dev-shm-usage             --no-sandbox             --user-data-dir="$profile"             --remote-debugging-port=9222             about:blank >"$tmpdir/chrome.log" 2>&1 &
          chrome_pid=$!

          cleanup() {
            kill "$chrome_pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done

          node <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          if (typeof WebSocket !== "function") {
            console.log("cdp_probe=websocket_unavailable");
            process.exit(0);
          }

          const tabs = await fetch("http://127.0.0.1:9222/json/list").then((response) => response.json());
          const tab = tabs.find((candidate) => candidate.type === "page");
          if (!tab?.webSocketDebuggerUrl) {
            console.log("cdp_probe=page_target_unavailable");
            process.exit(0);
          }

          const ws = new WebSocket(tab.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.onopen = resolve;
            ws.onerror = reject;
          });

          let commandId = 0;
          const pending = new Map();
          const pageState = new Map();

          ws.onmessage = (message) => {
            const payload = JSON.parse(message.data);
            if (payload.id) {
              const waiter = pending.get(payload.id);
              if (!waiter) return;
              pending.delete(payload.id);
              if (payload.error) waiter.reject(new Error(payload.error.message));
              else waiter.resolve(payload.result ?? {});
              return;
            }

            if (payload.method === "Network.requestWillBeSent") {
              const request = payload.params?.request;
              const url = request?.url ?? "";
              if (!/\/acp\/eu-south-2\/p13n-zg-list-grid-desktop\/[^/]+\/nextPage/iu.test(url)) return;

              pageState.set(payload.params.requestId, {
                requestId: payload.params.requestId,
                url,
                method: request.method,
                postData: request.postData ?? null,
                hasPostData: Boolean(request.hasPostData || request.postData),
                headers: request.headers ?? {},
                responseStatus: null,
                mimeType: null,
                finished: false,
              });
              return;
            }

            if (payload.method === "Network.responseReceived") {
              const item = pageState.get(payload.params?.requestId);
              if (!item) return;
              item.responseStatus = payload.params?.response?.status ?? null;
              item.mimeType = payload.params?.response?.mimeType ?? null;
              return;
            }

            if (payload.method === "Network.loadingFinished") {
              const item = pageState.get(payload.params?.requestId);
              if (item) item.finished = true;
            }
          };

          function send(method, params = {}) {
            const id = ++commandId;
            return new Promise((resolve, reject) => {
              pending.set(id, { resolve, reject });
              ws.send(JSON.stringify({ id, method, params }));
            });
          }

          function bodyShape(item) {
            const body = item.postData ?? "";
            if (!body) return { format: "none", keys: [], suspiciousKeys: [], bytes: 0 };

            const contentTypeEntry = Object.entries(item.headers ?? {}).find(
              ([key]) => key.toLowerCase() === "content-type",
            );
            const contentType = String(contentTypeEntry?.[1] ?? "").toLowerCase();

            let format = contentType.split(";")[0] || "unknown";
            let keys = [];

            try {
              if (contentType.includes("application/json") || body.trim().startsWith("{")) {
                const parsed = JSON.parse(body);
                keys = parsed && typeof parsed === "object" && !Array.isArray(parsed)
                  ? Object.keys(parsed).sort()
                  : [];
                format = "json";
              } else {
                const params = new URLSearchParams(body);
                keys = [...new Set([...params.keys()])].sort();
                if (keys.length) format = "form";
              }
            } catch {
              format = format || "unparsed";
            }

            const suspiciousKeys = keys.filter((key) => /auth|csrf|nonce|session|token|credential|signature|secret/iu.test(key));
            return { format, keys, suspiciousKeys, bytes: Buffer.byteLength(body) };
          }

          async function summarizePage(page, url) {
            pageState.clear();

            await send("Emulation.setDeviceMetricsOverride", {
              width: 1920,
              height: 20000,
              deviceScaleFactor: 1,
              mobile: false,
            });
            await send("Page.navigate", { url });
            await sleep(7000);
            await send("Runtime.evaluate", {
              expression: "window.scrollTo(0, document.body.scrollHeight)",
            });
            await sleep(4000);

            const requests = [...pageState.values()];
            console.log(`cdp_page=${page} next_page_request_count=${requests.length}`);

            for (let index = 0; index < requests.length; index += 1) {
              const item = requests[index];
              const parsedUrl = new URL(item.url);
              const queryKeys = [...parsedUrl.searchParams.keys()].sort();
              const shape = bodyShape(item);

              let responseBytes = null;
              let responseRankCount = null;
              let responseAsinCount = null;
              let responseRankMin = null;
              let responseRankMax = null;

              if (item.finished) {
                try {
                  const response = await send("Network.getResponseBody", { requestId: item.requestId });
                  const body = response.base64Encoded
                    ? Buffer.from(response.body ?? "", "base64").toString("utf8")
                    : String(response.body ?? "");

                  responseBytes = Buffer.byteLength(body);
                  const ranks = [...body.matchAll(/zg-bdg-text[^#]{0,300}#(\d{1,3})/giu)]
                    .map((match) => Number(match[1]))
                    .filter(Number.isInteger);
                  const asins = [...body.matchAll(/data-asin(?:\\?"|["'])?\s*[:=]\s*(?:\\?"|["'])([A-Z0-9]{10})/giu)]
                    .map((match) => match[1]);

                  const uniqueRanks = [...new Set(ranks)].sort((a, b) => a - b);
                  const uniqueAsins = [...new Set(asins)];

                  responseRankCount = uniqueRanks.length;
                  responseAsinCount = uniqueAsins.length;
                  responseRankMin = uniqueRanks[0] ?? null;
                  responseRankMax = uniqueRanks.at(-1) ?? null;
                } catch {
                  responseBytes = -1;
                }
              }

              const safePath = parsedUrl.pathname.replace(
                /\/p13n-zg-list-grid-desktop\/[^/]+\/nextPage$/iu,
                "/p13n-zg-list-grid-desktop/{dynamic}/nextPage",
              );

              console.log(
                [
                  `cdp_page=${page}`,
                  `request_index=${index + 1}`,
                  `method=${item.method || "UNKNOWN"}`,
                  `status=${item.responseStatus ?? "UNKNOWN"}`,
                  `mime=${item.mimeType || "UNKNOWN"}`,
                  `path=${parsedUrl.origin}${safePath}`,
                  `query_keys=${queryKeys.join(",") || "NONE"}`,
                  `post_format=${shape.format}`,
                  `post_keys=${shape.keys.join(",") || "NONE"}`,
                  `post_bytes=${shape.bytes}`,
                  `suspicious_post_keys=${shape.suspiciousKeys.join(",") || "NONE"}`,
                  `response_bytes=${responseBytes ?? "UNKNOWN"}`,
                  `response_rank_count=${responseRankCount ?? "UNKNOWN"}`,
                  `response_rank_min=${responseRankMin ?? "NONE"}`,
                  `response_rank_max=${responseRankMax ?? "NONE"}`,
                  `response_asin_count=${responseAsinCount ?? "UNKNOWN"}`,
                ].join(" "),
              );
            }
          }

          await send("Network.enable", { maxPostDataSize: 1048576 });
          await send("Page.enable");

          await summarizePage(1, "https://www.amazon.com.tr/gp/bestsellers/books");
          await summarizePage(2, "https://www.amazon.com.tr/gp/bestsellers/books/ref=zg_bs_pg_2_books?ie=UTF8&pg=2");

          ws.close();
          NODE

name: Book Index BKM Probe

on:
  push:
    branches:
      - feature/book-index-bkm-collector
    paths:
      - ".github/workflows/book-index-bkm-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect BKM top-sellers JSON once
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          url="https://bkm-best.wawlabs.com/top_sellers?span=week"
          code="$(curl -L --silent --show-error --max-time 25 -A "$ua"             -H 'Content-Type: application/json' -o /tmp/bkm.json -w "%{http_code}" "$url")"
          echo "HTTP_STATUS=$code BYTES=$(wc -c < /tmp/bkm.json)"

          python3 - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path("/tmp/bkm.json").read_text(errors="replace"))
          print("ROOT_TYPE",type(data).__name__)
          if isinstance(data,dict):
              print("ROOT_KEYS",list(data.keys()))
              for key,value in data.items():
                  if isinstance(value,list):
                      print("LIST",key,"LEN",len(value))
                      for item in value[:5]:
                          print(json.dumps(item,ensure_ascii=False)[:5000])
                  elif isinstance(value,dict):
                      print("DICT",key,"KEYS",list(value.keys())[:50])
                      print(json.dumps(value,ensure_ascii=False)[:12000])
                  else:
                      print(key,repr(value))
          elif isinstance(data,list):
              print("LEN",len(data))
              for item in data[:10]:
                  print(json.dumps(item,ensure_ascii=False)[:5000])
          PY

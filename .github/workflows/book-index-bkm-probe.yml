name: Book Index BKM Probe

on:
  push:
    branches:
      - feature/book-index-bkm-collector
    paths:
      - ".github/workflows/book-index-bkm-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public WAW bestseller client once
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          script="https://collector.wawlabs.com/bkmkitapv2.js"
          code="$(curl -L --silent --show-error --max-time 25 -A "$ua" -o /tmp/waw.js -w "%{http_code}" "$script")"
          echo "HTTP_STATUS=$code BYTES=$(wc -c < /tmp/waw.js)"

          python3 - <<'PY'
          from pathlib import Path
          import re

          text=Path("/tmp/waw.js").read_text(errors="replace")
          print("--- URLS ---")
          urls=[]
          for m in re.finditer(r'https?://[^"\'\s)]+',text):
              value=m.group(0)
              if value not in urls: urls.append(value)
          for value in urls[:200]: print(value)

          print("\n--- REQUEST SIGNALS ---")
          for pattern in [
            r'fetch\([^;]{0,2400}',
            r'axios\.[a-z]+\([^;]{0,2400}',
            r'XMLHttpRequest[^;]{0,2400}',
            r'wawlabs[^;]{0,2400}',
            r'best[^;]{0,2400}',
            r'product[^;]{0,2400}',
          ]:
              print("\n###",pattern)
              shown=0
              for m in re.finditer(pattern,text,re.I|re.S):
                  print(m.group(0)[:2800].replace("\n"," "))
                  shown+=1
                  if shown>=15: break
              print("COUNT",shown)
          PY

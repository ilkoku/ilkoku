name: Book Index BKM Probe

on:
  push:
    branches:
      - feature/book-index-bkm-collector
    paths:
      - ".github/workflows/book-index-bkm-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify BKM public bestseller spans
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          for span in week month year; do
            url="https://bkm-best.wawlabs.com/top_sellers?span=$span"
            out="/tmp/bkm-$span.json"
            code="$(curl -L --silent --show-error --max-time 25 -A "$ua"               -H 'Content-Type: application/json' -o "$out" -w "%{http_code}" "$url")"
            echo "SPAN=$span HTTP=$code BYTES=$(wc -c < "$out")"
            python3 - "$out" "$span" <<'PY'
          import json,sys
          path,span=sys.argv[1],sys.argv[2]
          data=json.load(open(path,encoding="utf-8"))
          items=data.get("res") or []
          print("COUNT",len(items),"TOTAL",data.get("total_item_count"))
          if items:
              first=items[0]
              print("FIRST",{
                  "title":first.get("title"),
                  "writer":first.get("writer"),
                  "gtin":first.get("gtin"),
                  "tip":first.get("tip"),
                  "ix":first.get("ix"),
                  "link":first.get("link"),
              })
          PY
          done

name: Book Index BKM Probe

on:
  push:
    branches:
      - feature/book-index-bkm-collector
    paths:
      - ".github/workflows/book-index-bkm-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract real rendered BKM product cards
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          url="https://www.bkmkitap.com/cok-satan-kitaplar"
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --user-agent="$ua" --virtual-time-budget=10000 --dump-dom "$url"             > /tmp/bkm-rendered.html 2>/tmp/chrome.err || true

          python3 - <<'PY'
          from pathlib import Path
          import re, html

          text=Path("/tmp/bkm-rendered.html").read_text(errors="replace")

          tags=list(re.finditer(
            r'<(?:div|li)\b[^>]*class=["\'][^"\']*\bwaw-product-item-area\b[^"\']*["\'][^>]*>',
            text,
            re.I
          ))
          print("REAL_CARD_TAGS", len(tags))

          for idx,m in enumerate(tags[:6],1):
            start=m.start()
            window=text[start:start+7500]
            print(f"\n=== REAL CARD {idx} ===")
            print(window)

            hrefs=re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>',window,re.I)
            titles=re.findall(r'<[^>]*class=["\'][^"\']*\bproduct-title\b[^"\']*["\'][^>]*>([\s\S]{0,800}?)</[^>]+>',window,re.I)
            spans=re.findall(r'<span\b[^>]*>([\s\S]{0,500}?)</span>',window,re.I)

            print("--- SUMMARY ---")
            print("HREFS", hrefs[:10])
            print("TITLES", [html.unescape(re.sub(r'<[^>]+>',' ',x)).strip() for x in titles[:5]])
            clean_spans=[]
            for x in spans[:20]:
              y=html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',x))).strip()
              if y: clean_spans.append(y)
            print("SPANS", clean_spans[:20])

          print("\n=== DISTINCT PRODUCT LINKS ===")
          seen=[]
          for m in tags:
            window=text[m.start():m.start()+6000]
            for href in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>',window,re.I):
              if href.startswith("https://www.bkmkitap.com/") and href not in seen:
                seen.append(href)
                break
          print("COUNT",len(seen))
          for href in seen[:30]:
            print(href)
          PY

name: Book Index BKM Probe

on:
  push:
    branches:
      - feature/book-index-bkm-collector
    paths:
      - ".github/workflows/book-index-bkm-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect BKM dynamic-loading signals once
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.bkmkitap.com/cok-satan-kitaplar"
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          code="$(curl -L --silent --show-error --max-time 25 -A "$ua" -o /tmp/bkm.html -w "%{http_code}" "$url")"
          echo "HTTP_STATUS=$code"
          echo "BYTES=$(wc -c < /tmp/bkm.html)"

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("/tmp/bkm.html").read_text(errors="replace")
          print("PRODUCT_DATA occurrences:", len(re.findall(r"PRODUCT_DATA", text)))

          patterns = [
              r"PRODUCT_DATA\s*=\s*[^;]{0,1000}",
              r"PRODUCT_DATA\.push\([^)]{0,1800}\)",
              r"ajax\.php[^\"'\s<]{0,500}",
              r"/srv/[^\"'\s<]{1,500}",
              r"fetch\([^)]{0,1000}\)",
              r"XMLHttpRequest[^;]{0,1500}",
              r"DYNAMIC_LOADING[^;]{0,1200}",
              r"PAGE_ID\s*=\s*17[^;]{0,1200}",
          ]

          for pattern in patterns:
              print("\n---", pattern, "---")
              count = 0
              for m in re.finditer(pattern, text, re.I | re.S):
                  print(m.group(0)[:2200].replace("\n", " "))
                  count += 1
                  if count >= 20:
                      break
              print("COUNT_SHOWN", count)

          print("\n--- script src values containing product/list/category ---")
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', text, re.I):
              if any(k in src.casefold() for k in ["product", "list", "category", "tsoft"]):
                  print(src)
          PY

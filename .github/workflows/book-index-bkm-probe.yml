name: Book Index BKM Probe

on:
  push:
    branches:
      - feature/book-index-bkm-collector
    paths:
      - ".github/workflows/book-index-bkm-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect rendered BKM product card structure once
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          url="https://www.bkmkitap.com/cok-satan-kitaplar"
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --user-agent="$ua" --virtual-time-budget=10000 --dump-dom "$url"             > /tmp/bkm-rendered.html 2>/tmp/chrome.err || true

          python3 - <<'PY'
          from pathlib import Path
          import re, html
          text=Path("/tmp/bkm-rendered.html").read_text(errors="replace")

          print("WAW_PRODUCT_ITEM_OCCURRENCES", len(re.findall(r"waw-product-item", text, re.I)))
          pos=0
          shown=0
          while shown < 8:
            p=text.find("waw-product-item", pos)
            if p<0: break
            print(f"\n### CARD WINDOW {shown+1} pos={p}")
            print(text[max(0,p-500):p+5500])
            pos=p+20
            shown+=1

          print("\n--- LI/DIV CLASS COUNTS around products ---")
          for cls in [
            "waw-product-item-area",
            "waw-product-item",
            "productName",
            "product-name",
            "product-title",
            "detailLink",
            "brand-name",
            "product-price",
          ]:
            print(cls, text.casefold().count(cls.casefold()))

          print("\n--- PRODUCT-LIKE JSON/ATTRIBUTES ---")
          for pattern in [
            r'data-product-id=["\']([^"\']+)',
            r'data-id=["\']([^"\']+)',
            r'data-name=["\']([^"\']+)',
            r'data-url=["\']([^"\']+)',
          ]:
            vals=re.findall(pattern,text,re.I)
            print(pattern, vals[:25])
          PY

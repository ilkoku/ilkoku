name: Book Index BKM Probe

on:
  push:
    branches:
      - feature/book-index-bkm-collector
    paths:
      - ".github/workflows/book-index-bkm-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect WAW request payload construction once
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          curl -L --silent --show-error --max-time 25 -A "$ua"             -o /tmp/waw.js "https://collector.wawlabs.com/bkmkitapv2.js"

          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path("/tmp/waw.js").read_text(errors="replace")

          for token in [
            "serviceUrl",
            "search_v2",
            "search_params",
            "top_searches",
            "page_number",
            "page_size",
            "companyID",
            "KNZWB-1614254422",
          ]:
              print(f"\n=== {token} ===")
              positions=[m.start() for m in re.finditer(re.escape(token),text)]
              print("COUNT",len(positions))
              for p in positions[:20]:
                  print(text[max(0,p-1800):p+3600])

          print("\n=== OBJECT ASSIGNMENTS NEAR serviceUrl ===")
          for m in re.finditer(r'\{[^{}]{0,5000}serviceUrl[^{}]{0,5000}\}',text,re.I|re.S):
              print(m.group(0)[:10000])
          PY

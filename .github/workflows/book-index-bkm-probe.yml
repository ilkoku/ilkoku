name: Book Index BKM Probe

on:
  push:
    branches:
      - feature/book-index-bkm-collector
    paths:
      - ".github/workflows/book-index-bkm-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture BKM public list network transport once
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          url="https://www.bkmkitap.com/cok-satan-kitaplar"
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"

          "$chrome"             --headless=new             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --user-agent="$ua"             --virtual-time-budget=10000             --log-net-log=/tmp/netlog.json             --net-log-capture-mode=IncludeSensitive             --dump-dom "$url"             > /tmp/bkm-rendered.html 2>/tmp/chrome.err || true

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          path=Path("/tmp/netlog.json")
          print("NETLOG_BYTES", path.stat().st_size if path.exists() else 0)
          if not path.exists():
              raise SystemExit(1)

          data=json.loads(path.read_text(errors="replace"))
          urls=[]
          for event in data.get("events",[]):
              params=event.get("params") or {}
              candidates=[]
              for key in ("url","original_url","redirect_url"):
                  value=params.get(key)
                  if isinstance(value,str):
                      candidates.append(value)
              for value in candidates:
                  low=value.casefold()
                  if "bkmkitap.com" not in low and "cdn.bkmkitap.com" not in low:
                      continue
                  if any(token in low for token in [
                      "waw","best","product","search","filter","sort","category",
                      "service","ajax","api","cok-satan"
                  ]):
                      if value not in urls:
                          urls.append(value)

          print("--- CANDIDATE NETWORK URLS ---")
          for value in urls[:200]:
              print(value)

          rendered=Path("/tmp/bkm-rendered.html").read_text(errors="replace")
          print("--- INLINE WAW URL SIGNALS ---")
          seen=[]
          for m in re.finditer(r'["\']([^"\']{1,600})["\']', rendered):
              value=m.group(1)
              low=value.casefold()
              if "waw" in low or ("bkmkitap.com" in low and any(k in low for k in ["api","service","search","product"])):
                  if value not in seen:
                      seen.append(value)
          for value in seen[:200]:
              print(value)
          PY

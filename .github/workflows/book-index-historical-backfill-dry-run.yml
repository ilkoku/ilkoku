name: Book Index idefix historical backfill dry run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/book-index-historical-backfill-dry-run.yml"
      - "src/app/api/internal/book-index-historical-backfill-dry-run/route.ts"
      - "src/lib/book-index/idefix-historical-backfill.ts"
      - "src/lib/book-index/sources/idefix.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: book-index-idefix-historical-backfill-dry-run
  cancel-in-progress: true

jobs:
  probe:
    name: Measure recoverable historical idefix metadata
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read historical idefix recovery candidates with GitHub OIDC
        env:
          OIDC_AUDIENCE: ilkoku-book-index-historical-backfill-dry-run
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            oidc_response="$(curl --fail-with-body --silent --show-error --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"
            oidc_token="$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            test -n "$oidc_token"

            if response="$(curl --fail-with-body --silent --show-error --max-time 285 --header "Authorization: Bearer $oidc_token" https://ilkoku.com/api/internal/book-index-historical-backfill-dry-run)"; then
              if printf '%s' "$response" | python3 -c 'import json,sys; payload=json.load(sys.stdin); dry=payload.get("dryRun", {}); required=("mode","candidateCount","recoverableCount","recoveredAuthorCount","recoveredIsbn13Count","unresolvedCount","errorCount","recoverableSamples","unresolvedSamples","errorSamples"); raise SystemExit(0 if payload.get("ok") is True and dry.get("mode") == "read_only" and all(key in dry for key in required) else 1)'; then
                printf '%s' "$response" | python3 -m json.tool
                exit 0
              fi
            fi

            if [ "$attempt" -lt 20 ]; then
              sleep 15
            fi
          done

          exit 1

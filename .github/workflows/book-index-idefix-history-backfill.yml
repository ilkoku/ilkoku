name: Book Index idefix history backfill

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/book-index-idefix-history-backfill.yml"
      - "src/app/api/internal/book-index-idefix-history-backfill/route.ts"
      - "src/lib/book-index/idefix-history-backfill.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: book-index-idefix-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill bounded historical idefix metadata
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Apply bounded historical backfill with GitHub OIDC
        env:
          OIDC_AUDIENCE: ilkoku-book-index-idefix-history-backfill
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            oidc_response="$(curl --fail-with-body --silent --show-error --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"
            oidc_token="$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            test -n "$oidc_token"

            if response="$(curl --fail-with-body --silent --show-error --max-time 280 --request POST --header "Authorization: Bearer $oidc_token" https://ilkoku.com/api/internal/book-index-idefix-history-backfill)"; then
              if printf '%s' "$response" | python3 -c 'import json,sys; p=json.load(sys.stdin); required=("mode","candidateCount","fetchSuccessCount","fetchErrorCount","recoverableCandidateCount","metadataUpdatedCount","matchedCount","pendingAfterMetadataCount","skippedRaceCount","unresolvedCount","updatedSamples","readiness"); raise SystemExit(0 if p.get("ok") is True and p.get("mode") == "apply" and all(k in p for k in required) else 1)'; then
                printf '%s' "$response" > backfill.json
                python3 - <<'PY'
          import json

          with open("backfill.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
                exit 0
              fi
            fi

            if [ "$attempt" -lt 20 ]; then
              sleep 15
            fi
          done

          exit 1

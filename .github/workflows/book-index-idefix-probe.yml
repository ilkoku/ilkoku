name: Book Index idefix Probe

on:
  push:
    branches:
      - feature/book-index-idefix-collector
    paths:
      - ".github/workflows/book-index-idefix-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect idefix Next data and book-filter candidates
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          for suffix in "" "?Category=3307" "?category=3307" "?categories=3307"; do
            key="$(echo "$suffix" | tr -cd '[:alnum:]' | head -c 30)"
            [[ -n "$key" ]] || key="base"
            url="https://www.idefix.com/cok-satanlar-l-162$suffix"
            code="$(curl -L --silent --show-error --max-time 25 -A "$ua" -o "/tmp/$key.html" -w "%{http_code}" "$url" || true)"
            echo "FETCH $url HTTP=$code BYTES=$(wc -c < "/tmp/$key.html" 2>/dev/null || echo 0) FILE=$key"
          done

          python3 - <<'PY'
from pathlib import Path
import re, json

for path in sorted(Path("/tmp").glob("*.html")):
    if path.name not in {"base.html","Category3307.html","category3307.html","categories3307.html"}:
        continue
    text=path.read_text(errors="replace")
    m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', text, re.S|re.I)
    print("\n===", path.name, "NEXT=", bool(m), "===")
    if not m:
        continue
    data=json.loads(m.group(1))
    props=data.get("props",{}).get("pageProps",{})
    landing=props.get("landingData") or {}
    items=landing.get("items") or []
    cats=landing.get("categories") or []
    print("URL_PAGE", data.get("page"), "QUERY", data.get("query"))
    print("ITEMS", len(items))
    print("CATEGORIES", [(c.get("id"),c.get("name"),c.get("isActive"),c.get("count")) for c in cats[:12]])
    book_count=0
    for i,item in enumerate(items[:80],1):
        tree=item.get("categoryTree") or []
        is_book=any(c.get("id")==3307 or c.get("name")=="Kitap" for c in tree)
        if is_book: book_count+=1
        variant=(item.get("variants") or [{}])[0]
        print("ITEM",i,{
            "book":is_book,
            "name":item.get("originalName") or item.get("name"),
            "author":item.get("authorName"),
            "brand":item.get("brandName"),
            "variantId":variant.get("id"),
            "url":variant.get("handleUrl"),
            "sponsored":variant.get("isSponsored"),
            "price":variant.get("discountedSalesPrice") or variant.get("price"),
        })
    print("BOOKS_IN_FIRST_80",book_count)

    raw=m.group(1)
    for needle in ["3307","Category","category","filter","selectedCategory","currentCategory"]:
        print("RAW_NEEDLE",needle,raw.find(needle))
PY

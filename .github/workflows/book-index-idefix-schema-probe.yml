name: Book Index idefix schema probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/book-index-idefix-schema-probe.yml"
      - "src/app/api/internal/book-index-idefix-schema/route.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: book-index-idefix-schema-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Inspect production idefix payload shape
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read idefix schema with GitHub OIDC
        env:
          OIDC_AUDIENCE: ilkoku-idefix-schema-probe
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            oidc_response="$(curl --fail-with-body --silent --show-error --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"
            oidc_token="$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            test -n "$oidc_token"

            if response="$(curl --fail-with-body --silent --show-error --max-time 60 --header "Authorization: Bearer $oidc_token" https://ilkoku.com/api/internal/book-index-idefix-schema)"; then
              if printf '%s' "$response" | python3 -c 'import json,sys; payload=json.load(sys.stdin); raise SystemExit(0 if payload.get("ok") is True and payload.get("sampleCount", 0) > 0 else 1)'; then
                printf '%s
' "$response" | python3 -m json.tool
                exit 0
              fi
            fi

            if [ "$attempt" -lt 20 ]; then
              sleep 15
            fi
          done

          exit 1

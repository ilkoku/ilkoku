name: Book Index Inkilap Probe

on:
  push:
    branches:
      - feature/book-index-inkilap-collector
    paths:
      - ".github/workflows/book-index-inkilap-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Inkilap product cards
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          url="https://www.inkilap.com/cok-satanlar"
          curl -L --silent --show-error --max-time 25 -A "$ua" -o /tmp/page.html "$url"

          python3 - <<'PY'
          from pathlib import Path
          import re, html
          text=Path("/tmp/page.html").read_text(errors="replace")
          starts=list(re.finditer(r'<div\b[^>]*class=["\'][^"\']*\bproductBox\b[^"\']*["\'][^>]*>',text,re.I))
          print("CARD_COUNT",len(starts))
          for idx,m in enumerate(starts[:6]):
              start=m.start()
              end=starts[idx+1].start() if idx+1<len(starts) else min(len(text),start+15000)
              card=text[start:end]
              print(f"\n--- CARD {idx+1} ---")
              print(card[:10000].replace("\n"," "))

              def clean(s):
                  return html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',s))).strip()

              print("LINKS")
              for href,body in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]{0,1400}?)</a>',card,re.I):
                  c=clean(body)
                  if c:
                      print(href,"=>",c[:240])
          PY

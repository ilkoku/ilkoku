name: Book Index KitapSec general live probe

on:
  push:
    branches:
      - research/book-index-kitapsec-general-live-probe-01ak-al3ah-e1
    paths:
      - ".github/workflows/book-index-kitapsec-general-live-probe.yml"
      - "src/lib/book-index/sources/kitapsec.ts"

permissions:
  contents: read

jobs:
  probe:
    name: Run KitapSec general parser without collecting
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inspect two missing-ISBN product details
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://www.kitapsec.com/Products/2026-MEB-AGS-Egitim-Bilimleri-ve-Turk-Milli-Egitim-Sistemi-Video-Ders-Notlari-Soru-Bankasi-2-li-Set-Indeks-Akademi-Yayincilik-930456.html'
            'https://www.kitapsec.com/Products/2026-KPSS-MEB-AGS-35-Gunde-Haritalarla-Kodlamalarla-Cografyanin-Kodlari-Video-Ders-Notlari-Kitabi-Soru-Bankasi-2-li-Set-Yunus-Turan-EDU-Kariyer-926943.html'
          )

          for index in 0 1; do
            body="$(mktemp)"
            code="$(curl --silent --show-error --compressed --max-time 20 \
              --user-agent 'IlkOkuBookIndex/0.1 (+https://ilkoku.com)' \
              --header 'Accept: text/html,application/xhtml+xml' \
              --output "$body" --write-out '%{http_code}' "${urls[$index]}" || true)"
            printf 'detail_index=%s http_status=%s\n' "$index" "$code"
            if [ "$code" = "200" ]; then
              node - "$body" "$index" <<'NODE'
          const fs = require("node:fs");
          const bytes = fs.readFileSync(process.argv[2]);
          const html = new TextDecoder("windows-1254").decode(bytes);
          const index = process.argv[3];
          const text = html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/giu, " ")
            .replace(/<style\b[^>]*>[\s\S]*?<\/style>/giu, " ")
            .replace(/<[^>]+>/gu, " ")
            .replace(/&nbsp;/giu, " ")
            .replace(/\s+/gu, " ");

          const schemaIsbn = html.match(/itemprop=["']isbn["'][^>]*content=["']([^"']+)["']/iu)?.[1]
            || html.match(/content=["']([^"']+)["'][^>]*itemprop=["']isbn["']/iu)?.[1]
            || html.match(/itemprop=["']isbn["'][^>]*>([^<]+)</iu)?.[1]
            || null;
          const anyIsbn = text.match(/(?:ISBN(?:-13)?\s*[:\-]?\s*)?(97[89][0-9]{10})/iu)?.[1] || null;
          const authorLabel = text.match(
            /\bYazar\s*:\s*(.+?)\s+(?:Kazancınız|Kazanacağınız Puan|Sayfa Sayısı|Kitap Ebatı|Toplam Satılan)\s*:/iu,
          )?.[1]?.trim() || null;

          console.log(`detail_index=${index} schema_isbn=${schemaIsbn || "NONE"} any_isbn13=${anyIsbn || "NONE"} parsed_author=${authorLabel || "NONE"}`);

          for (const marker of ["ISBN", "Yazar"]) {
            const pos = text.search(new RegExp(marker, "iu"));
            if (pos >= 0) {
              console.log(`detail_index=${index} marker=${marker} snippet=${text.slice(Math.max(0, pos - 250), pos + 700)}`);
            }
          }
          NODE
            fi
            rm -f "$body"
          done

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Compile parser dependencies
        run: |
          rm -rf /tmp/kitapsec-parser
          npx tsc \
            src/lib/book-index/adapter.ts \
            src/lib/book-index/html.ts \
            src/lib/book-index/sources/kitapsec.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --skipLibCheck \
            --esModuleInterop \
            --outDir /tmp/kitapsec-parser

      - name: Run parser against official public general bestseller page
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { kitapSecBookIndexAdapter } = require("/tmp/kitapsec-parser/sources/kitapsec.js");

          const suspicious = /(dergi|puzzle|yapboz|defter|ajanda|boyama|poster|kart|oyun|seti|magnet|sticker)/iu;

          (async () => {
            const result = await kitapSecBookIndexAdapter.collect({
              listCode: "kitapsec-general-live-canary",
              sourceUrl: "https://www.kitapsec.com/Cok-Satanlar/1-6-0a0-0-0-0-0-0-4.xhtml",
              observedAt: new Date(),
            });

            const books = result.books;
            const isbnCount = books.filter((book) => book.isbn13).length;
            const suspiciousBooks = books
              .filter((book) => suspicious.test(book.title))
              .map((book) => ({
                rank: book.rank,
                sourceKey: book.sourceKey,
                title: book.title,
                productUrl: book.productUrl,
                isbn13: book.isbn13 ?? null,
              }));

            console.log("book_count=" + books.length);
            console.log("first_rank=" + books[0]?.rank);
            console.log("last_rank=" + books.at(-1)?.rank);
            const missingIsbnBooks = books
              .filter((book) => !book.isbn13)
              .map((book) => ({
                rank: book.rank,
                sourceKey: book.sourceKey,
                sourceExternalId: book.sourceExternalId ?? null,
                title: book.title,
                publisherName: book.publisherName ?? null,
                productUrl: book.productUrl,
              }));

            console.log("isbn13_count=" + isbnCount);
            console.log("missing_isbn_count=" + missingIsbnBooks.length);
            console.log("missing_isbn_books=" + JSON.stringify(missingIsbnBooks));
            console.log("suspicious_title_count=" + suspiciousBooks.length);
            console.log("suspicious_titles=" + JSON.stringify(suspiciousBooks));

            const expectedRanks = Array.from({ length: 56 }, (_, index) => index + 1)
              .filter((rank) => rank !== 30);
            const actualRanks = books.map((book) => book.rank);

            if (
              books.length !== 55 ||
              books[0]?.rank !== 1 ||
              books.at(-1)?.rank !== 56 ||
              actualRanks.length !== expectedRanks.length ||
              actualRanks.some((rank, index) => rank !== expectedRanks[index])
            ) {
              throw new Error("KITAPSEC_GENERAL_LIVE_CONTRACT_FAILED");
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

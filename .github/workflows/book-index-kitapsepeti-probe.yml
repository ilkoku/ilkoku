name: Book Index KitapSepeti Probe

on:
  push:
    branches:
      - feature/book-index-kitapsepeti-collector
    paths:
      - ".github/workflows/book-index-kitapsepeti-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect KitapSepeti bestseller markup
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          url="https://www.kitapsepeti.com/cok-satan-kitaplar"
          code="$(curl -L --silent --show-error --max-time 25 -A "$ua" -o /tmp/page.html -w "%{http_code}" "$url")"
          echo "HTTP_STATUS=$code"
          echo "BYTES=$(wc -c < /tmp/page.html)"

          python3 - <<'PY'
          from pathlib import Path
          import re, html

          text=Path("/tmp/page.html").read_text(errors="replace")
          needles=["Sarkaç 1: Kurma Bebek","Oyuncak Mahşeri","Altı Harfli Bir Tatlı"]
          for needle in needles:
              p=text.find(needle)
              print(f"--- {needle} pos={p} ---")
              if p>=0:
                  print(text[max(0,p-2500):p+4500])

          classes=[]
          for m in re.finditer(r'class=["\']([^"\']*(?:product|urun|item)[^"\']*)["\']', text, re.I):
              value=m.group(1)
              if value not in classes:
                  classes.append(value)
          print("--- CLASSES ---")
          for c in classes[:120]:
              print(c)

          print("--- PRODUCT LINKS ---")
          seen=set()
          for href, body in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]{0,700}?)</a>', text, re.I):
              clean=html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',body))).strip()
              if not clean or href in seen:
                  continue
              if clean in needles or any(x.casefold() in clean.casefold() for x in ["Sarkaç 1", "Oyuncak Mahşeri", "Altı Harfli"]):
                  seen.add(href)
                  print(href, "=>", clean)
          PY

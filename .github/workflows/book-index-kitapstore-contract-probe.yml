name: Book Index KitapStore contract probe

on:
  push:
    branches:
      - research/book-index-kitapstore-contract-01ak-ah
    paths:
      - ".github/workflows/book-index-kitapstore-contract-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Locate KitapStore bestseller list boundary
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public page-one semantic boundary
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          code="$(curl --silent --show-error --compressed --max-time 25             --user-agent 'IlkOkuBookIndex/0.1 (+https://ilkoku.com)'             --header 'Accept: text/html,application/xhtml+xml'             --output "$body" --write-out '%{http_code}'             'https://www.kitapstore.com/liste/2/cok-satanlar/' || true)"
          printf 'http_status=%s\n' "$code"
          test "$code" = "200"

          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const target = html.indexOf('id="Urun-616428"');
          if (target < 0) throw new Error("target_missing");

          const start = Math.max(0, target - 12000);
          const prefix = html.slice(start, target);
          const semanticLines = prefix
            .replace(/></g, ">\n<")
            .split(/\n/)
            .filter(line =>
              /ÇOK SATANLAR|COK SATANLAR|Cok Satanlar|Liste|Urun|ul\b|ol\b|section\b|class=|id=/i.test(line)
            )
            .slice(-100);
          console.log("--- semantic_boundary_start ---");
          console.log(semanticLines.join("\n"));
          console.log("--- semantic_boundary_end ---");

          const bookStarts = [...html.matchAll(/<li\b(?=[^>]*itemtype=["']http:\/\/schema\.org\/Book["'])(?=[^>]*id=["']Urun-([0-9]+)["'])[^>]*>/giu)];
          const targetIndex = bookStarts.findIndex(m => m[1] === "616428");
          console.log(`book_card_count=${bookStarts.length}`);
          console.log(`target_card_index=${targetIndex}`);
          console.log(`book_ids=${bookStarts.map(m=>m[1]).join(",")}`);
          NODE

name: Book Index KitapStore DOM probe

on:
  push:
    branches:
      - research/book-index-kitapstore-dom-01ak-ak
    paths:
      - ".github/workflows/book-index-kitapstore-dom-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Observe KitapStore bestseller card markup
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch first public bestseller page without collecting
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          code="$(curl --silent --show-error --compressed --max-time 20             --user-agent 'IlkOkuBookIndex/0.1 (+https://ilkoku.com)'             --header 'Accept: text/html,application/xhtml+xml'             --header 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.5'             --output "$body" --write-out '%{http_code}'             'https://www.kitapstore.com/liste/2/cok-satanlar/!Sayfa=1' || true)"

          printf 'http_status=%s\n' "$code"
          test "$code" = "200"

          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");

          const headings = [...html.matchAll(/ÇOK\s*SATANLAR/giu)];
          const headingIndex = headings.at(-1)?.index ?? -1;
          console.log("bestseller_heading_count=" + headings.length);
          console.log("last_bestseller_heading_index=" + headingIndex);
          if (headingIndex < 0) throw new Error("bestseller heading not found");

          const hrefRe = /href=["']([^"']*\/urun\/([0-9]+)\/[^"']+)["']/giu;
          const hrefs = [...html.matchAll(hrefRe)]
            .map((m) => ({ href: m[1], id: m[2], index: m.index }))
            .filter((h) => h.index > headingIndex);

          const unique = [];
          const seen = new Set();
          for (const item of hrefs) {
            if (seen.has(item.href)) continue;
            seen.add(item.href);
            unique.push(item);
          }

          console.log("unique_product_links_after_heading=" + unique.length);
          console.log("first_unique_product_links=" + JSON.stringify(unique.slice(0, 12)));

          const first = unique[0];
          if (!first) throw new Error("no product link after bestseller heading");

          const start = Math.max(0, first.index - 2200);
          const end = Math.min(html.length, first.index + 5200);
          const snippet = html.slice(start, end)
            .replace(/\r?\n/g, " ")
            .replace(/\s+/g, " ")
            .replace(/<!--([\s\S]*?)-->/g, "");

          console.log("FIRST_PRODUCT_SNIPPET_START");
          console.log(snippet);
          console.log("FIRST_PRODUCT_SNIPPET_END");
          NODE

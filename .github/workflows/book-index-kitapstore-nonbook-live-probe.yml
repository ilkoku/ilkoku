name: Book Index KitapStore non-book exclusion live probe

on:
  push:
    branches:
      - research/book-index-kitapstore-nonbook-live-01ak-al
    paths:
      - ".github/workflows/book-index-kitapstore-nonbook-live-probe.yml"
      - "src/lib/book-index/sources/kitapstore.ts"

permissions:
  contents: read

jobs:
  probe:
    name: Verify exact non-book exclusions on live Top 100
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Compile research parser
        run: |
          rm -rf /tmp/kitapstore-parser
          npx tsc \
            src/lib/book-index/adapter.ts \
            src/lib/book-index/html.ts \
            src/lib/book-index/sources/kitapstore.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --skipLibCheck \
            --esModuleInterop \
            --outDir /tmp/kitapstore-parser

      - name: Verify live exclusions without collecting
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {
            kitapStoreBookIndexResearchAdapter,
          } = require("/tmp/kitapstore-parser/sources/kitapstore.js");

          (async () => {
            const result = await kitapStoreBookIndexResearchAdapter.collect({
              listCode: "kitapstore-tr-live",
              sourceUrl: "https://www.kitapstore.com/liste/2/cok-satanlar/!Sayfa=1",
              observedAt: new Date(),
            });

            const books = result.books;
            const ranks = books.map((book) => book.rank);
            const keys = new Set(books.map((book) => book.sourceKey));
            const expectedMissing = [62, 86];
            const observedMissing = Array.from({ length: 100 }, (_, i) => i + 1)
              .filter((rank) => !ranks.includes(rank));

            console.log("book_count=" + books.length);
            console.log("first_rank=" + books[0]?.rank);
            console.log("last_rank=" + books.at(-1)?.rank);
            console.log("unique_source_keys=" + keys.size);
            console.log("missing_ranks=" + observedMissing.join(","));
            console.log("has_776749=" + keys.has("776749"));
            console.log("has_773082=" + keys.has("773082"));

            const sameMissing =
              observedMissing.length === expectedMissing.length &&
              observedMissing.every((rank, i) => rank === expectedMissing[i]);

            if (
              books.length !== 98 ||
              books[0]?.rank !== 1 ||
              books.at(-1)?.rank !== 100 ||
              keys.size !== 98 ||
              !sameMissing ||
              keys.has("776749") ||
              keys.has("773082")
            ) {
              throw new Error("KITAPSTORE_NONBOOK_EXCLUSION_CONTRACT_FAILED");
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

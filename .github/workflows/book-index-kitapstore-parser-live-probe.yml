name: Book Index KitapStore parser live probe

on:
  push:
    branches:
      - research/book-index-kitapstore-parser-live-01ak-ak
    paths:
      - ".github/workflows/book-index-kitapstore-parser-live-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Run production parser against public Top 100
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Compile only the research parser and dependencies
        run: |
          rm -rf /tmp/kitapstore-parser
          npx tsc \
            src/lib/book-index/adapter.ts \
            src/lib/book-index/html.ts \
            src/lib/book-index/sources/kitapstore.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --skipLibCheck \
            --esModuleInterop \
            --outDir /tmp/kitapstore-parser

      - name: Run parser against official public pages without collecting
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {
            kitapStoreBookIndexResearchAdapter,
          } = require("/tmp/kitapstore-parser/sources/kitapstore.js");

          (async () => {
            const result = await kitapStoreBookIndexResearchAdapter.collect({
              listCode: "kitapstore-tr-live",
              sourceUrl: "https://www.kitapstore.com/liste/2/cok-satanlar/!Sayfa=1",
              observedAt: new Date(),
            });

            const books = result.books;
            const ranks = books.map((book) => book.rank);
            const keys = new Set(books.map((book) => book.sourceKey));
            const urls = new Set(books.map((book) => book.productUrl));

            console.log("book_count=" + books.length);
            console.log("first_rank=" + books[0]?.rank);
            console.log("last_rank=" + books.at(-1)?.rank);
            console.log("unique_source_keys=" + keys.size);
            console.log("unique_product_urls=" + urls.size);
            console.log("first_book=" + JSON.stringify(books[0]));
            console.log("last_book=" + JSON.stringify(books.at(-1)));

            if (
              books.length !== 100 ||
              books[0]?.rank !== 1 ||
              books.at(-1)?.rank !== 100 ||
              keys.size !== 100 ||
              urls.size !== 100 ||
              ranks.some((rank, index) => rank !== index + 1)
            ) {
              throw new Error("KITAPSTORE_LIVE_PARSER_CONTRACT_FAILED");
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

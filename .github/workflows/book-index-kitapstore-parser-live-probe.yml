name: Book Index KitapStore parser live probe

on:
  push:
    branches:
      - research/book-index-kitapstore-parser-live-01ak-ak
    paths:
      - ".github/workflows/book-index-kitapstore-parser-live-probe.yml"
      - "src/lib/book-index/sources/kitapstore.ts"

permissions:
  contents: read

jobs:
  probe:
    name: Run production parser against public Top 100
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inspect live rank 14 card authorship shape
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          code="$(curl --silent --show-error --compressed --max-time 20 \
            --user-agent 'IlkOkuBookIndex/0.1 (+https://ilkoku.com)' \
            --header 'Accept: text/html,application/xhtml+xml' \
            --header 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.5' \
            --output "$body" --write-out '%{http_code}' \
            'https://www.kitapstore.com/liste/2/cok-satanlar/!Sayfa=1' || true)"
          printf 'rank14_probe_http_status=%s\n' "$code"
          test "$code" = "200"

          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const headings = [...html.matchAll(/<div\b[^>]*class=["'][^"']*\bIcBaslik\b[^"']*["'][^>]*>\s*ÇOK\s+SATANLAR\s*<\/div>/giu)];
          const headingIndex = headings.at(-1)?.index;
          if (headingIndex === undefined) throw new Error("heading missing");

          const listBody = html.slice(headingIndex).match(
            /<ul\b[^>]*class=["'][^"']*\bIslemliL\b[^"']*["'][^>]*>([\s\S]*?)<\/ul>/iu,
          )?.[1];
          if (!listBody) throw new Error("list missing");

          const starts = [...listBody.matchAll(
            /<li\b(?=[^>]*\bitemtype=["']http:\/\/schema\.org\/Book["'])(?=[^>]*\bid=["']Urun-([0-9]+)["'])[^>]*>/giu,
          )];
          const index = 13;
          const start = starts[index]?.index;
          const end = starts[index + 1]?.index ?? listBody.length;
          if (start === undefined) throw new Error("rank 14 card missing");

          const card = listBody.slice(start, end);
          console.log("rank14_product_id=" + (starts[index]?.[1] || "NONE"));
          console.log("rank14_has_author_itemprop=" + /itemprop=["']author["']/iu.test(card));
          console.log("rank14_has_kisiadi=" + /class=["'][^"']*\bKisiAdi\b[^"']*["']/iu.test(card));
          console.log("rank14_has_publisher_itemprop=" + /itemprop=["']publisher["']/iu.test(card));
          console.log("RANK14_SNIPPET_START");
          console.log(card.replace(/\r?\n/g, " ").replace(/\s+/g, " ").slice(0, 4500));
          console.log("RANK14_SNIPPET_END");
          NODE

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Compile only the research parser and dependencies
        run: |
          rm -rf /tmp/kitapstore-parser
          npx tsc \
            src/lib/book-index/adapter.ts \
            src/lib/book-index/html.ts \
            src/lib/book-index/sources/kitapstore.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --skipLibCheck \
            --esModuleInterop \
            --outDir /tmp/kitapstore-parser

      - name: Run parser against official public pages without collecting
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {
            kitapStoreBookIndexResearchAdapter,
          } = require("/tmp/kitapstore-parser/sources/kitapstore.js");

          (async () => {
            const result = await kitapStoreBookIndexResearchAdapter.collect({
              listCode: "kitapstore-tr-live",
              sourceUrl: "https://www.kitapstore.com/liste/2/cok-satanlar/!Sayfa=1",
              observedAt: new Date(),
            });

            const books = result.books;
            const ranks = books.map((book) => book.rank);
            const keys = new Set(books.map((book) => book.sourceKey));
            const urls = new Set(books.map((book) => book.productUrl));

            console.log("book_count=" + books.length);
            console.log("first_rank=" + books[0]?.rank);
            console.log("last_rank=" + books.at(-1)?.rank);
            const json = (value) =>
              JSON.stringify(value, (_key, item) =>
                typeof item === "bigint" ? item.toString() : item,
              );

            console.log("unique_source_keys=" + keys.size);
            console.log("unique_product_urls=" + urls.size);
            console.log("first_book=" + json(books[0]));
            console.log("last_book=" + json(books.at(-1)));

            const missingAuthors = books
              .filter((book) => !book.authorName)
              .map((book) => ({
                rank: book.rank,
                sourceKey: book.sourceKey,
                title: book.title,
                productUrl: book.productUrl,
              }));
            const missingPublishers = books
              .filter((book) => !book.publisherName)
              .map((book) => ({
                rank: book.rank,
                sourceKey: book.sourceKey,
                title: book.title,
                productUrl: book.productUrl,
              }));

            console.log("missing_author_count=" + missingAuthors.length);
            console.log("missing_author_books=" + JSON.stringify(missingAuthors));
            console.log("missing_publisher_count=" + missingPublishers.length);
            console.log("missing_publisher_books=" + JSON.stringify(missingPublishers));

            if (
              books.length !== 100 ||
              books[0]?.rank !== 1 ||
              books.at(-1)?.rank !== 100 ||
              keys.size !== 100 ||
              urls.size !== 100 ||
              ranks.some((rank, index) => rank !== index + 1)
            ) {
              throw new Error("KITAPSTORE_LIVE_PARSER_CONTRACT_FAILED");
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

name: Book Index Kitapzen Probe

on:
  push:
    branches:
      - feature/book-index-kitapzen-collector
    paths:
      - ".github/workflows/book-index-kitapzen-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Kitapzen product cards
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"
          url="https://www.kitapzen.com/index.php?mod_id=41&p=ProductBestsellers&page=1&period=weekly"
          curl -L --silent --show-error --max-time 25 -A "$ua" -o /tmp/page.html "$url"

          python3 - <<'PY'
          from pathlib import Path
          import re, html

          text=Path("/tmp/page.html").read_text(errors="replace")
          starts=list(re.finditer(r'<div\b[^>]*class=["\'][^"\']*\bProduct_b\b[^"\']*["\'][^>]*>', text, re.I))
          print("CARD_COUNT", len(starts))

          for idx,m in enumerate(starts[:6]):
              start=m.start()
              end=starts[idx+1].start() if idx+1 < len(starts) else min(len(text), start+12000)
              card=text[start:end]
              print(f"\n--- CARD {idx+1} ---")
              print(card[:9000].replace("\n"," "))

              def clean(s):
                  return html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',s))).strip()

              print("LINKS")
              for href,body in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]{0,1200}?)</a>', card, re.I):
                  c=clean(body)
                  if c:
                      print(href, "=>", c[:220])

              print("TEXT")
              texts=[]
              for raw in re.findall(r'<(?:span|div|p|h[1-6])[^>]*>([^<>]{2,240})</(?:span|div|p|h[1-6])>', card, re.I):
                  c=html.unescape(re.sub(r'\s+',' ',raw)).strip()
                  if c and c not in texts:
                      texts.append(c)
              print(texts[:40])
          PY

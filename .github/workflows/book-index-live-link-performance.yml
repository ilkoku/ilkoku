name: Kitap Endeksi canlı URL ve performans denetimi

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "next.config.ts"
      - "src/app/en-cok-satanlar/**"
      - "src/app/yeni-cikanlar/**"
      - "src/features/book-index/public/**"
      - "src/lib/book-index/**"
      - "src/lib/seo/sitemap-data.ts"
      - "src/components/layout/PublicSiteHeader.tsx"

permissions:
  contents: read

concurrency:
  group: ilkoku-book-index-live-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the matching production deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 22); do
            response="$(curl --silent --show-error --max-time 15 --user-agent 'IlkOku-BookIndex-Audit/1.0' https://ilkoku.com/api/build-info || true)"
            if [[ "$response" == *"$EXPECTED_SHA"* ]]; then
              echo "Production commit confirmed: $EXPECTED_SHA"
              exit 0
            fi
            echo "Production deployment not matched ($attempt/22); waiting..."
            sleep 15
          done
          echo "Live deployment not confirmed; cannot test an old build." >&2
          exit 1

      - name: Verify all eight live sections and record remote HTTP timing
        run: |
          set -Eeuo pipefail
          paths=(
            "/en-cok-satanlar"
            "/en-cok-satanlar/turkiye"
            "/en-cok-satanlar/dunya"
            "/yeni-cikanlar"
            "/en-cok-satanlar/cok-satanlara-yeni-girenler"
            "/en-cok-satanlar/cok-satanlarda-yukselenler"
            "/en-cok-satanlar/birden-fazla-listede-cok-satanlar"
            "/en-cok-satanlar/uzun-suredir-cok-satanlar"
          )
          echo "| Route | HTTP | TTFB (s) | Total (s) |"
          echo "|---|---:|---:|---:|"
          failed=0
          for path in "${paths[@]}"; do
            metrics="$(curl --silent --show-error --compressed --max-time 35 --user-agent 'IlkOku-BookIndex-Audit/1.0' \
              --output /dev/null --write-out '%{http_code}|%{time_starttransfer}|%{time_total}' \
              "https://ilkoku.com${path}" || true)"
            IFS='|' read -r status ttfb total <<< "$metrics"
            echo "| $path | ${status:-000} | ${ttfb:--} | ${total:--} |"
            if [[ "${status:-000}" == "403" || "${status:-000}" == "429" ]]; then
              echo "CIRCUIT BREAKER: edge blocked request; stop audit without further traffic." >&2
              exit 1
            fi
            if [[ "${status:-000}" != "200" ]]; then
              failed=1
            fi
            if [[ -n "${ttfb:-}" ]] && awk -v n="$ttfb" 'BEGIN {exit !(n>2.5)}'; then
              echo "::warning title=Kitap Endeksi yüksek TTFB::$path TTFB=$ttfb s (2.5s gözlem eşiği)"
            fi
            sleep 2
          done
          [[ "$failed" == "0" ]]

      - name: Verify retired comparison URL is permanent redirect
        run: |
          set -Eeuo pipefail
          headers="$(mktemp)"
          status="$(curl --silent --show-error --max-time 25 --user-agent 'IlkOku-BookIndex-Audit/1.0' \
            --output /dev/null --dump-header "$headers" --write-out '%{http_code}' \
            'https://ilkoku.com/en-cok-satanlar/turkiye/karsilastirma')"
          location="$(grep -i '^location:' "$headers" | tail -1 | cut -d: -f2- | tr -d '\r' | xargs || true)"
          echo "Legacy comparison: HTTP $status → $location"
          [[ "$status" == "308" ]]
          [[ "$location" == "/en-cok-satanlar/turkiye" || "$location" == "https://ilkoku.com/en-cok-satanlar/turkiye" ]]
          rm -f "$headers"

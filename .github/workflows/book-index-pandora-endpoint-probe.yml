name: Book Index Pandora endpoint probe

on:
  push:
    branches:
      - research/book-index-pandora-endpoint-01ak-ae-ab-aa
    paths:
      - ".github/workflows/book-index-pandora-endpoint-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Observe public Pandora bestseller loading contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare static and rendered public page
        shell: bash
        run: |
          set -euo pipefail

          url='https://www.pandora.com.tr/Cok_Satan_Kitaplar'
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir" 2>/dev/null || true' EXIT

          static="$tmpdir/static.html"
          code="$(curl             --silent             --show-error             --compressed             --max-time 20             --user-agent 'IlkOkuBookIndex/0.1 (+https://ilkoku.com)'             --header 'Accept: text/html,application/xhtml+xml'             --header 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.5'             --output "$static"             --write-out '%{http_code}'             "$url" || true)"

          bytes="$(wc -c < "$static" | tr -d ' ')"
          if grep -Fqi 'Türkçe çok satan kitaplar yükleniyor' "$static"; then
            loading_marker=true
          else
            loading_marker=false
          fi
          printf 'static_http_status=%s static_bytes=%s loading_marker=%s\n' "$code" "$bytes" "$loading_marker"

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo 'render_probe=browser_unavailable'
            exit 0
          fi

          rendered="$tmpdir/rendered.html"
          netlog="$tmpdir/net.json"

          "$chrome"             --headless=new             --disable-gpu             --disable-dev-shm-usage             --no-sandbox             --lang=tr-TR             --window-size=1920,20000             --virtual-time-budget=10000             --log-net-log="$netlog"             --net-log-capture-mode=Everything             --dump-dom             "$url" > "$rendered" 2>/dev/null || true

          node - "$rendered" "$netlog" <<'NODE'
          const fs = require("node:fs");

          const renderedPath = process.argv[2];
          const netlogPath = process.argv[3];
          const html = fs.existsSync(renderedPath) ? fs.readFileSync(renderedPath, "utf8") : "";

          const normalized = html
            .replace(/<script\b[\s\S]*?<\/script>/giu, " ")
            .replace(/<style\b[\s\S]*?<\/style>/giu, " ")
            .replace(/<[^>]+>/gu, " ")
            .replace(/&nbsp;/giu, " ")
            .replace(/&amp;/giu, "&")
            .replace(/\s+/gu, " ")
            .trim();

          const hasLoading = /Türkçe çok satan kitaplar yükleniyor/iu.test(normalized);
          const hasBestsellersHeading = /Çok Satanlar\s*-\s*Türkçe Kitaplar/iu.test(normalized);
          const textAfterHeading = normalized.match(/Çok Satanlar\s*-\s*Türkçe Kitaplar([\s\S]{0,5000})/iu)?.[1] ?? "";
          const tlPriceCount = [...textAfterHeading.matchAll(/\b\d[\d.]*,\d{2}\s*TL\b/giu)].length;

          console.log(`render_bytes=${Buffer.byteLength(html)} render_loading_marker=${hasLoading} render_bestseller_heading=${hasBestsellersHeading} render_tl_price_count_after_heading=${tlPriceCount}`);

          if (!fs.existsSync(netlogPath)) {
            console.log("network_paths=NETLOG_MISSING");
            process.exit(0);
          }

          let payload;
          try {
            payload = JSON.parse(fs.readFileSync(netlogPath, "utf8"));
          } catch {
            console.log("network_paths=NETLOG_INVALID");
            process.exit(0);
          }

          const paths = new Set();
          function visit(value) {
            if (typeof value === "string" && /^https?:\/\//iu.test(value)) {
              try {
                const parsed = new URL(value);
                if (parsed.hostname === "www.pandora.com.tr" || parsed.hostname === "pandora.com.tr") {
                  const queryKeys = [...parsed.searchParams.keys()].sort();
                  const normalizedUrl = `${parsed.origin}${parsed.pathname}${queryKeys.length ? `?${queryKeys.join("&")}` : ""}`;
                  paths.add(normalizedUrl);
                }
              } catch {}
              return;
            }
            if (Array.isArray(value)) {
              for (const item of value) visit(item);
              return;
            }
            if (value && typeof value === "object") {
              for (const item of Object.values(value)) visit(item);
            }
          }

          visit(payload?.events ?? []);
          const interesting = [...paths]
            .filter((value) => !/\.(?:css|js|png|jpe?g|gif|svg|ico|woff2?)(?:\?|$)/iu.test(value))
            .filter((value) => value !== "https://www.pandora.com.tr/Cok_Satan_Kitaplar")
            .sort();

          console.log(`pandora_same_origin_path_count=${paths.size}`);
          console.log(`pandora_interesting_paths=${interesting.join(" | ") || "NONE"}`);
          NODE


      - name: Inspect public JavaScript references from static shell
        shell: bash
        run: |
          set -euo pipefail

          url='https://www.pandora.com.tr/Cok_Satan_Kitaplar'
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir" 2>/dev/null || true' EXIT
          html="$tmpdir/page.html"

          code="$(curl             --silent             --show-error             --compressed             --max-time 20             --user-agent 'IlkOkuBookIndex/0.1 (+https://ilkoku.com)'             --header 'Accept: text/html,application/xhtml+xml'             --output "$html"             --write-out '%{http_code}'             "$url" || true)"
          echo "js_probe_page_status=$code"
          [ "$code" = "200" ] || exit 0

          node - "$html" > "$tmpdir/scripts.txt" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const base = new URL("https://www.pandora.com.tr/Cok_Satan_Kitaplar");
          const scripts = [];

          for (const match of html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/giu)) {
            try {
              const resolved = new URL(match[1], base);
              if (
                resolved.protocol === "https:"
                && (resolved.hostname === "www.pandora.com.tr" || resolved.hostname === "pandora.com.tr")
              ) {
                resolved.hash = "";
                scripts.push(resolved.toString());
              }
            } catch {}
          }

          for (const script of [...new Set(scripts)]) console.log(script);
          NODE

          script_count="$(wc -l < "$tmpdir/scripts.txt" | tr -d ' ')"
          echo "same_origin_script_count=$script_count"

          i=0
          while IFS= read -r script; do
            [ -n "$script" ] || continue
            i=$((i + 1))
            [ "$i" -le 30 ] || break

            body="$tmpdir/script-$i.js"
            status="$(curl               --silent               --show-error               --compressed               --max-time 20               --user-agent 'IlkOkuBookIndex/0.1 (+https://ilkoku.com)'               --header 'Accept: application/javascript,text/javascript,*/*'               --output "$body"               --write-out '%{http_code}'               "$script" || true)"

            node - "$body" "$i" "$status" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const index = Number(process.argv[3]);
          const status = process.argv[4];
          const js = fs.existsSync(path) ? fs.readFileSync(path, "utf8") : "";

          const candidates = new Set();

          const urlLike = /["'`](https?:\/\/[^"'`\s]+|\/[^"'`\s]{2,180})["'`]/gu;
          for (const match of js.matchAll(urlLike)) {
            const value = match[1];
            if (/(cok[_-]?satan|çok[_-]?satan|bestsell|best-sell|\/api\/|ajax|product|kitap)/iu.test(value)) {
              try {
                const resolved = new URL(value, "https://www.pandora.com.tr/");
                if (
                  resolved.hostname === "www.pandora.com.tr"
                  || resolved.hostname === "pandora.com.tr"
                ) {
                  const keys = [...resolved.searchParams.keys()].sort();
                  candidates.add(`${resolved.pathname}${keys.length ? `?${keys.join("&")}` : ""}`);
                }
              } catch {}
            }
          }

          const keywordHits = [
            "Cok_Satan_Kitaplar",
            "CokSatan",
            "cokSatan",
            "bestseller",
            "bestSeller",
            "fetch(",
            "$.ajax",
            "axios.",
            "XMLHttpRequest",
          ].filter((keyword) => js.includes(keyword));

          if (candidates.size || keywordHits.length) {
            console.log(
              `script_index=${index} http_status=${status} bytes=${Buffer.byteLength(js)} keyword_hits=${keywordHits.join(",") || "NONE"} candidate_paths=${[...candidates].join(" | ") || "NONE"}`,
            );
          }
          NODE
          done < "$tmpdir/scripts.txt"


      - name: Probe discovered public Pandora bestseller API
        shell: bash
        run: |
          set -euo pipefail

          api='https://www.pandora.com.tr/api/coksatanlar'
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir" 2>/dev/null || true' EXIT
          body="$tmpdir/body"

          code="$(curl             --silent             --show-error             --compressed             --max-time 20             --user-agent 'IlkOkuBookIndex/0.1 (+https://ilkoku.com)'             --header 'Accept: application/json,text/plain,*/*'             --header 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.5'             --output "$body"             --write-out '%{http_code}'             "$api" || true)"

          bytes="$(wc -c < "$body" | tr -d ' ')"
          echo "pandora_api_status=$code pandora_api_bytes=$bytes"
          [ "$code" = "200" ] || exit 0

          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const raw = fs.readFileSync(process.argv[2], "utf8");

          let data;
          try {
            data = JSON.parse(raw);
          } catch {
            console.log("pandora_api_json=false");
            process.exit(0);
          }

          console.log("pandora_api_json=true");

          let items = null;
          let container = "unknown";

          if (Array.isArray(data)) {
            items = data;
            container = "root_array";
          } else if (data && typeof data === "object") {
            const arrays = Object.entries(data).filter(([, value]) => Array.isArray(value));
            if (arrays.length) {
              const [key, value] = arrays.sort((a, b) => b[1].length - a[1].length)[0];
              items = value;
              container = `object.${key}`;
            }
            console.log(`pandora_api_top_level_keys=${Object.keys(data).sort().join(",") || "NONE"}`);
          }

          if (!items) {
            console.log("pandora_api_items=NOT_FOUND");
            process.exit(0);
          }

          console.log(`pandora_api_container=${container} pandora_api_item_count=${items.length}`);

          const first = items.find((item) => item && typeof item === "object" && !Array.isArray(item));
          if (!first) {
            console.log("pandora_api_item_keys=NONE");
            process.exit(0);
          }

          const keys = Object.keys(first).sort();
          console.log(`pandora_api_item_keys=${keys.join(",")}`);

          const rankLike = keys.filter((key) => /(rank|sira|sıra|order|position|index)/iu.test(key));
          const idLike = keys.filter((key) => /(^id$|id$|isbn|stock|stok|product|urun|ürün|code|kod|slug)/iu.test(key));
          const titleLike = keys.filter((key) => /(title|name|ad|isim|kitap)/iu.test(key));
          const authorLike = keys.filter((key) => /(author|yazar)/iu.test(key));
          const publisherLike = keys.filter((key) => /(publisher|yayinevi|yayınevi|yayinci|yayıncı)/iu.test(key));
          const priceLike = keys.filter((key) => /(price|fiyat)/iu.test(key));
          const urlLike = keys.filter((key) => /(url|link|href)/iu.test(key));

          console.log(`pandora_api_rank_like_keys=${rankLike.join(",") || "NONE"}`);
          console.log(`pandora_api_id_like_keys=${idLike.join(",") || "NONE"}`);
          console.log(`pandora_api_title_like_keys=${titleLike.join(",") || "NONE"}`);
          console.log(`pandora_api_author_like_keys=${authorLike.join(",") || "NONE"}`);
          console.log(`pandora_api_publisher_like_keys=${publisherLike.join(",") || "NONE"}`);
          console.log(`pandora_api_price_like_keys=${priceLike.join(",") || "NONE"}`);
          console.log(`pandora_api_url_like_keys=${urlLike.join(",") || "NONE"}`);

          function scalarValue(item, candidates) {
            for (const key of candidates) {
              const value = item?.[key];
              if (typeof value === "string" || typeof value === "number") return String(value);
            }
            return "";
          }

          const titleCandidates = [...titleLike, "title", "name"];
          const idCandidates = [...idLike, "id", "isbn"];

          for (let index = 0; index < Math.min(items.length, 5); index += 1) {
            const item = items[index];
            if (!item || typeof item !== "object") continue;
            const title = scalarValue(item, titleCandidates).replace(/\s+/gu, " ").trim().slice(0, 120);
            const id = scalarValue(item, idCandidates).replace(/\s+/gu, " ").trim().slice(0, 80);
            const rank = scalarValue(item, rankLike).replace(/\s+/gu, " ").trim().slice(0, 20);
            console.log(`pandora_api_order=${index + 1} explicit_rank=${rank || "NONE"} id=${id || "NONE"} title=${title || "NONE"}`);
          }
          NODE

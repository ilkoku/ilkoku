name: Book Index Pandora URL probe

on:
  push:
    branches:
      - research/book-index-pandora-endpoint-01ak-ae-ab-aa
    paths:
      - ".github/workflows/book-index-pandora-url-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public product URL behavior
        shell: bash
        run: |
          set -euo pipefail

          for label_url in             'canonical|https://www.pandora.com.tr/kitap/yanlis-hedef/978808'             'wrong-slug|https://www.pandora.com.tr/kitap/x/978808'
          do
            label="${label_url%%|*}"
            url="${label_url#*|}"
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl               --silent               --show-error               --compressed               --max-time 20               --user-agent 'IlkOkuBookIndex/0.1 (+https://ilkoku.com)'               --header 'Accept: text/html,application/xhtml+xml'               --dump-header "$headers"               --output "$body"               --write-out '%{http_code}'               "$url" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            title="$(node - "$body" <<'NODE'
const fs=require("node:fs");
const html=fs.readFileSync(process.argv[2],"utf8");
const match=html.match(/<title[^>]*>([\s\S]*?)<\/title>/iu);
console.log((match?.[1]||"").replace(/<[^>]+>/gu," ").replace(/\s+/gu," ").trim().slice(0,120));
NODE
)"
            printf 'url_probe=%s status=%s location=%s title=%s\n' "$label" "$code" "${location:-NONE}" "${title:-NONE}"
            rm -f "$headers" "$body"
          done

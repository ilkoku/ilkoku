name: Book Index readiness probe

on:
  workflow_dispatch:
  # Passive observer only: reads readiness/overdue evidence and never runs collection.
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: book-index-readiness-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Read production Book Index readiness
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read aggregate readiness with GitHub OIDC
        env:
          OIDC_AUDIENCE: ilkoku-book-index-readiness
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            oidc_response="$(curl --fail-with-body --silent --show-error --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"
            oidc_token="$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            test -n "$oidc_token"

            if [ "$attempt" -eq 1 ]; then
              OIDC_TOKEN="$oidc_token" python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ["OIDC_TOKEN"]
          encoded_payload = token.split(".")[1]
          encoded_payload += "=" * (-len(encoded_payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(encoded_payload))
          safe_claim_keys = (
              "repository",
              "repository_id",
              "workflow_ref",
              "ref",
              "event_name",
          )
          safe_claims = {key: claims.get(key) for key in safe_claim_keys}
          print("OIDC_SAFE_CLAIMS=" + json.dumps(safe_claims, sort_keys=True))
          PY
            fi

            if response="$(curl --fail-with-body --silent --show-error --max-time 60 --header "X-IlkOku-GitHub-OIDC: $oidc_token" https://ilkoku.com/api/internal/book-index-readiness)"; then
              if printf '%s' "$response" | python3 -c 'import json,sys; payload=json.load(sys.stdin); readiness=payload.get("readiness", {}); operations=payload.get("operations", {}); required=("unmatchedExternalBooksBySource","unmatchedDuplicateIdentityGroupsBySource","unmatchedMissingAuthorBooksBySource","unmatchedMissingAuthorWithIsbnBooksBySource","unmatchedMissingAuthorWithoutIsbnBooksBySource","unmatchedAmbiguousIdentityGroupsBySource","minimumSourceSuccessfulRunCount","minimumSourceHistorySpanHours","normalizedTitleDifferentAuthorSamples","latestCompositeExternalBookCount","latestCompositeMatchedExternalBookCount","latestCompositeUnmatchedExternalBookCount","latestCompositeUnmatchedBooksBySource","latestCompositeUnmatchedSamples","latestCompositeMatchCoveragePercent","kitapStoreCanaryHealth","kitapStoreCanaryObservationCount","kitapStoreCanaryMatchedObservationCount","kitapStoreCanaryUnmatchedObservationCount","kitapStoreCanaryDuplicateMasterObservationCount","kitapStoreCanaryDuplicateMasterSamples","kitapStoreCanaryShadowBookCount","kitapStoreCanaryShadowOverlapWithCompositeCount","kitapStoreCanaryShadowWouldReach3StorefrontCount","kitapStoreCanaryShadowWouldReach3IndependentCount","kitapStoreCanaryShadowPairOverlap","kitapStoreCanaryShadowSamples","kitapSecGeneralCanaryHealth","kitapSecGeneralCanaryShadowBookCount","kitapSecGeneralCanaryShadowOverlapWithCompositeCount","kitapSecGeneralCanaryShadowWouldReach3StorefrontCount","kitapSecGeneralCanaryShadowWouldReach3IndependentCount","kitapSecGeneralCanaryShadowPairOverlap","kitapSecGeneralCanaryShadowSamples","pandoraCanaryHealth","pandoraCanaryShadowBookCount","pandoraCanaryShadowOverlapWithCompositeCount","pandoraCanaryShadowWouldReach3StorefrontCount","pandoraCanaryShadowWouldReach3IndependentCount","pandoraCanaryShadowPairOverlap","pandoraCanaryShadowSamples","kitapAmbariCanaryHealth","kitapAmbariCanaryShadowBookCount","kitapAmbariCanaryShadowOverlapWithCompositeCount","kitapAmbariCanaryShadowWouldReach3StorefrontCount","kitapAmbariCanaryShadowWouldReach3IndependentCount","kitapAmbariCanaryShadowPairOverlap","kitapAmbariCanaryShadowSamples"); operation_required=("schedulerSecretConfigured","dueCount","maxOverdueMinutes","dueLists"); raise SystemExit(0 if payload.get("ok") is True and "seoGate" in payload and all(key in readiness for key in required) and all(key in operations for key in operation_required) else 1)'; then
                printf '%s' "$response" > readiness.json
                python3 - <<'PY'
          import json

          with open("readiness.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          readiness = payload["readiness"]
          seo_gate = payload["seoGate"]
          operations = payload["operations"]

          print(json.dumps({
              "generatedAt": payload.get("generatedAt"),
              "publicRolloutState": readiness.get("publicRolloutState"),
              "seoGate": seo_gate,
              "observedCompositeSources": readiness.get("observedCompositeSources"),
              "observedCompositeIndependenceGroups": readiness.get("observedCompositeIndependenceGroups"),
              "matchCoveragePercent": readiness.get("matchCoveragePercent"),
              "latestCompositeMatchCoveragePercent": readiness.get("latestCompositeMatchCoveragePercent"),
              "latestCompositeExternalBookCount": readiness.get("latestCompositeExternalBookCount"),
              "latestCompositeMatchedExternalBookCount": readiness.get("latestCompositeMatchedExternalBookCount"),
              "latestCompositeUnmatchedExternalBookCount": readiness.get("latestCompositeUnmatchedExternalBookCount"),
              "latestCompositeUnmatchedBooksBySource": readiness.get("latestCompositeUnmatchedBooksBySource"),
              "latestCompositeUnmatchedSamples": readiness.get("latestCompositeUnmatchedSamples"),
              "externalBookCount": readiness.get("externalBookCount"),
              "matchedExternalBookCount": readiness.get("matchedExternalBookCount"),
              "unmatchedExternalBookCount": readiness.get("unmatchedExternalBookCount"),
              "booksOnAtLeast3IndependentCompositeSources": readiness.get("booksOnAtLeast3IndependentCompositeSources"),
              "nearThreeSourceCount": readiness.get("nearThreeSourceCount"),
              "nearThreeWithHistoricalThirdSourceCount": readiness.get("nearThreeWithHistoricalThirdSourceCount"),
              "kitapStoreCanaryHealth": readiness.get("kitapStoreCanaryHealth"),
              "kitapStoreCanaryObservationCount": readiness.get("kitapStoreCanaryObservationCount"),
              "kitapStoreCanaryMatchedObservationCount": readiness.get("kitapStoreCanaryMatchedObservationCount"),
              "kitapStoreCanaryUnmatchedObservationCount": readiness.get("kitapStoreCanaryUnmatchedObservationCount"),
              "kitapStoreCanaryDuplicateMasterObservationCount": readiness.get("kitapStoreCanaryDuplicateMasterObservationCount"),
              "kitapStoreCanaryDuplicateMasterSamples": readiness.get("kitapStoreCanaryDuplicateMasterSamples"),
              "kitapStoreCanaryShadowBookCount": readiness.get("kitapStoreCanaryShadowBookCount"),
              "kitapStoreCanaryShadowOverlapWithCompositeCount": readiness.get("kitapStoreCanaryShadowOverlapWithCompositeCount"),
              "kitapStoreCanaryShadowWouldReach3StorefrontCount": readiness.get("kitapStoreCanaryShadowWouldReach3StorefrontCount"),
              "kitapStoreCanaryShadowWouldReach3IndependentCount": readiness.get("kitapStoreCanaryShadowWouldReach3IndependentCount"),
              "kitapStoreCanaryShadowPairOverlap": readiness.get("kitapStoreCanaryShadowPairOverlap"),
              "kitapStoreCanaryShadowSamples": readiness.get("kitapStoreCanaryShadowSamples"),
              "kitapSecGeneralCanaryHealth": readiness.get("kitapSecGeneralCanaryHealth"),
              "kitapSecGeneralCanaryShadowBookCount": readiness.get("kitapSecGeneralCanaryShadowBookCount"),
              "kitapSecGeneralCanaryShadowOverlapWithCompositeCount": readiness.get("kitapSecGeneralCanaryShadowOverlapWithCompositeCount"),
              "kitapSecGeneralCanaryShadowWouldReach3StorefrontCount": readiness.get("kitapSecGeneralCanaryShadowWouldReach3StorefrontCount"),
              "kitapSecGeneralCanaryShadowWouldReach3IndependentCount": readiness.get("kitapSecGeneralCanaryShadowWouldReach3IndependentCount"),
              "kitapSecGeneralCanaryShadowPairOverlap": readiness.get("kitapSecGeneralCanaryShadowPairOverlap"),
              "kitapSecGeneralCanaryShadowSamples": readiness.get("kitapSecGeneralCanaryShadowSamples"),
              "pandoraCanaryHealth": readiness.get("pandoraCanaryHealth"),
              "pandoraCanaryShadowBookCount": readiness.get("pandoraCanaryShadowBookCount"),
              "pandoraCanaryShadowOverlapWithCompositeCount": readiness.get("pandoraCanaryShadowOverlapWithCompositeCount"),
              "pandoraCanaryShadowWouldReach3StorefrontCount": readiness.get("pandoraCanaryShadowWouldReach3StorefrontCount"),
              "pandoraCanaryShadowWouldReach3IndependentCount": readiness.get("pandoraCanaryShadowWouldReach3IndependentCount"),
              "pandoraCanaryShadowPairOverlap": readiness.get("pandoraCanaryShadowPairOverlap"),
              "pandoraCanaryShadowSamples": readiness.get("pandoraCanaryShadowSamples"),
              "kitapAmbariCanaryHealth": readiness.get("kitapAmbariCanaryHealth"),
              "kitapAmbariCanaryShadowBookCount": readiness.get("kitapAmbariCanaryShadowBookCount"),
              "kitapAmbariCanaryShadowOverlapWithCompositeCount": readiness.get("kitapAmbariCanaryShadowOverlapWithCompositeCount"),
              "kitapAmbariCanaryShadowWouldReach3StorefrontCount": readiness.get("kitapAmbariCanaryShadowWouldReach3StorefrontCount"),
              "kitapAmbariCanaryShadowWouldReach3IndependentCount": readiness.get("kitapAmbariCanaryShadowWouldReach3IndependentCount"),
              "kitapAmbariCanaryShadowPairOverlap": readiness.get("kitapAmbariCanaryShadowPairOverlap"),
              "kitapAmbariCanaryShadowSamples": readiness.get("kitapAmbariCanaryShadowSamples"),
              "normalizedIdentityKeysOnAtLeast2Sources": readiness.get("normalizedIdentityKeysOnAtLeast2Sources"),
              "normalizedIdentityKeysOnAtLeast3Sources": readiness.get("normalizedIdentityKeysOnAtLeast3Sources"),
              "isbn13KeysOnAtLeast2Sources": readiness.get("isbn13KeysOnAtLeast2Sources"),
              "isbn13KeysOnAtLeast3Sources": readiness.get("isbn13KeysOnAtLeast3Sources"),
              "splitMasterCollisionCount": readiness.get("splitMasterCollisionCount"),
              "normalizedTitleDifferentAuthorCount": readiness.get("normalizedTitleDifferentAuthorCount"),
              "normalizedTitleDifferentAuthorSamples": readiness.get("normalizedTitleDifferentAuthorSamples"),
              "editionFamilyVariantOverlapCount": readiness.get("editionFamilyVariantOverlapCount"),
              "historySpanHours": readiness.get("historySpanHours"),
              "historySpanDays": readiness.get("historySpanDays"),
              "minimumSourceSuccessfulRunCount": readiness.get("minimumSourceSuccessfulRunCount"),
              "minimumSourceHistorySpanHours": readiness.get("minimumSourceHistorySpanHours"),
              "leastSuccessfulRunCountSourceCodes": readiness.get("leastSuccessfulRunCountSourceCodes"),
              "shortestHistorySpanSourceCodes": readiness.get("shortestHistorySpanSourceCodes"),
              "schedulerSecretConfigured": operations.get("schedulerSecretConfigured"),
              "dueCount": operations.get("dueCount"),
              "maxOverdueMinutes": operations.get("maxOverdueMinutes"),
              "dueLists": operations.get("dueLists"),
              "unmatchedExternalBooksBySource": readiness.get("unmatchedExternalBooksBySource"),
              "unmatchedDuplicateIdentityGroupsBySource": readiness.get("unmatchedDuplicateIdentityGroupsBySource"),
              "unmatchedMissingAuthorBooksBySource": readiness.get("unmatchedMissingAuthorBooksBySource"),
              "unmatchedMissingAuthorWithIsbnBooksBySource": readiness.get("unmatchedMissingAuthorWithIsbnBooksBySource"),
              "unmatchedMissingAuthorWithoutIsbnBooksBySource": readiness.get("unmatchedMissingAuthorWithoutIsbnBooksBySource"),
              "unmatchedAmbiguousIdentityGroupsBySource": readiness.get("unmatchedAmbiguousIdentityGroupsBySource"),
          }, ensure_ascii=False, indent=2))
          PY
                exit 0
              fi
            fi

            if [ "$attempt" -lt 20 ]; then
              sleep 15
            fi
          done

          exit 1

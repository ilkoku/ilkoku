name: Book Index readiness probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/book-index-readiness.yml"
      - "src/app/api/internal/book-index-readiness/route.ts"
      - "src/lib/book-index/readiness.ts"
      - "src/lib/book-index/seo-gate.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: book-index-readiness-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Read production Book Index readiness
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read aggregate readiness with GitHub OIDC
        env:
          OIDC_AUDIENCE: ilkoku-book-index-readiness
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            oidc_response="$(curl --fail-with-body --silent --show-error --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"
            oidc_token="$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            test -n "$oidc_token"

            if response="$(curl --fail-with-body --silent --show-error --max-time 60 --header "Authorization: Bearer $oidc_token" https://ilkoku.com/api/internal/book-index-readiness)"; then
              if printf '%s' "$response" | python3 -c 'import json,sys; payload=json.load(sys.stdin); readiness=payload.get("readiness", {}); operations=payload.get("operations", {}); required=("unmatchedExternalBooksBySource","unmatchedDuplicateIdentityGroupsBySource","unmatchedMissingAuthorBooksBySource","unmatchedMissingAuthorWithIsbnBooksBySource","unmatchedMissingAuthorWithoutIsbnBooksBySource","unmatchedAmbiguousIdentityGroupsBySource","minimumSourceSuccessfulRunCount","minimumSourceHistorySpanHours"); operation_required=("dueCount","maxOverdueMinutes","dueLists"); raise SystemExit(0 if payload.get("ok") is True and "seoGate" in payload and all(key in readiness for key in required) and all(key in operations for key in operation_required) else 1)'; then
                printf '%s' "$response" > readiness.json
                python3 - <<'PY'
          import json

          with open("readiness.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          readiness = payload["readiness"]
          seo_gate = payload["seoGate"]
          operations = payload["operations"]

          print(json.dumps({
              "generatedAt": payload.get("generatedAt"),
              "publicRolloutState": readiness.get("publicRolloutState"),
              "seoGate": seo_gate,
              "observedCompositeSources": readiness.get("observedCompositeSources"),
              "observedCompositeIndependenceGroups": readiness.get("observedCompositeIndependenceGroups"),
              "matchCoveragePercent": readiness.get("matchCoveragePercent"),
              "externalBookCount": readiness.get("externalBookCount"),
              "matchedExternalBookCount": readiness.get("matchedExternalBookCount"),
              "unmatchedExternalBookCount": readiness.get("unmatchedExternalBookCount"),
              "booksOnAtLeast3IndependentCompositeSources": readiness.get("booksOnAtLeast3IndependentCompositeSources"),
              "nearThreeSourceCount": readiness.get("nearThreeSourceCount"),
              "nearThreeWithHistoricalThirdSourceCount": readiness.get("nearThreeWithHistoricalThirdSourceCount"),
              "historySpanHours": readiness.get("historySpanHours"),
              "historySpanDays": readiness.get("historySpanDays"),
              "minimumSourceSuccessfulRunCount": readiness.get("minimumSourceSuccessfulRunCount"),
              "minimumSourceHistorySpanHours": readiness.get("minimumSourceHistorySpanHours"),
              "leastSuccessfulRunCountSourceCodes": readiness.get("leastSuccessfulRunCountSourceCodes"),
              "shortestHistorySpanSourceCodes": readiness.get("shortestHistorySpanSourceCodes"),
              "dueCount": operations.get("dueCount"),
              "maxOverdueMinutes": operations.get("maxOverdueMinutes"),
              "dueLists": operations.get("dueLists"),
              "unmatchedExternalBooksBySource": readiness.get("unmatchedExternalBooksBySource"),
              "unmatchedDuplicateIdentityGroupsBySource": readiness.get("unmatchedDuplicateIdentityGroupsBySource"),
              "unmatchedMissingAuthorBooksBySource": readiness.get("unmatchedMissingAuthorBooksBySource"),
              "unmatchedMissingAuthorWithIsbnBooksBySource": readiness.get("unmatchedMissingAuthorWithIsbnBooksBySource"),
              "unmatchedMissingAuthorWithoutIsbnBooksBySource": readiness.get("unmatchedMissingAuthorWithoutIsbnBooksBySource"),
              "unmatchedAmbiguousIdentityGroupsBySource": readiness.get("unmatchedAmbiguousIdentityGroupsBySource"),
          }, ensure_ascii=False, indent=2))
          PY
                exit 0
              fi
            fi

            if [ "$attempt" -lt 20 ]; then
              sleep 15
            fi
          done

          exit 1

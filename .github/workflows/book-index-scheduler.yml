name: Book Index scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - Production smoke
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: book-index-scheduler
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Book Index scheduler with GitHub OIDC
        env:
          OIDC_AUDIENCE: ilkoku-book-index-scheduler
        run: |
          set -euo pipefail

          endpoint="https://ilkoku.com/api/internal/book-index-scheduler"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            endpoint="$endpoint?matchPending=1"
          fi

          for attempt in {1..12}; do
            oidc_response="$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"

            oidc_token="$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            test -n "$oidc_token"

            if response="$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --max-time 300 \
              --request POST \
              --header "Authorization: Bearer $oidc_token" \
              "$endpoint")"; then
              printf '%s\n' "$response"

              if printf '%s' "$response" | python3 -c 'import json,sys; payload=json.load(sys.stdin); raise SystemExit(0 if "readiness" in payload and "seoGate" in payload else 1)'; then
                exit 0
              fi
            fi

            if [ "$attempt" -lt 12 ]; then
              sleep 15
            fi
          done

          exit 1

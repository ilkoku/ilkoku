name: Book Index scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: book-index-scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Book Index scheduler with GitHub OIDC
        env:
          OIDC_AUDIENCE: ilkoku-book-index-scheduler
        run: |
          set -euo pipefail

          oidc_response="$(curl             --fail-with-body             --silent             --show-error             --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"

          oidc_token="$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$oidc_token"

          curl             --fail-with-body             --max-time 300             --retry 1             --retry-all-errors             --request POST             --header "Authorization: Bearer $oidc_token"             https://ilkoku.com/api/internal/book-index-scheduler

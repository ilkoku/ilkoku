name: Book Index scheduler

on:
  workflow_dispatch:
    inputs:
      force_lists:
        description: "Comma-separated Book Index list codes to force refresh without a deploy"
        required: false
        default: ""
        type: string
  workflow_run:
    workflows:
      - Email operations
      - Book Index readiness probe
    types:
      - completed
  schedule:
    - cron: "17 * * * *"
    # Due-aware fallback if GitHub delays or drops the primary scheduled event.
    - cron: "47 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: book-index-scheduler
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name != 'workflow_run'
      || (
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'schedule'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Book Index scheduler with GitHub OIDC
        env:
          OIDC_AUDIENCE: ilkoku-book-index-scheduler
          DISPATCH_FORCE_LISTS: ${{ inputs.force_lists || '' }}
        run: |
          set -euo pipefail

          force_lists=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            force_lists="$(printf '%s' "$DISPATCH_FORCE_LISTS" | tr -d '\r\n[:space:]')"
          fi

          for attempt in {1..20}; do
            oidc_response="$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"

            oidc_token="$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            test -n "$oidc_token"

            force_header=()
            if [ -n "$force_lists" ]; then
              force_header=(--header "X-IlkOku-Book-Index-Force-Lists: $force_lists")
            fi

            response_file="$(mktemp)"
            http_status="$(curl \
              --silent \
              --show-error \
              --max-time 300 \
              --request POST \
              --header "Authorization: Bearer $oidc_token" \
              "${force_header[@]}" \
              --output "$response_file" \
              --write-out '%{http_code}' \
              https://ilkoku.com/api/internal/book-index-scheduler || true)"
            response="$(cat "$response_file")"
            rm -f "$response_file"

            printf 'Book Index scheduler HTTP %s response: %s\n' "$http_status" "$response"

            if [[ "$http_status" =~ ^2[0-9][0-9]$ ]]; then
              if printf '%s' "$response" | FORCE_LISTS="$force_lists" python3 -c 'import json,os,sys; payload=json.load(sys.stdin); force=os.environ.get("FORCE_LISTS",""); readiness=payload.get("readiness", {}); required=("splitMasterCollisionCount","unmatchedDuplicateIdentityGroupCount","leastSuccessfulRunCountSourceCodes","shortestHistorySpanSourceCodes","unmatchedMissingAuthorBooksBySource","unmatchedAmbiguousIdentityGroupCount"); expected=[x for x in force.split(",") if x]; forced_ok=(not expected) or (payload.get("forced") is True and payload.get("forceListCodes")==expected and len(payload.get("forcedResults") or [])==len(expected)); raise SystemExit(0 if forced_ok and "seoGate" in payload and all(key in readiness for key in required) else 1)'; then
                exit 0
              fi
            elif [[ "$http_status" =~ ^4[0-9][0-9]$ ]]; then
              echo "Deterministic scheduler request/dependency failure; not retrying." >&2
              exit 1
            fi

            if [ "$attempt" -lt 20 ]; then
              sleep 15
            fi
          done

          exit 1

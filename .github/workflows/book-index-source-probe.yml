name: Book Index Source Probe

on:
  push:
    branches:
      - feature/book-index-collector-wave1
    paths:
      - ".github/workflows/book-index-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public bestseller markup
        shell: bash
        run: |
          set -euo pipefail
          ua="IlkOkuBookIndex/0.1 (+https://ilkoku.com)"

          fetch_once() {
            name="$1"
            url="$2"
            file="/tmp/$name"
            code="$(curl -L --silent --show-error --max-time 25 -A "$ua" -o "$file" -w "%{http_code}" "$url" || true)"
            echo "$name HTTP=$code BYTES=$(wc -c < "$file" 2>/dev/null || echo 0)"
          }

          fetch_once remzi-robots "https://www.remzi.com.tr/robots.txt"
          fetch_once remzi-page "https://www.remzi.com.tr/anasayfa"
          fetch_once bkm-robots "https://www.bkmkitap.com/robots.txt"
          fetch_once bkm-page "https://www.bkmkitap.com/cok-satan-kitaplar"
          fetch_once penguen-robots "https://penguenkitabevi.com/robots.txt"

          echo "--- REMZI ROBOTS ---"
          cat /tmp/remzi-robots || true
          echo
          echo "--- BKM ROBOTS ---"
          cat /tmp/bkm-robots || true
          echo
          echo "--- PENGUEN ROBOTS ---"
          cat /tmp/penguen-robots || true
          echo

          python3 - <<'PY'
          from pathlib import Path
          import re

          def around(path, markers, width=4500):
              text = Path(path).read_text(errors="replace")
              folded = text.casefold()
              pos = -1
              marker = None
              for candidate in markers:
                  pos = folded.find(candidate.casefold())
                  if pos >= 0:
                      marker = candidate
                      break
              print(f"--- {path} marker={marker!r} pos={pos} ---")
              if pos < 0:
                  return
              start = max(0, pos - 700)
              print(text[start:pos + width])

          around("/tmp/remzi-page", ["REMZİ'DE ÇOK SATANLAR", "çok satanlar"])
          around("/tmp/bkm-page", ["Haftalık 7 Gün", "çok satan kitaplar"])
          PY

name: Bootstrap production role demo users

on:
  push:
    branches:
      - main
    paths:
      - "src/app/api/internal/bootstrap-demo-users/route.ts"
      - ".github/workflows/bootstrap-role-demo-users.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-production-role-demo-users
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create or refresh production demo users
        env:
          DEMO_SECRET: ${{ secrets.WRITER_DAILY_SUMMARY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEMO_SECRET"
          status=""
          for attempt in $(seq 1 36); do
            status="$(curl \
              --silent \
              --show-error \
              --output /tmp/demo-bootstrap.json \
              --write-out '%{http_code}' \
              --max-time 60 \
              --request POST \
              --header "Authorization: Bearer $DEMO_SECRET" \
              https://ilkoku.com/api/internal/bootstrap-demo-users || true)"

            if [ "$status" = "200" ]; then
              cat /tmp/demo-bootstrap.json
              break
            fi

            echo "Demo bootstrap endpoint not ready yet (HTTP $status), attempt $attempt/36"
            sleep 15
          done

          test "$status" = "200"
          grep -q '"ok":true' /tmp/demo-bootstrap.json
          grep -q 'demo.yazar@ilkoku.com' /tmp/demo-bootstrap.json
          grep -q 'demo.okuyucu@ilkoku.com' /tmp/demo-bootstrap.json
          grep -q 'demo.editor@ilkoku.com' /tmp/demo-bootstrap.json
          grep -q 'demo.yayinevi@ilkoku.com' /tmp/demo-bootstrap.json

      - name: Remove one-time bootstrap code
        shell: bash
        run: |
          set -euo pipefail
          rm -f src/app/api/internal/bootstrap-demo-users/route.ts
          rm -f .github/workflows/bootstrap-role-demo-users.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove one-time production demo user bootstrap"
          git push origin HEAD:main

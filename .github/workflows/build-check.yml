name: Build check

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: ilkoku_build_check
          MARIADB_USER: build_user
          MARIADB_PASSWORD: build_password
          MARIADB_ROOT_PASSWORD: build_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: "mysql://build_user:build_password@127.0.0.1:3306/ilkoku_build_check"

    steps:
      - name: Repository'i indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Production build
        run: npm run build

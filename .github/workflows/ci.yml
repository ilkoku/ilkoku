name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test-branch-chatgpt-2
      - deploy/2026-08-04-production
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, security contracts, DB contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: ilkoku_ci
          MARIADB_USER: ci_user
          MARIADB_PASSWORD: ci_password
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: "mysql://ci_user:ci_password@127.0.0.1:3306/ilkoku_ci"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      SITE_URL: "http://localhost:3000"
      EMAIL_DELIVERY_MODE: "local"
      ADMIN_ROLE_VIEW_SECRET: "ci-admin-role-view-secret-0000000000000000000000000000000000000000"
      READING_ACCESS_HASH_SECRET: "ci-reading-access-hash-secret-00000000000000000000000000000000000000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Run lint
        run: npm run lint

      - name: Run security contract tests
        run: npm run test:security

      - name: Deploy migrations to fresh MariaDB
        run: npx prisma migrate deploy

      - name: Run MariaDB security integration contracts
        run: npm run test:security:db

      - name: Build application
        shell: bash
        run: |
          set +e
          npm run build:ci 2>&1 | tee /tmp/ilkoku-build.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            diagnostic="$(tail -n 80 /tmp/ilkoku-build.log | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')"
            echo "::error title=Production build compiler diagnostic::$diagnostic"
            exit "$status"
          fi

name: Dependency lock refresh

on:
  push:
    branches:
      - agent/dependency-manifest-hygiene
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Regenerate canonical npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate generated diff
        run: git diff --check -- package-lock.json

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already canonical."
            exit 0
          fi
          git commit -m "Regenerate lockfile for dependency manifest hygiene"
          git push origin "HEAD:${GITHUB_REF_NAME}"

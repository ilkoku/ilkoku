name: Content uniqueness audit

on:
  push:
    branches:
      - diag/metadata-ua-parity-20261004

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Audit live content uniqueness slowly
        run: node scripts/diag-content-uniqueness.mjs

      - name: Upload content uniqueness audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-uniqueness-audit
          path: content-uniqueness-audit.json
          if-no-files-found: ignore
          retention-days: 1

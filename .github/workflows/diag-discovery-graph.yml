name: Discovery graph audit

on:
  push:
    branches:
      - diag/metadata-ua-parity-20261004

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Audit internal discovery graph and sitemap freshness
        run: node scripts/diag-discovery-graph.mjs

      - name: Upload discovery graph audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-graph-audit
          path: discovery-graph-audit.json
          if-no-files-found: ignore
          retention-days: 1

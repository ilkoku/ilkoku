name: Live sitemap metadata census

on:
  push:
    branches:
      - diag/metadata-ua-parity-20261004

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Audit live sitemap metadata slowly
        run: node scripts/diag-live-sitemap-metadata.mjs

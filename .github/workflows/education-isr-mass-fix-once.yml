name: Education ISR mass fix once

on:
  push:
    branches:
      - "fix/education-crawl-cache-20260930"
    paths:
      - ".github/workflows/education-isr-mass-fix-once.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/education-crawl-cache-20260930
          fetch-depth: 0

      - name: Convert public writing education pages to ISR
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path("src/app/yazarlar-icin")
          excluded = {
              Path("src/app/yazarlar-icin/page.tsx"),
              Path("src/app/yazarlar-icin/kurgu/page.tsx"),
              Path("src/app/yazarlar-icin/edebiyat/page.tsx"),
              Path("src/app/yazarlar-icin/senaryo-ve-sahne/page.tsx"),
              Path("src/app/yazarlar-icin/akademik/page.tsx"),
              Path("src/app/yazarlar-icin/bilgilendirici/page.tsx"),
              Path("src/app/yazarlar-icin/cocuk-ve-genclik/page.tsx"),
              Path("src/app/yazarlar-icin/cizgi-anlati/page.tsx"),
          }

          changed = []
          for path in sorted(root.rglob("page.tsx")):
              if path in excluded:
                  continue
              text = path.read_text()
              original = text
              text = text.replace(
                  'export const dynamic = "force-dynamic";',
                  'export const revalidate = 300;',
              )

              if path.as_posix() == "src/app/yazarlar-icin/bilgilendirici/[slug]/page.tsx" and "generateStaticParams" not in text:
                  needle = 'type LiveInformationalSlug = (typeof LIVE_INFORMATIONAL_SLUGS)[number];'
                  replacement = '''export function generateStaticParams() {
            return LIVE_INFORMATIONAL_SLUGS.map((slug) => ({ slug }));
          }

          type LiveInformationalSlug = (typeof LIVE_INFORMATIONAL_SLUGS)[number];'''
                  text = text.replace(needle, replacement)

              if text != original:
                  path.write_text(text)
                  changed.append(path.as_posix())

          print(f"Changed {len(changed)} files")
          for path in changed:
              print(path)

          if len(changed) < 50:
              raise SystemExit(f"Expected broad education conversion, changed only {len(changed)} files")
          PY

      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/education-isr-mass-fix-once.yml
          git config user.name "ilkoku-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/yazarlar-icin
          git diff --cached --check
          git commit -m "Make public writing education pages cacheable"
          git push origin HEAD:fix/education-crawl-cache-20260930

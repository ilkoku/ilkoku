name: Email operations

on:
  # One independent production heartbeat on a relevant main-branch change.
  # This supplements the best-effort hourly schedule; it is NOT a second cron.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/email-operations.yml"
      - "src/features/email-operations/**"
      - "src/app/api/internal/email-operations/route.ts"
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-operations
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check email delivery operations
        env:
          SUMMARY_SECRET: ${{ secrets.EMAIL_OPERATIONS_SECRET || secrets.WRITER_DAILY_SUMMARY_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUMMARY_SECRET"
          curl \
            --fail-with-body \
            --max-time 300 \
            --retry 2 \
            --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $SUMMARY_SECRET" \
            --header "X-IlkOku-Scheduler: github" \
            https://ilkoku.com/api/internal/email-operations

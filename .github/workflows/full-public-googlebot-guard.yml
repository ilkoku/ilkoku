name: Full public crawler compatibility guard

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Çalıştırmak için RUN-PUBLIC-CRAWLER-DIAGNOSTIC yazın"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-live-crawler
  cancel-in-progress: true

jobs:
  verify:
    name: Verify all public URLs with diagnostic crawler
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Validate explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "RUN-PUBLIC-CRAWLER-DIAGNOSTIC"

      - name: Verify current public sitemap URLs slowly
        shell: bash
        run: |
          set -Eeuo pipefail

          # Never spoof Googlebot from GitHub/Azure. It pollutes origin logs and
          # cannot reproduce verified Googlebot behavior because bot identity is IP-based.
          USER_AGENT="IlkOku-Public-Crawler-Guard/1.0 (+https://ilkoku.com)"
          REQUEST_DELAY_SECONDS=10

          normalize_url() {
            local value="$1"
            printf '%s' "${value%/}"
          }

          canonical_from_body() {
            local body="$1"
            local canonical_tag
            canonical_tag="$(grep -Eoi '<link[^>]+rel="canonical"[^>]+>' "$body" | head -1 || true)"
            printf '%s' "$canonical_tag" | sed -n 's/.*href="\([^"]*\)".*/\1/p'
          }

          check_page() {
            local path="$1"
            local expected_canonical="$2"
            local expected_marker="$3"
            local url="https://ilkoku.com${path}"
            local headers body code robots canonical_href body_bytes h1_count title_count content_type

            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$headers")"
            body_bytes="$(wc -c < "$body" | tr -d ' ')"
            h1_count="$( { grep -Eoi '<h1([[:space:]][^>]*)?>' "$body" || true; } | wc -l | tr -d ' ')"
            title_count="$( { grep -Eoi '<title([[:space:]][^>]*)?>' "$body" || true; } | wc -l | tr -d ' ')"

            echo "$url -> HTTP $code | Content-Type: ${content_type:-YOK} | X-Robots-Tag: ${robots:-YOK} | bytes=$body_bytes | title=$title_count | h1=$h1_count"

            if [[ "$code" == "403" || "$code" == "429" ]]; then
              echo "CIRCUIT BREAKER: $url returned HTTP $code. Remaining URLs will not be requested." >&2
              rm -f "$headers" "$body"
              exit 1
            fi
            [[ "$code" == "200" ]] || { echo "FAIL: $url returned HTTP $code"; rm -f "$headers" "$body"; return 1; }
            [[ "${content_type,,}" == text/html* ]] || { echo "FAIL: $url returned unexpected Content-Type"; rm -f "$headers" "$body"; return 1; }
            [[ "${robots,,}" != *"noindex"* ]] || { echo "FAIL: $url returned X-Robots-Tag noindex"; rm -f "$headers" "$body"; return 1; }
            ! grep -Eqi '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' "$body" || { echo "FAIL: $url contains meta robots noindex"; rm -f "$headers" "$body"; return 1; }
            (( body_bytes >= 5000 )) || { echo "FAIL: $url returned unexpectedly small HTML ($body_bytes bytes)"; rm -f "$headers" "$body"; return 1; }
            (( title_count >= 1 )) || { echo "FAIL: $url title missing"; rm -f "$headers" "$body"; return 1; }
            (( h1_count >= 1 )) || { echo "FAIL: $url H1 missing"; rm -f "$headers" "$body"; return 1; }
            if [[ -n "$expected_marker" ]]; then
              grep -Fqi -- "$expected_marker" "$body" || { echo "FAIL: $url visible content marker missing: $expected_marker"; rm -f "$headers" "$body"; return 1; }
            fi

            canonical_href="$(canonical_from_body "$body")"
            [[ -n "$canonical_href" ]] || { echo "FAIL: $url canonical missing"; rm -f "$headers" "$body"; return 1; }
            [[ "$(normalize_url "$canonical_href")" == "$(normalize_url "$expected_canonical")" ]] || { echo "FAIL: $url canonical mismatch: $canonical_href"; rm -f "$headers" "$body"; return 1; }

            echo "PASS: $url canonical=$canonical_href${expected_marker:+ | marker=$expected_marker}"
                 sitemap="$(mktemp)"
          trap 'rm -f "$sitemap"' EXIT
          sitemap_code="$(curl --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" --output "$sitemap" --write-out '%{http_code}' https://ilkoku.com/sitemap.xml || true)"
          echo "https://ilkoku.com/sitemap.xml -> HTTP $sitemap_code"
          if [[ "$sitemap_code" == "403" || "$sitemap_code" == "429" ]]; then
            echo "CIRCUIT BREAKER: sitemap returned HTTP $sitemap_code. No page requests will be sent." >&2
            exit 1
          fi
          [[ "$sitemap_code" == "200" ]]

          mapfile -t sitemap_urls < <(grep -Eo '<loc>[^<]+</loc>' "$sitemap" | sed -E 's#</?loc>##g')
          (( ${#sitemap_urls[@]} > 0 )) || { echo "FAIL: sitemap contains no URLs" >&2; exit 1; }

          echo "Current public sitemap URLs: ${#sitemap_urls[@]}"

          for url in "${sitemap_urls[@]}"; do
            [[ "$url" == https://ilkoku.com/* ]] || { echo "FAIL: unexpected sitemap origin: $url" >&2; exit 1; }
            path="${url#https://ilkoku.com}"
            [[ -n "$path" ]] || path="/"
            check_page "$path" "$url" ""
          done

          echo "PASS: explicitly requested current-sitemap crawler compatibility diagnostic completed without edge throttling."
y requested 19/19 crawler compatibility diagnostic completed without edge throttling."

name: Full public crawler compatibility guard

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Çalıştırmak için RUN-PUBLIC-CRAWLER-DIAGNOSTIC yazın"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-live-crawler
  cancel-in-progress: true

jobs:
  verify:
    name: Verify current public sitemap URLs with diagnostic crawler
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Validate explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "RUN-PUBLIC-CRAWLER-DIAGNOSTIC"

      - name: Verify current public sitemap URLs slowly
        shell: bash
        run: |
          set -Eeuo pipefail

          # Never spoof Googlebot from GitHub/Azure. Real Googlebot identity is
          # IP-based and must be verified from Google crawler ranges in origin logs.
          USER_AGENT="IlkOku-Public-Crawler-Guard/1.0 (+https://ilkoku.com)"
          REQUEST_DELAY_SECONDS=10

          normalize_url() {
            local value="$1"
            printf '%s' "${value%/}"
          }

          canonical_from_body() {
            local body="$1"
            local canonical_tag
            canonical_tag="$(grep -Eoi '<link[^>]+rel="canonical"[^>]+>' "$body" | head -1 || true)"
            printf '%s' "$canonical_tag" | sed -n 's/.*href="\([^"]*\)".*/\1/p'
          }

          circuit_break() {
            local code="$1"
            local url="$2"
            if [[ "$code" == "403" || "$code" == "429" ]]; then
              echo "CIRCUIT BREAKER: $url returned HTTP $code. Diagnostic stopped." >&2
              exit 1
            fi
          }

          check_page() {
            local url="$1"
            local headers body code robots canonical_href body_bytes h1_count title_count content_type

            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$headers")"
            body_bytes="$(wc -c < "$body" | tr -d ' ')"
            h1_count="$( { grep -Eoi '<h1([[:space:]][^>]*)?>' "$body" || true; } | wc -l | tr -d ' ')"
            title_count="$( { grep -Eoi '<title([[:space:]][^>]*)?>' "$body" || true; } | wc -l | tr -d ' ')"

            echo "$url -> HTTP $code | Content-Type: ${content_type:-YOK} | X-Robots-Tag: ${robots:-YOK} | bytes=$body_bytes | title=$title_count | h1=$h1_count"
            circuit_break "$code" "$url"

            [[ "$code" == "200" ]] || { echo "FAIL: $url returned HTTP $code" >&2; rm -f "$headers" "$body"; return 1; }
            [[ "${content_type,,}" == text/html* ]] || { echo "FAIL: $url returned unexpected Content-Type" >&2; rm -f "$headers" "$body"; return 1; }
            [[ "${robots,,}" != *"noindex"* ]] || { echo "FAIL: $url returned X-Robots-Tag noindex" >&2; rm -f "$headers" "$body"; return 1; }
            ! grep -Eqi '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' "$body" || { echo "FAIL: $url contains meta robots noindex" >&2; rm -f "$headers" "$body"; return 1; }
            (( body_bytes >= 5000 )) || { echo "FAIL: $url returned unexpectedly small HTML ($body_bytes bytes)" >&2; rm -f "$headers" "$body"; return 1; }
            (( title_count >= 1 )) || { echo "FAIL: $url title missing" >&2; rm -f "$headers" "$body"; return 1; }
            (( h1_count >= 1 )) || { echo "FAIL: $url H1 missing" >&2; rm -f "$headers" "$body"; return 1; }

            canonical_href="$(canonical_from_body "$body")"
            [[ -n "$canonical_href" ]] || { echo "FAIL: $url canonical missing" >&2; rm -f "$headers" "$body"; return 1; }
            [[ "$(normalize_url "$canonical_href")" == "$(normalize_url "$url")" ]] || { echo "FAIL: $url canonical mismatch: $canonical_href" >&2; rm -f "$headers" "$body"; return 1; }

            echo "PASS: $url canonical=$canonical_href"
            rm -f "$headers" "$body"
            sleep "$REQUEST_DELAY_SECONDS"
          }

          sitemap="$(mktemp)"
          trap 'rm -f "$sitemap"' EXIT

          sitemap_code="$(curl --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" --output "$sitemap" --write-out '%{http_code}' https://ilkoku.com/sitemap.xml || true)"
          echo "https://ilkoku.com/sitemap.xml -> HTTP $sitemap_code"
          circuit_break "$sitemap_code" "https://ilkoku.com/sitemap.xml"
          [[ "$sitemap_code" == "200" ]]

          mapfile -t sitemap_urls < <(grep -Eo '<loc>[^<]+</loc>' "$sitemap" | sed -E 's#</?loc>##g')
          (( ${#sitemap_urls[@]} > 0 )) || { echo "FAIL: sitemap contains no URLs" >&2; exit 1; }

          echo "Current public sitemap URLs: ${#sitemap_urls[@]}"

          for url in "${sitemap_urls[@]}"; do
            [[ "$url" == https://ilkoku.com/* ]] || { echo "FAIL: unexpected sitemap origin: $url" >&2; exit 1; }
            check_page "$url"
          done

          echo "PASS: current-sitemap crawler compatibility diagnostic completed for ${#sitemap_urls[@]} URL(s)."

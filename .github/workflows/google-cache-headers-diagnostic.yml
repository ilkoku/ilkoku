name: Google cache headers diagnostic

on:
  push:
    branches:
      - diag/google-cache-headers-20261002

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit live Googlebot HTML stability
        shell: bash
        run: |
          set -Eeuo pipefail
          UA='Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'

          header_value() {
            local file="$1"
            local name="$2"
            awk -v target="$name" 'BEGIN{IGNORECASE=1} $0 ~ "^" target ":" {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$file"
          }

          audit_url() {
            local url="$1"
            local h1 h2 b1 b2 c1 c2 hash1 hash2
            h1="$(mktemp)"; h2="$(mktemp)"; b1="$(mktemp)"; b2="$(mktemp)"

            c1="$(curl --silent --show-error --location --max-time 30 --user-agent "$UA" --header 'Accept-Encoding: identity' --dump-header "$h1" --output "$b1" --write-out '%{http_code}' "$url")"
            sleep 1
            c2="$(curl --silent --show-error --location --max-time 30 --user-agent "$UA" --header 'Accept-Encoding: identity' --dump-header "$h2" --output "$b2" --write-out '%{http_code}' "$url")"

            hash1="$(sha256sum "$b1" | awk '{print $1}')"
            hash2="$(sha256sum "$b2" | awk '{print $1}')"

            echo "=== $url"
            echo "status1=$c1 status2=$c2"
            echo "hash1=$hash1"
            echo "hash2=$hash2"
            if [[ "$hash1" == "$hash2" ]]; then echo "identical=yes"; else echo "identical=no"; fi
            echo "cache-control=$(header_value "$h1" 'cache-control' || true)"
            echo "etag=$(header_value "$h1" 'etag' || true)"
            echo "last-modified=$(header_value "$h1" 'last-modified' || true)"
            echo "cf-cache-status=$(header_value "$h1" 'cf-cache-status' || true)"
            echo "x-nextjs-cache=$(header_value "$h1" 'x-nextjs-cache' || true)"
            echo "email-markers=$(grep -Eoc 'email-protection#[0-9a-f]+|data-cfemail="[0-9a-f]+"' "$b1" || true)"
            echo "email-script=$(grep -Ec 'email-decode\.min\.js' "$b1" || true)"
            rm -f "$h1" "$h2" "$b1" "$b2"
            echo
          }

          audit_url 'https://ilkoku.com/'
          audit_url 'https://ilkoku.com/yazarlar-icin/kurgu/roman'
          audit_url 'https://ilkoku.com/editorler-icin/egitim/editorluge-baslama'
          audit_url 'https://ilkoku.com/sifremi-unuttum'

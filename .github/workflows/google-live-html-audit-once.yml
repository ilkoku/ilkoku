name: Google live HTML audit one-off

on:
  push:
    branches:
      - "diag/google-live-html-audit-20260930"
    paths:
      - ".github/workflows/google-live-html-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Audit current sitemap SSR HTML
        shell: bash
        run: |
          node <<'NODE'
          const BASE = "https://ilkoku.com";
          const sm = await fetch(BASE + "/sitemap.xml", {
            headers: { "user-agent": "IlkOku-Google-HTML-Audit/1.0", accept: "application/xml,text/xml;q=0.9,*/*;q=0.8" }
          });
          if (!sm.ok) throw new Error("sitemap HTTP " + sm.status);
          const xml = await sm.text();
          const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1].trim());
          const unique = [...new Set(urls)];
          console.log("SITEMAP_URLS", unique.length);

          const decode = (s) => String(s || "")
            .replace(/&amp;/g, "&").replace(/&quot;/g, '"')
            .replace(/&#39;|&apos;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
            .replace(/\s+/g, " ").trim();

          const attr = (tag, name) => {
            const re = new RegExp(name + "\\s*=\\s*([\"'])([\\s\\S]*?)\\1", "i");
            return (tag.match(re) || [])[2] || "";
          };
          const findMeta = (html, key, value) => {
            const tags = html.match(/<meta\b[^>]*>/gi) || [];
            for (const tag of tags) {
              if (attr(tag, key).toLowerCase() === value.toLowerCase()) return decode(attr(tag, "content"));
            }
            return "";
          };
          const findLink = (html, relValue) => {
            const tags = html.match(/<link\b[^>]*>/gi) || [];
            for (const tag of tags) {
              const rel = attr(tag, "rel").toLowerCase().split(/\s+/);
              if (rel.includes(relValue.toLowerCase())) return decode(attr(tag, "href"));
            }
            return "";
          };

          const rows = [];
          const concurrency = 6;
          let cursor = 0;
          async function worker() {
            while (true) {
              const i = cursor++;
              if (i >= unique.length) return;
              const url = unique[i];
              try {
                const response = await fetch(url, {
                  redirect: "follow",
                  headers: {
                    "user-agent": "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)",
                    accept: "text/html,application/xhtml+xml"
                  }
                });
                const html = await response.text();
                const title = decode((html.match(/<title\b[^>]*>([\s\S]*?)<\/title>/i) || [])[1] || "");
                const description = findMeta(html, "name", "description");
                const robots = findMeta(html, "name", "robots");
                const canonical = findLink(html, "canonical");
                const h1Count = (html.match(/<h1\b[^>]*>/gi) || []).length;
                const anchors = html.match(/<a\b[^>]*>/gi) || [];
                const internalLinks = new Set();
                for (const tag of anchors) {
                  const href = attr(tag, "href");
                  if (!href) continue;
                  try {
                    const target = new URL(href, url);
                    if (target.origin === BASE) {
                      target.hash = "";
                      internalLinks.add(target.href.replace(/\/$/, ""));
                    }
                  } catch {}
                }
                rows.push({
                  url,
                  status: response.status,
                  finalUrl: response.url,
                  title,
                  description,
                  robots,
                  canonical,
                  h1Count,
                  htmlBytes: Buffer.byteLength(html),
                  internalLinkCount: internalLinks.size
                });
              } catch (error) {
                rows.push({ url, error: String(error?.message || error) });
              }
            }
          }
          await Promise.all(Array.from({length: concurrency}, () => worker()));
          rows.sort((a,b) => a.url.localeCompare(b.url));

          const norm = (u) => {
            try {
              const x = new URL(u);
              x.hash = ""; x.search = "";
              return x.href.replace(/\/$/, "");
            } catch { return ""; }
          };
          const issues = [];
          const titleMap = new Map();
          const descMap = new Map();
          for (const r of rows) {
            const add = (type, detail="") => issues.push({type,url:r.url,detail});
            if (r.error) { add("FETCH_ERROR", r.error); continue; }
            if (r.status !== 200) add("NON_200", String(r.status));
            if (!r.title) add("MISSING_TITLE");
            if (!r.description) add("MISSING_DESCRIPTION");
            if (!r.canonical) add("MISSING_CANONICAL");
            else if (norm(r.canonical) !== norm(r.finalUrl)) add("CANONICAL_MISMATCH", r.canonical + " != " + r.finalUrl);
            if (/noindex/i.test(r.robots || "")) add("NOINDEX", r.robots);
            if (r.h1Count !== 1) add("H1_COUNT", String(r.h1Count));
            if (r.internalLinkCount < 2) add("LOW_INTERNAL_LINKS", String(r.internalLinkCount));
            if (r.title) {
              const k = r.title.toLowerCase();
              if (!titleMap.has(k)) titleMap.set(k, []);
              titleMap.get(k).push(r.url);
            }
            if (r.description) {
              const k = r.description.toLowerCase();
              if (!descMap.has(k)) descMap.set(k, []);
              descMap.get(k).push(r.url);
            }
          }
          const duplicateTitles = [...titleMap.entries()].filter(([,u]) => u.length > 1);
          const duplicateDescriptions = [...descMap.entries()].filter(([,u]) => u.length > 1);

          console.log("SUMMARY", JSON.stringify({
            audited: rows.length,
            fetchErrors: issues.filter(x=>x.type==="FETCH_ERROR").length,
            non200: issues.filter(x=>x.type==="NON_200").length,
            noindex: issues.filter(x=>x.type==="NOINDEX").length,
            missingTitle: issues.filter(x=>x.type==="MISSING_TITLE").length,
            missingDescription: issues.filter(x=>x.type==="MISSING_DESCRIPTION").length,
            missingCanonical: issues.filter(x=>x.type==="MISSING_CANONICAL").length,
            canonicalMismatch: issues.filter(x=>x.type==="CANONICAL_MISMATCH").length,
            badH1: issues.filter(x=>x.type==="H1_COUNT").length,
            lowInternalLinks: issues.filter(x=>x.type==="LOW_INTERNAL_LINKS").length,
            duplicateTitleGroups: duplicateTitles.length,
            duplicateDescriptionGroups: duplicateDescriptions.length
          }));
          for (const issue of issues) console.log("ISSUE", JSON.stringify(issue));
          for (const [title, u] of duplicateTitles) console.log("DUP_TITLE", JSON.stringify({title,urls:u}));
          for (const [description, u] of duplicateDescriptions) console.log("DUP_DESC", JSON.stringify({description,urls:u}));
          NODE

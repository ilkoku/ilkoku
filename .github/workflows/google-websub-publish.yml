name: Google WebSub publish

on:
  workflow_run:
    workflows:
      - Production smoke
    types:
      - completed
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish recent search updates
    if: >-
      github.event_name != 'workflow_run'
      || (
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Verify live Atom feed
        shell: bash
        run: |
          set -Eeuo pipefail
          body="$(mktemp)"
          code="$(curl --silent --show-error --location --max-time 20 --output "$body" --write-out '%{http_code}' https://ilkoku.com/recent-updates.atom)"
          test "$code" = "200"
          grep -Fq 'https://pubsubhubbub.appspot.com/' "$body"
          grep -Fq '<feed' "$body"
          grep -Fq '<entry>' "$body"
          grep -F '<updated>' "$body" | head -n 1

      - name: Publish feed to Google WebSub hub
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --silent --show-error --fail-with-body --max-time 20 \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'hub.mode=publish' \
            --data-urlencode 'hub.url=https://ilkoku.com/recent-updates.atom' \
            https://pubsubhubbub.appspot.com/
          echo "WebSub publish request accepted."

name: GSC full index census

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gsc-full-index-census.yml"
      - "scripts/gsc-full-index-census.mjs"
      - "src/lib/soft-launch-search-policy.ts"
      - "src/lib/seo/sitemap-data.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsc-full-index-census
  cancel-in-progress: false

jobs:
  census:
    name: Inspect all sitemap URLs
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate Search Console OAuth secrets
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
        run: |
          test -n "$GSC_OAUTH_CLIENT_ID" || { echo "Missing GSC_OAUTH_CLIENT_ID" >&2; exit 1; }
          test -n "$GSC_OAUTH_CLIENT_SECRET" || { echo "Missing GSC_OAUTH_CLIENT_SECRET" >&2; exit 1; }
          test -n "$GSC_OAUTH_REFRESH_TOKEN" || { echo "Missing GSC_OAUTH_REFRESH_TOKEN" >&2; exit 1; }

      - name: Inspect live sitemap census
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_SITE_URL: "sc-domain:ilkoku.com"
        run: node scripts/gsc-full-index-census.mjs

      - name: Upload census artifact
        uses: actions/upload-artifact@v6
        with:
          name: gsc-full-index-census
          path: /tmp/ilkoku-gsc-full-index-census.json
          if-no-files-found: error
          retention-days: 14

name: GSC sitemap resubmit once

on:
  push:
    branches:
      - "diag/gsc-batch-04-20260930"
    paths:
      - ".github/workflows/gsc-sitemap-resubmit-once.yml"

permissions:
  contents: read

jobs:
  submit:
    name: Resubmit current sitemap to Search Console
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Search Console OAuth secrets
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
        run: |
          test -n "$GSC_OAUTH_CLIENT_ID"
          test -n "$GSC_OAUTH_CLIENT_SECRET"
          test -n "$GSC_OAUTH_REFRESH_TOKEN"

      - name: Resubmit sitemap and verify Search Console accepted it
        shell: bash
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          token_json="$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GSC_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GSC_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GSC_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')"
          access_token="$(printf '%s' "$token_json" | jq -r '.access_token // empty')"
          test -n "$access_token"

          endpoint='https://www.googleapis.com/webmasters/v3/sites/sc-domain%3Ailkoku.com/sitemaps/https%3A%2F%2Filkoku.com%2Fsitemap.xml'
          http_code="$(curl -sS -o /tmp/gsc-submit-response.txt -w '%{http_code}' \
            -X PUT "$endpoint" \
            -H "Authorization: Bearer $access_token")"
          if [ "$http_code" != "200" ] && [ "$http_code" != "204" ]; then
            cat /tmp/gsc-submit-response.txt >&2
            echo "Unexpected sitemap submit HTTP $http_code" >&2
            exit 1
          fi
          echo "Sitemap submit accepted with HTTP $http_code"

          curl -sS --fail-with-body \
            'https://www.googleapis.com/webmasters/v3/sites/sc-domain%3Ailkoku.com/sitemaps' \
            -H "Authorization: Bearer $access_token" \
            | jq '{sitemap: [.sitemap[]? | select(.path=="https://ilkoku.com/sitemap.xml") | {path,lastSubmitted,lastDownloaded,isPending,errors,warnings,contents}]}'

name: GSC sitemap submit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gsc-sitemap-submit.yml"
      - "scripts/gsc-sitemap-submit.mjs"
      - "src/lib/soft-launch-search-policy.ts"
      - "src/lib/seo/sitemap-data.ts"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Çalıştırmak için SUBMIT-GSC-SITEMAP yazın"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gsc-sitemap-submit
  cancel-in-progress: false

jobs:
  submit:
    name: Submit sitemap to Google Search Console
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate explicit confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "SUBMIT-GSC-SITEMAP"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check Search Console write OAuth availability
        id: gsc_oauth
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_WRITE_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_WRITE_REFRESH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          available=true
          test -n "$GSC_OAUTH_CLIENT_ID" || available=false
          test -n "$GSC_OAUTH_CLIENT_SECRET" || available=false
          test -n "$GSC_OAUTH_WRITE_REFRESH_TOKEN" || available=false
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [[ "$available" == "false" ]]; then
            echo "::notice::GSC sitemap submit skipped because Search Console write OAuth is incomplete."
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "Manual sitemap submission requires complete Search Console write OAuth secrets." >&2
              exit 1
            fi
          fi

      - name: Submit live sitemap
        if: steps.gsc_oauth.outputs.available == 'true'
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_WRITE_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_WRITE_REFRESH_TOKEN }}
        run: node scripts/gsc-sitemap-submit.mjs

name: GSC URL Inspection diagnostic

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Çalıştırmak için RUN-GSC-URL-INSPECTION yazın"
        required: true
        type: string
      urls:
        description: "İsteğe bağlı: virgül veya yeni satırla ayrılmış en fazla 10 https://ilkoku.com URL'si"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gsc-url-inspection-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect Google index status
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Validate explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "RUN-GSC-URL-INSPECTION"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate Search Console OAuth secrets
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
        run: |
          test -n "$GSC_OAUTH_CLIENT_ID" || { echo "Missing GSC_OAUTH_CLIENT_ID" >&2; exit 1; }
          test -n "$GSC_OAUTH_CLIENT_SECRET" || { echo "Missing GSC_OAUTH_CLIENT_SECRET" >&2; exit 1; }
          test -n "$GSC_OAUTH_REFRESH_TOKEN" || { echo "Missing GSC_OAUTH_REFRESH_TOKEN" >&2; exit 1; }

      - name: Inspect representative URLs
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_SITE_URL: "sc-domain:ilkoku.com"
          GSC_INSPECTION_URLS: ${{ inputs.urls }}
        run: node scripts/gsc-url-inspection.mjs

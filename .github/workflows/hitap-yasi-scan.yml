name: Hitap Yasi Surface Scan

on:
  push:
    branches:
      - agent/hitap-yasi-global-surface

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print remaining target contexts
        shell: bash
        run: |
          show() {
            echo
            echo "===== $1 ====="
            if [ -f "$1" ]; then
              nl -ba "$1" | sed -n "$2"
            else
              echo "MISSING: $1"
            fi
          }
          show src/features/writer/components/NewWorkFlow.tsx '1,560p'
          show src/features/works/components/WorkEditDialog.tsx '1,620p'
          show src/features/showcase/components/BookShowcase.tsx '1,620p'
          show src/features/ownership/types.ts '1,260p'
          show src/features/ownership/queries.ts '1,500p'
          show src/features/ownership/components/OwnershipPassport.tsx '1,520p'
          show src/features/reader/components/ReaderWorksTable.tsx '1,460p'
          show src/app/okuyucu/page.tsx '1,520p'
          show src/app/tamamlanan-eserler/page.tsx '1,420p'
          show src/app/favorilerim/page.tsx '1,420p'
          show src/app/okumaya-devam/page.tsx '1,420p'
          show src/features/editor-workspace/common-discovery-query.ts '1,520p'
          show src/features/editor-workspace/components/EditorWorksTable.tsx '1,460p'
          show src/features/publisher-discovery/favorites-query.ts '1,520p'
          show src/app/admin/eserler/page.tsx '1,520p'
          show src/app/admin/eserler/[workId]/page.tsx '1,520p'
          show src/app/yayinevi/page.tsx '1,460p'
          show src/features/publisher-workspace/types.ts '1,320p'
          show src/features/publisher-workspace/queries.ts '1,520p'
          show src/features/publisher-workspace/repository.ts '1,520p'
          show src/features/publisher-workspace/components/PublisherDashboard.tsx '1,700p'
          show src/app/yayinevi/paylasilanlar/page.tsx '1,420p'
          show src/features/publisher-discovery/components/PublisherSharedItemsList.tsx '1,500p'
          show src/features/publisher-discovery/sharing-read-model.ts '1,520p'

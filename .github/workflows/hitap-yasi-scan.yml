name: Hitap Yasi Surface Scan

on:
  push:
    branches:
      - agent/hitap-yasi-global-surface

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan work classification and work-facing surfaces
        shell: bash
        run: |
          echo '=== CONTENT RATING REFERENCES ==='
          grep -RInE --exclude-dir=generated --exclude-dir=node_modules 'contentRating|workContentRating|İçerik sınıfı|İçerik ve yaş sınıfı|Yaş sınıfı|Hitap yaşı' src prisma || true
          echo '=== PASSPORT / OWNERSHIP REFERENCES ==='
          grep -RInE --exclude-dir=generated 'Pasaport|pasaport|Passport|passport|OwnershipStamp|ownershipStamp|publicId|WorkVersion' src || true
          echo '=== WORK SEARCH / FILTER SURFACES ==='
          grep -RInE --exclude-dir=generated 'Eser veya yazar|Eser adı|eser ara|Eser ara|work.*search|search.*work|name="arama"|name="tur"|Filtrele|filter' src/app src/features | head -n 1200 || true
          echo '=== READER WORK TABLE CALLERS ==='
          grep -RInE --exclude-dir=generated 'ReaderWorksTable|ReaderWorkRow' src || true

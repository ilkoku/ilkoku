name: Homepage critical path diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/homepage-critical-path-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live homepage assets
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -sS -L --max-time 30 https://ilkoku.com/ -o /tmp/home.html
          echo "=== HTML BYTES ==="
          wc -c /tmp/home.html
          echo "=== STYLESHEETS ==="
          grep -oE '<link[^>]+rel="stylesheet"[^>]+href="[^"]+"' /tmp/home.html | sed -E 's/.*href="([^"]+)".*/\1/' | tee /tmp/css.txt || true
          echo "stylesheet_count=$(wc -l < /tmp/css.txt)"
          echo "=== STYLESHEET HEADERS ==="
          while read -r href; do
            [ -n "$href" ] || continue
            if [[ "$href" == /* ]]; then url="https://ilkoku.com$href"; else url="$href"; fi
            printf '%s ' "$url"
            curl -sS -I -L --max-time 20 "$url" | awk 'BEGIN{IGNORECASE=1}/^content-length:/{gsub("\r",""); printf "bytes=%s ",$2}/^content-type:/{gsub("\r",""); printf "type=%s ",$2}END{print ""}'
          done < /tmp/css.txt
          echo "=== STYLESHEET BODIES ==="
          while read -r href; do
            [ -n "$href" ] || continue
            if [[ "$href" == /* ]]; then url="https://ilkoku.com$href"; else url="$href"; fi
            body="$(mktemp)"
            curl -sS -L --max-time 20 "$url" -o "$body"
            printf '%s bytes=%s markers=' "$href" "$(wc -c < "$body")"
            for marker in public-site-header nx-hero nx-history nx-role nx-passport nx-why nx-affiliate landing-footer site-consent; do
              if grep -q "$marker" "$body"; then printf '%s,' "$marker"; fi
            done
            echo
          done < /tmp/css.txt
          echo "=== PRELOADS ==="
          grep -oE '<link[^>]+rel="preload"[^>]*>' /tmp/home.html | head -50 || true
          echo "=== SCRIPTS ==="
          grep -oE '<script[^>]+src="[^"]+"' /tmp/home.html | sed -E 's/.*src="([^"]+)".*/\1/' | tee /tmp/js.txt || true
          echo "script_count=$(wc -l < /tmp/js.txt)"
          echo "=== HERO REFERENCES ==="
          grep -oE '[^" ]*ilkoku-hero-user-final[^" ]*' /tmp/home.html | head -20 || true

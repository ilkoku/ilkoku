name: Hostinger WAF Capacity Boundary Test

on:
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Cloudflare test kuralını yeni runner IP için hazırlama süresi"
        required: true
        default: "10"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
          - "20"
      confirmation:
        description: "Çalıştırmak için RUN-CAPACITY-BOUNDARY-TEST yazın"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hostinger-waf-capacity-boundary
  cancel-in-progress: false

jobs:
  stress:
    name: Boundary 30-45 VU production test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Validate explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "RUN-CAPACITY-BOUNDARY-TEST" ]; then
            echo "Explicit confirmation is required."
            exit 1
          fi
          case "$WAIT_MINUTES" in
            5|10|15|20) ;;
            *) echo "Unsupported wait_minutes: $WAIT_MINUTES"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Capture test runner IPv4 and schedule
        env:
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: |
          set -euo pipefail
          TEST_IP="$(curl -4 -fsS --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          if ! printf '%s' "$TEST_IP" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
            echo "Could not resolve a valid public IPv4: $TEST_IP"
            exit 1
          fi

          START_EPOCH=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          END_EPOCH=$(( START_EPOCH + 17 * 60 ))
          START_TR="$(TZ=Europe/Istanbul date -d "@$START_EPOCH" '+%d.%m.%Y %H:%M:%S %Z')"
          END_TR="$(TZ=Europe/Istanbul date -d "@$END_EPOCH" '+%d.%m.%Y %H:%M:%S %Z')"

          echo "TEST_RUNNER_IPV4=$TEST_IP" >> "$GITHUB_ENV"

          cat <<EOF_META
          ============================================================
          CLOUDFLARE TEST KURALI İÇİN RUNNER BİLGİSİ
          Test sunucusu genel IPv4: $TEST_IP
          Planlanan en erken test başlangıcı: $START_TR
          Tahmini test bitişi: $END_TR
          Alan adı: ilkoku.com
          Profil: 30 -> 35 -> 40 -> 45 VU
          Her basamak: 2 dakika.
          Yük başlamadan önce 10 ardışık temiz HTTP 200 gerekir.
          İlk LiteSpeed CAPTCHA veya HTTP 429 görülürse test durur.
          Bilinen sonuç: 25 VU PASS, 50 VU CAPTCHA ile STOP.
          ============================================================
          EOF_META

          printf '{"testRunnerIPv4":"%s","plannedStartTR":"%s","plannedEndTR":"%s","profile":"30,35,40,45","stageDuration":"2m","knownLowerPass":25,"knownUpperFail":50,"preflight":"10 consecutive clean HTTP 200 within 5 minutes","stopOn":"LiteSpeed CAPTCHA or HTTP 429"}\n' \
            "$TEST_IP" "$START_TR" "$END_TR" > hostinger-capacity-boundary-meta.json

      - name: Wait for Cloudflare test rule
        env:
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: |
          set -euo pipefail
          echo "Cloudflare geçici Skip kuralını yeni runner IP için güncellemeniz amacıyla $WAIT_MINUTES dakika bekleniyor."
          echo "Hostinger tarafında bu IP için allowlist yoktur."
          sleep "$((WAIT_MINUTES * 60))"

      - name: Verify runner IPv4 did not change
        run: |
          set -euo pipefail
          CURRENT_IP="$(curl -4 -fsS --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          echo "Initial IP: $TEST_RUNNER_IPV4"
          echo "Current IP: $CURRENT_IP"
          if [ "$CURRENT_IP" != "$TEST_RUNNER_IPV4" ]; then
            echo "Runner public IPv4 changed while waiting. Aborting before load test."
            exit 1
          fi

      - name: Wait for 10 consecutive clean preflight responses
        id: preflight
        continue-on-error: true
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 300 ))
          consecutive=0
          attempt=0
          mkdir -p k6-output
          : > k6-output/preflight.log

          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            headers="$(mktemp)"
            result="$(curl -L -sS --connect-timeout 8 --max-time 20 \
              -A 'Grafana k6/2.1.0' \
              -D "$headers" -o /dev/null -w '%{http_code}\t%{url_effective}' \
              https://ilkoku.com/ || printf '000\ttransport-error')"
            code="${result%%$'\t'*}"
            effective_url="${result#*$'\t'}"
            server="$(grep -i '^server:' "$headers" | tail -n1 | cut -d: -f2- | tr -d '\r' | xargs || true)"
            cf_ray="$(grep -i '^cf-ray:' "$headers" | tail -n1 | cut -d: -f2- | tr -d '\r' | xargs || true)"
            rm -f "$headers"

            clean=0
            if [ "$code" = "200" ] && [[ "$effective_url" != *"/.lsrecap/recaptcha"* ]]; then
              clean=1
            fi

            if [ "$clean" -eq 1 ]; then
              consecutive=$((consecutive + 1))
            else
              consecutive=0
            fi

            line="Preflight[$attempt] status=$code effective_url=$effective_url consecutive_clean=$consecutive/10 server=${server:-none} cf_ray=${cf_ray:-none} source_ip=$TEST_RUNNER_IPV4"
            echo "$line" | tee -a k6-output/preflight.log

            if [ "$consecutive" -ge 10 ]; then
              echo "Preflight PASS: 10 consecutive clean HTTP 200 responses."
              exit 0
            fi

            sleep 2
          done

          echo "Preflight FAILED: could not obtain 10 consecutive clean HTTP 200 responses within 5 minutes."
          exit 1

      - name: Prepare evidence directory
        if: steps.preflight.outcome == 'success'
        run: |
          set -euo pipefail
          chmod 0777 k6-output
          printf 'vus\tresult\texit_code\n' > k6-output/boundary-results.tsv

      - name: Run capacity boundary profile
        if: steps.preflight.outcome == 'success'
        id: boundary
        continue-on-error: true
        run: |
          set -uo pipefail
          levels=(30 35 40 45)
          failed_level=""

          for vus in "${levels[@]}"; do
            padded="$(printf '%03d' "$vus")"
            summary="/work/k6-output/stage-${padded}.json"
            logfile="k6-output/stage-${padded}.log"

            echo "============================================================"
            echo "START STAGE: ${vus} VU / 2m"
            echo "STOP CONDITIONS: LiteSpeed CAPTCHA or HTTP 429"
            echo "============================================================"

            set +e
            docker run --rm \
              -e TARGET_VUS="$vus" \
              -e TEST_DURATION="2m" \
              -v "$PWD:/work" \
              -w /work \
              grafana/k6:latest \
              run --summary-export="$summary" tests/load/hostinger-stepped-load.js \
              2>&1 | tee "$logfile"
            rc=${PIPESTATUS[0]}
            set -e

            result="PASS"
            if [ "$rc" -ne 0 ]; then
              result="STOP"
              failed_level="$vus"
            fi

            printf '%s\t%s\t%s\n' "$vus" "$result" "$rc" | tee -a k6-output/boundary-results.tsv

            if [ -n "$failed_level" ]; then
              echo "FAILED_LEVEL=$failed_level" >> "$GITHUB_ENV"
              echo "Test stopped at ${vus} VU. Higher levels will NOT run."
              break
            fi

            echo "${vus} VU passed. Cooling down for 30 seconds before next level."
            sleep 30
          done

          echo "============================================================"
          cat k6-output/boundary-results.tsv
          echo "============================================================"

          if [ -n "$failed_level" ]; then
            exit 1
          fi

      - name: Upload capacity boundary evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hostinger-capacity-boundary-${{ github.run_id }}
          path: |
            hostinger-capacity-boundary-meta.json
            k6-output/preflight.log
            k6-output/boundary-results.tsv
            k6-output/stage-*.json
            k6-output/stage-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve boundary result
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
        run: |
          set -euo pipefail

          if [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            echo "PRECHECK_FAILED: 10 consecutive clean HTTP 200 responses were not obtained. No load stage was started."
            exit 1
          fi

          if [ "$BOUNDARY_OUTCOME" != "success" ]; then
            echo "CAPACITY_BOUNDARY: test stopped at ${FAILED_LEVEL:-unknown} VU."
            echo "See the uploaded stage log and summary for CAPTCHA/429/latency metrics."
            exit 1
          fi

          echo "30, 35, 40 and 45 VU all passed. Known upper failure remains 50 VU."

name: IndexNow submit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/app/**"
      - "src/content/**"
      - "src/features/homepage/**"
      - "src/features/public-discovery/**"
      - "src/lib/public-site-navigation.ts"
      - "src/lib/public-page-metadata.ts"
      - "src/lib/public-brand.ts"
      - "public/**"
      - ".github/workflows/indexnow-submit.yml"

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  submit:
    name: Submit changed public URLs to IndexNow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve changed files
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          : > /tmp/changed-files.txt

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "__FULL_SUBMIT__" > /tmp/changed-files.txt
            exit 0
          fi

          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "__FULL_SUBMIT__" > /tmp/changed-files.txt
            exit 0
          fi

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi

          git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed-files.txt
          echo "Changed files:"
          cat /tmp/changed-files.txt

      - name: Wait for production and prepare IndexNow payload
        shell: bash
        run: |
          set -Eeuo pipefail

          KEY="f4c33493caf6550560462af5a424980e"
          KEY_URL="https://ilkoku.com/${KEY}.txt"
          SITEMAP_URL="https://ilkoku.com/sitemap.xml"
          READY=0

          for attempt in $(seq 1 20); do
            key_body="$(curl --silent --show-error --location --max-time 20 "$KEY_URL" || true)"
            sitemap_body="$(curl --silent --show-error --location --max-time 20 "$SITEMAP_URL" || true)"
            sitemap_ready=1

            for required in \
              'https://ilkoku.com/site-haritasi' \
              'https://ilkoku.com/yazarlar-icin/kurgu/roman' \
              'https://ilkoku.com/okurlar-icin/okumaya-baslama' \
              'https://ilkoku.com/editorler-icin/egitim/editorluge-baslama'; do
              if [[ "$sitemap_body" != *"<loc>${required}</loc>"* ]]; then
                sitemap_ready=0
              fi
            done

            if [[ "$key_body" == "$KEY" && "$sitemap_ready" == "1" ]]; then
              READY=1
              echo "Production IndexNow key and current public sitemap cohorts are ready."
              break
            fi

            echo "Production not ready yet (attempt ${attempt}/20)."
            sleep 15
          done

          test "$READY" = "1"
          curl --fail --silent --show-error --location --max-time 30 "$SITEMAP_URL" --output /tmp/sitemap.xml

          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          key = "f4c33493caf6550560462af5a424980e"
          base = "https://ilkoku.com"

          root = ET.parse("/tmp/sitemap.xml").getroot()
          sitemap_urls = []
          seen = set()
          for element in root.iter():
              if not element.tag.endswith("loc") or not element.text:
                  continue
              url = element.text.strip()
              if not url.startswith(f"{base}/") or url in seen:
                  continue
              seen.add(url)
              sitemap_urls.append(url)

          if not sitemap_urls:
              raise SystemExit("Sitemap contained no İlkOku public URLs")

          sitemap_set = set(sitemap_urls)
          changed = [
              line.strip()
              for line in Path("/tmp/changed-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          full_submit = "__FULL_SUBMIT__" in changed
          candidates = set()

          for file_path in changed:
              if file_path == "__FULL_SUBMIT__":
                  continue

              if file_path == ".github/workflows/indexnow-submit.yml":
                  full_submit = True
                  continue

              if file_path in {
                  "src/app/sitemap.ts",
                  "src/app/layout.tsx",
                  "src/lib/public-site-navigation.ts",
                  "src/lib/public-page-metadata.ts",
                  "src/lib/public-brand.ts",
              } or file_path.startswith("src/content/"):
                  full_submit = True
                  continue

              if file_path == "src/app/page.tsx" or file_path.startswith("src/features/homepage/"):
                  candidates.add(f"{base}/")
                  continue

              if file_path.startswith("public/"):
                  candidates.add(f"{base}/")
                  continue

              match = re.fullmatch(r"src/app/(.+)/page\.tsx", file_path)
              if not match:
                  continue

              route = match.group(1)
              if "[" in route:
                  full_submit = True
                  continue

              segments = [segment for segment in route.split("/") if not (segment.startswith("(") and segment.endswith(")"))]
              candidate = f"{base}/{'/'.join(segments)}"
              if candidate in sitemap_set:
                  candidates.add(candidate)

          urls = sitemap_urls if full_submit else sorted(candidates & sitemap_set)

          if not urls:
              print("No changed indexable public URLs; skipping IndexNow submission.")
              Path("/tmp/indexnow-skip").write_text("1", encoding="utf-8")
              raise SystemExit(0)

          if len(urls) > 10_000:
              raise SystemExit(f"IndexNow batch too large: {len(urls)}")

          payload = {
              "host": "ilkoku.com",
              "key": key,
              "keyLocation": f"{base}/{key}.txt",
              "urlList": urls,
          }
          Path("/tmp/indexnow.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          mode = "full sitemap" if full_submit else "changed public URLs"
          print(f"Prepared {len(urls)} URLs for IndexNow ({mode}).")
          PY

      - name: Submit IndexNow payload
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f /tmp/indexnow.json ]]; then
            echo "No IndexNow payload to submit."
            exit 0
          fi

          status=""
          for attempt in 1 2 3; do
            status="$(curl \
              --silent \
              --show-error \
              --output /tmp/indexnow-response.txt \
              --write-out '%{http_code}' \
              --max-time 60 \
              --request POST \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data-binary @/tmp/indexnow.json \
              https://api.indexnow.org/indexnow || true)"

            echo "IndexNow HTTP ${status} (attempt ${attempt}/3)"
            cat /tmp/indexnow-response.txt || true

            case "$status" in
              200|202)
                echo "PASS: IndexNow accepted the public URL batch."
                exit 0
                ;;
              429)
                sleep 30
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "FAIL: IndexNow submission was not accepted (last HTTP ${status})." >&2
          exit 1

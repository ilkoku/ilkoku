name: IndexNow submit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/app/**"
      - "src/content/**"
      - "src/features/homepage/**"
      - "src/features/public-discovery/**"
      - "src/components/layout/PublicSiteHeader.tsx"
      - "src/components/content/PublicTrustFooter.tsx"
      - "src/lib/public-site-navigation.ts"
      - "src/lib/public-brand.ts"
      - "src/lib/public-page-metadata.ts"
      - "public/**"
      - "scripts/prepare-indexnow-payload.mjs"
      - ".github/workflows/indexnow-submit.yml"

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  submit:
    name: Submit public URLs to IndexNow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          : > /tmp/indexnow-changed-files.txt

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "__FULL__" > /tmp/indexnow-changed-files.txt
            echo "Manual run: full IndexNow batch requested."
            exit 0
          fi

          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "__FULL__" > /tmp/indexnow-changed-files.txt
            echo "Previous commit is unavailable: falling back to a full IndexNow batch."
            exit 0
          fi

          git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > /tmp/indexnow-changed-files.txt
          echo "Changed files considered by IndexNow:"
          cat /tmp/indexnow-changed-files.txt

      - name: Wait for production and submit affected sitemap URLs
        shell: bash
        run: |
          set -Eeuo pipefail

          KEY="f4c33493caf6550560462af5a424980e"
          KEY_URL="https://ilkoku.com/${KEY}.txt"
          SITEMAP_URL="https://ilkoku.com/sitemap.xml"
          READY=0

          for attempt in $(seq 1 20); do
            key_body="$(curl --silent --show-error --location --max-time 20 "$KEY_URL" || true)"
            sitemap_body="$(curl --silent --show-error --location --max-time 20 "$SITEMAP_URL" || true)"
            sitemap_ready=1

            for required in \
              'https://ilkoku.com/site-haritasi' \
              'https://ilkoku.com/yazarlar-icin/kurgu/roman' \
              'https://ilkoku.com/okurlar-icin/okumaya-baslama' \
              'https://ilkoku.com/editorler-icin/egitim/editorluge-baslama'; do
              if [[ "$sitemap_body" != *"<loc>${required}</loc>"* ]]; then
                sitemap_ready=0
              fi
            done

            if [[ "$key_body" == "$KEY" && "$sitemap_ready" == "1" ]]; then
              READY=1
              echo "Production IndexNow key and current public sitemap cohorts are ready."
              break
            fi

            echo "Production not ready yet (attempt ${attempt}/20)."
            sleep 15
          done

          test "$READY" = "1"

          curl --fail --silent --show-error --location --max-time 30 "$SITEMAP_URL" --output /tmp/sitemap.xml

          node scripts/prepare-indexnow-payload.mjs \
            --sitemap /tmp/sitemap.xml \
            --changed-files /tmp/indexnow-changed-files.txt \
            --output /tmp/indexnow.json \
            --key "$KEY"

          URL_COUNT="$(node -e 'const fs=require("node:fs"); const payload=JSON.parse(fs.readFileSync("/tmp/indexnow.json","utf8")); process.stdout.write(String(payload.urlList.length));')"

          if [[ "$URL_COUNT" == "0" ]]; then
            echo "PASS: This push did not affect a public URL currently present in the production sitemap."
            exit 0
          fi

          status=""
          for attempt in 1 2 3; do
            status="$(curl \
              --silent \
              --show-error \
              --output /tmp/indexnow-response.txt \
              --write-out '%{http_code}' \
              --max-time 60 \
              --request POST \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data-binary @/tmp/indexnow.json \
              https://api.indexnow.org/indexnow || true)"

            echo "IndexNow HTTP ${status} (attempt ${attempt}/3)"
            cat /tmp/indexnow-response.txt || true

            case "$status" in
              200|202)
                echo "PASS: IndexNow accepted the public URL batch."
                exit 0
                ;;
              429)
                sleep 30
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "FAIL: IndexNow submission was not accepted (last HTTP ${status})." >&2
          exit 1

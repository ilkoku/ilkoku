name: Lockfile refresh

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify high-severity audit
        run: node scripts/audit-high-dependencies.mjs

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for dependency security patches"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload refreshed lockfile
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

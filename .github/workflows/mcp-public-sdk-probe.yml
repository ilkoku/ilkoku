name: Public MCP SDK compatibility probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mcp-public-sdk-probe.yml
      - scripts/mcp-public-sdk-candidate.mjs
      - scripts/mcp-public-sdk-probe.mjs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Resolve exact SDK dependency in disposable checkout
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact @modelcontextprotocol/server@2.4.0
          git diff -- package.json package-lock.json > /tmp/mcp-dependency.patch
          git diff --stat -- package.json package-lock.json
          cat /tmp/mcp-dependency.patch
      - name: Audit candidate supply chain
        run: |
          npm run audit:supply-chain
          node scripts/audit-high-dependencies.mjs
      - name: Install candidate dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Test official SDK against current protocol
        run: node scripts/mcp-public-sdk-probe.mjs
      - name: Preserve candidate lockfile and patch for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-sdk-candidate-lock
          path: |
            package.json
            package-lock.json
            /tmp/mcp-dependency.patch
          retention-days: 3

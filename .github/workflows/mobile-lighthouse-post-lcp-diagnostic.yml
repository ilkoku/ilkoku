name: Mobile Lighthouse post-LCP diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-lighthouse-post-lcp-diagnostic.yml"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Identify injected 1q6z resources
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -sS -L --max-time 20 https://ilkoku.com/ -o /tmp/home.html
          echo "=== HTML REFERENCES ==="
          grep -oE 'https?://[^"'\'' <>]*1q6z[^"'\'' <>]*|/1q6z[^"'\'' <>]*' /tmp/home.html | head -50 || true
          echo "=== HTML CONTEXT ==="
          grep -n -C 2 '1q6z' /tmp/home.html | head -100 || true
          base="$(grep -oE '/1q6z/[^"'\'' <>]*|/1q6z/' /tmp/home.html | head -1 || true)"
          echo "selected=$base"
          if [ -n "$base" ]; then
            echo "=== RESOURCE HEADERS ==="
            curl -sS -L --max-time 20 -D /tmp/rh -o /tmp/rbody "https://ilkoku.com$base"
            grep -Ei '^(HTTP/|content-type:|content-length:|cache-control:|server:|x-|cf-)' /tmp/rh || true
            echo "=== RESOURCE BODY PREFIX ==="
            head -c 1200 /tmp/rbody | tr '\n' ' '; echo
          fi

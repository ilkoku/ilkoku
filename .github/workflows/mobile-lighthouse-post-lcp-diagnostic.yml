name: Mobile Lighthouse post-LCP diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-lighthouse-post-lcp-diagnostic.yml"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe homepage delivery
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in 1 2 3; do
            echo "=== REQUEST $i ==="
            curl -sS -L --max-time 20 -D /tmp/hdr -o /dev/null \
              -w 'http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n' \
              https://ilkoku.com/
            grep -Ei '^(HTTP/|cache-control:|age:|etag:|vary:|server:|x-[^:]+:|cf-[^:]+:)' /tmp/hdr || true
          done

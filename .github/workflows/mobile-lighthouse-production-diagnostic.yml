name: Mobile Lighthouse production diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-lighthouse-production-diagnostic.yml"

permissions:
  contents: read

jobs:
  lighthouse:
    name: Measure production mobile performance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Lighthouse twice
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in 1 2; do
            npx --yes lighthouse@12.8.2 https://ilkoku.com/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance \
              --form-factor=mobile \
              --output=json \
              --output-path="lighthouse-$i.json"
          done

      - name: Inspect injected production scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://ilkoku.com/ -o /tmp/home.html
          echo "INJECTED_SCRIPT_CONTEXT_BEGIN"
          grep -o -E '.{0,220}(1q6z|cloudflareinsights|cdn-cgi|googletagmanager).{0,320}' /tmp/home.html || true
          echo "INJECTED_SCRIPT_CONTEXT_END"
          echo "SCRIPT_SRCS_BEGIN"
          grep -o -E '<script[^>]+src="[^"]+"' /tmp/home.html | sed -E 's/.*src="([^"]+)".*/\1/' | sort -u
          echo "SCRIPT_SRCS_END"
          echo "ONEQ6Z_HEADERS_BEGIN"
          curl -fsSL -D /tmp/1q6z.headers -o /tmp/1q6z.js https://ilkoku.com/1q6z/
          cat /tmp/1q6z.headers
          echo "ONEQ6Z_HEADERS_END"
          echo "ONEQ6Z_FINGERPRINT_BEGIN"
          head -c 1200 /tmp/1q6z.js | tr '\n' ' '; echo
          grep -Eio 'cloudflare|hostinger|monarx|bot|challenge|fingerprint|security|imperva|datadome|recaptcha|turnstile|akamai|sucuri' /tmp/1q6z.js | sort -u || true
          echo "ONEQ6Z_FINGERPRINT_END"

      - name: Summarize mobile metrics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const runs = [1,2].map((i) => JSON.parse(fs.readFileSync(`lighthouse-${i}.json`, "utf8")));
          const pick = (r) => ({
            score: Math.round(r.categories.performance.score * 100),
            fcp: r.audits["first-contentful-paint"].numericValue,
            lcp: r.audits["largest-contentful-paint"].numericValue,
            tbt: r.audits["total-blocking-time"].numericValue,
            cls: r.audits["cumulative-layout-shift"].numericValue,
            speedIndex: r.audits["speed-index"].numericValue,
            server: r.audits["server-response-time"]?.numericValue ?? null,
            lcpElement: r.audits["largest-contentful-paint-element"]?.details?.items?.[0]?.node?.snippet ?? null,
          });
          const metrics = runs.map(pick);
          console.log("LIGHTHOUSE_MOBILE_RUNS|" + JSON.stringify(metrics));
          const median = (xs) => [...xs].sort((a,b)=>a-b)[Math.floor(xs.length/2)];
          console.log("LIGHTHOUSE_MOBILE_MEDIAN|" + JSON.stringify({
            score: median(metrics.map(x=>x.score)),
            fcp: median(metrics.map(x=>x.fcp)),
            lcp: median(metrics.map(x=>x.lcp)),
            tbt: median(metrics.map(x=>x.tbt)),
            cls: median(metrics.map(x=>x.cls)),
            speedIndex: median(metrics.map(x=>x.speedIndex)),
            server: median(metrics.map(x=>x.server ?? 0)),
            lcpElement: metrics[0].lcpElement,
          }));

          const r = runs[1];
          const interesting = {};
          for (const [key, audit] of Object.entries(r.audits)) {
            if (
              /lcp|largest-contentful-paint|render-block|unused-javascript|unused-css|image-delivery|network-requests|mainthread|bootup|third-part/i.test(key)
            ) {
              interesting[key] = {
                score: audit.score,
                numericValue: audit.numericValue,
                displayValue: audit.displayValue,
                details: audit.details,
              };
            }
          }
          console.log("LIGHTHOUSE_DIAGNOSTICS|" + JSON.stringify(interesting));
          NODE

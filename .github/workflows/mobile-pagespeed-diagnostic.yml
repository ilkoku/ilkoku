name: Mobile Lighthouse diagnostic

on:
  push:
    branches:
      - diag/mobile-pagespeed-after-lcp-fix-20261001
    paths:
      - ".github/workflows/mobile-pagespeed-diagnostic.yml"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Show Chrome
        shell: bash
        run: |
          which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true
          google-chrome --version || google-chrome-stable --version || chromium --version || true

      - name: Run mobile Lighthouse
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes lighthouse@12.8.2 https://ilkoku.com/ \
            --only-categories=performance,accessibility,best-practices,seo \
            --form-factor=mobile \
            --screenEmulation.mobile \
            --screenEmulation.width=412 \
            --screenEmulation.height=823 \
            --screenEmulation.deviceScaleFactor=1.75 \
            --throttling-method=simulate \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=/tmp/lighthouse.json \
            --quiet
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const j = JSON.parse(fs.readFileSync("/tmp/lighthouse.json","utf8"));
          const c=j.categories,a=j.audits;
          const lcpItem=a["largest-contentful-paint-element"]?.details?.items?.[0] ?? null;
          const out={
            fetchTime:j.fetchTime,
            scores:{
              performance:Math.round((c.performance?.score??0)*100),
              accessibility:Math.round((c.accessibility?.score??0)*100),
              bestPractices:Math.round((c["best-practices"]?.score??0)*100),
              seo:Math.round((c.seo?.score??0)*100)
            },
            metrics:{
              fcp:a["first-contentful-paint"]?.numericValue,
              lcp:a["largest-contentful-paint"]?.numericValue,
              tbt:a["total-blocking-time"]?.numericValue,
              cls:a["cumulative-layout-shift"]?.numericValue,
              speedIndex:a["speed-index"]?.numericValue,
              serverResponse:a["server-response-time"]?.numericValue
            },
            lcpElement:lcpItem,
            diagnostics:{
              mainThread:a["mainthread-work-breakdown"]?.displayValue,
              bootup:a["bootup-time"]?.displayValue,
              unusedJs:a["unused-javascript"]?.displayValue,
              unusedCss:a["unused-css-rules"]?.displayValue,
              renderBlocking:a["render-blocking-resources"]?.displayValue,
              imageDelivery:a["uses-optimized-images"]?.displayValue
            }
          };
          const lcpAudits = Object.fromEntries(
            Object.entries(a)
              .filter(([k]) => /lcp|largest-contentful-paint|prioritize-lcp/i.test(k))
              .map(([k,v]) => [k, {title:v.title, displayValue:v.displayValue, numericValue:v.numericValue, details:v.details}])
          );
          const networkItems = a["network-requests"]?.details?.items ?? [];
          const heroRequests = networkItems.filter((x) => String(x.url || "").includes("ilkoku-hero-user-final"));
          console.log("LCP_AUDITS|"+JSON.stringify(lcpAudits));
          console.log("HERO_NETWORK|"+JSON.stringify(heroRequests));
          console.log("LIGHTHOUSE_RESULT|"+JSON.stringify(out));
          NODE

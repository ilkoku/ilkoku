name: One-time Next.js security lockfile refresh

on:
  push:
    branches:
      - security/next-16-4-2-20261022
    paths:
      - .github/workflows/next-security-lock-refresh.yml

permissions:
  contents: write

jobs:
  lockfile-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v6
        with:
          ref: security/next-16-4-2-20261022
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate consistent npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.4.2 eslint-config-next@16.4.2

      - name: Verify exact dependency pins
        run: |
          node -e 'const p=require("./package.json"),l=require("./package-lock.json");if(p.dependencies.next!=="16.4.2"||p.devDependencies["eslint-config-next"]!=="16.4.2"||l.packages["node_modules/next"].version!=="16.4.2"||l.packages["node_modules/eslint-config-next"].version!=="16.4.2")process.exit(1)'

      - name: Verify high and critical advisory gate
        run: node scripts/audit-high-dependencies.mjs

      - name: Commit lockfile to security branch
        run: |
          git config user.name "ilkoku-security-update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security(lock): resolve Next.js 16.4.2 dependency tree"
            git push origin HEAD:security/next-16-4-2-20261022
          fi

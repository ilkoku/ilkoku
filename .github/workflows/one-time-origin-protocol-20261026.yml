name: Approved one-time origin HTTP/1.1 and HTTP/2 diagnostic
on:
  push:
    branches:
      - ops/origin-protocol-one-time-20261026
permissions:
  contents: read
concurrency:
  group: one-time-origin-protocol-check-20261026
  cancel-in-progress: false
jobs:
  approved_two_request_check:
    if: github.event.head_commit.message == 'ops(origin): one-time approved HTTP1/H2 diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Two approved, read-only, direct-origin GETs (no retry)
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! curl -V | grep -q HTTP2; then
            echo "::error::Runner curl cannot test HTTP/2; no origin requests issued."
            exit 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          echo "DIAGNOSTIC_SCOPE host=ilkoku.com origin_ip=82.198.229.51 path=/api/build-info"
          echo "APPROVAL two GET requests, exactly one HTTP/1.1 and one HTTP/2, no retry"
          for proto in 1.1 2; do
            ec=0
            if [[ "$proto" == 1.1 ]]; then flag=--http1.1; else flag=--http2; fi
            result="$(curl "$flag" --noproxy '*' --retry 0 --silent --show-error \
              --connect-timeout 5 --max-time 12 \
              --resolve 'ilkoku.com:443:82.198.229.51' \
              --user-agent 'IlkOku-OneTime-Approved-Origin-Protocol-Test/1.0' \
              --header 'Cache-Control: no-store' \
              --dump-header "$tmp/$proto.headers" \
              --output "$tmp/$proto.body" \
              --write-out 'code=%{http_code} http_version=%{http_version} remote_ip=%{remote_ip} verify=%{ssl_verify_result} tcp_sec=%{time_connect} tls_sec=%{time_appconnect} ttfb_sec=%{time_starttransfer} total_sec=%{time_total}' \
              'https://ilkoku.com/api/build-info' 2>"$tmp/$proto.error")" || ec=$?
            echo "RESULT UTC=$(date -u +%FT%TZ) forced_http=$proto curl_exit=$ec $result"
            if [[ "$ec" != "0" ]]; then
              sed -E 's/[[:cntrl:]]//g' "$tmp/$proto.error" | cut -c1-180 | head -n2
            else
              python3 - "$tmp/$proto.body" "$proto" <<'PY'
          import json, re, sys
          try:
              content = json.load(open(sys.argv[1], encoding='utf-8'))
              sha = content.get('commitSha', '')
              valid = isinstance(sha, str) and bool(re.fullmatch('[a-f0-9]{40}', sha))
              print('BUILD_ID_VALID forced_http=' + sys.argv[2] + ' valid=' + str(valid).lower())
          except Exception:
              print('BUILD_ID_VALID forced_http=' + sys.argv[2] + ' valid=false')
          PY
            fi
          done
          echo 'COMPLETED: no further probes scheduled in this branch.'
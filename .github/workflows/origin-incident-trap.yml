name: Origin incident trap

on:
  schedule:
    # Minimum GitHub Actions cron cadence; GitHub may delay scheduled jobs.
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: origin-incident-trap
  cancel-in-progress: false

jobs:
  observe:
    name: Capture Cloudflare origin failures
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out passive trap
        uses: actions/checkout@v4

      - name: Validate sampling script
        run: bash -n scripts/origin-incident-trap.sh

      - name: Check GitHub scheduled probe coverage (no site requests)
        if: github.event_name == 'schedule'
        id: coverage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/origin-incident-trap.yml/runs?event=schedule&per_page=25" \
            > "${RUNNER_TEMP}/origin-schedule-history.json"
          python3 scripts/origin-schedule-coverage.py < "${RUNNER_TEMP}/origin-schedule-history.json"

      - name: Report scheduled coverage analyzer failure
        if: github.event_name == 'schedule' && steps.coverage.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "::warning::Origin scheduled-monitor coverage analyzer failed; healthy HTTP probes do not certify coverage."
          state="$(gh api "repos/${GITHUB_REPOSITORY}/issues/1856" --jq '.state' 2>/dev/null || echo unknown)"
          if [[ "$state" == 'open' ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/1856/comments" \
              -f body="SCHEDULE_COVERAGE ANALYZER_FAILURE in Actions run ${RUN_ID}: the GitHub-only coverage step failed. This is NOT a detected HTTP outage. Existing production probes still run independently."
          fi

      - name: Capture deployment and Cloudflare edge responses
        id: probe
        shell: bash
        env:
          SAMPLE_COUNT: ${{ github.event_name == 'push' && '50' || '4' }}
          SAMPLE_INTERVAL: ${{ github.event_name == 'push' && '6' || '15' }}
          EXPECTED_COMMIT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: bash scripts/origin-incident-trap.sh

      - name: Attach actual scheduled-coverage gaps to origin incident
        if: github.event_name == 'schedule' && steps.coverage.outputs.coverage_gap == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GAP_MINUTES: ${{ steps.coverage.outputs.gap_minutes }}
          PREVIOUS_UTC: ${{ steps.coverage.outputs.previous_utc }}
          CURRENT_UTC: ${{ steps.coverage.outputs.current_utc }}
        run: |
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/issues/1856" --jq '.state')" == 'open' ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/1856/comments" \
              -f body="SCHEDULE_COVERAGE GAP: ${GAP_MINUTES} minutes between scheduled Origin trap runs (${PREVIOUS_UTC} to ${CURRENT_UTC}). This is a monitoring coverage gap, NOT evidence of HTTP downtime. GitHub schedule events may be delayed or dropped. No additional production probes or infrastructure changes."
          else
            echo '::notice::Issue #1856 is closed; coverage gap retained in Actions summary.'
          fi

      - name: Save incident evidence
        if: steps.probe.outputs.incident == 'true' || steps.probe.outputs.blocked == 'true' || (github.event_name == 'push' && steps.probe.outputs.cutover_observed != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: origin-incident-${{ github.run_id }}-${{ github.run_attempt }}
          path: origin-trap-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Open or update GitHub incident and request PID snapshot
        if: steps.probe.outputs.incident == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          incident_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf 'Incident detected at %s UTC.\n\nEvidence and Cloudflare Ray IDs: %s\n\n~~~text\n%s\n~~~\n\nFor Hostinger process supervisor and reverse proxy logs, use exact UTC timestamp and Ray ID.\n' \
            "$incident_time" "$run_url" "$(cat origin-trap-evidence/probes.tsv)")"
          title='[Origin incident trap] Open edge connection investigation'
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"${title}\") | .number" | head -n1 || true)"
          if [[ -n "$issue" ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" -f body="$body" >/dev/null \
              || echo '::warning::Could not append incident details'
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" -f title="$title" -f body="$body" >/dev/null \
              || echo '::warning::Could not open incident issue'
          fi
          # Existing OIDC-protected workflow can collect the live PID after recovery.
          gh workflow run runtime-origin-health.yml --ref main \
            || echo '::warning::Could not dispatch correlated private PID check'

      - name: Fail if incident captured or monitoring blocked
        if: steps.probe.outputs.incident == 'true' || steps.probe.outputs.blocked == 'true'
        shell: bash
        run: |
          if [[ '${{ steps.probe.outputs.blocked }}' == 'true' ]]; then
            echo '::error::Monitoring blocked by 403/429; stopped production requests.'
          else
            echo '::error::Origin incident captured; review GitHub Issue and evidence artifact.'
          fi
          exit 1

name: Temporary Prisma security lock refresh (branch only)
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prisma-lock-refresh-20261120.yml

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.repository == 'ilkoku/ilkoku' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/prisma-7-10-1-20261120' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out isolated security branch
        uses: actions/checkout@v6
        with:
          ref: security/prisma-7-10-1-20261120
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Update only Prisma package family and MariaDB security override
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.overrides.mariadb='3.5.4';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact prisma@7.10.1 @prisma/client@7.10.1 @prisma/adapter-mariadb@7.10.1
          npm ci --ignore-scripts --no-fund --no-audit
      - name: Verify security and lockfile policy BEFORE committing
        run: |
          node scripts/audit-high-dependencies.mjs
          npm run audit:supply-chain
      - name: Commit generated lockfile to this branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependencies already up to date'
            exit 0
          fi
          git commit -m 'security(deps): align Prisma 7.10.1 and MariaDB patch lockfile'
          git push origin HEAD:refs/heads/security/prisma-7-10-1-20261120

name: Probe new-release sources

on:
  push:
    branches:
      - probe/new-release-sources-03ap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe new-release sources
        run: node scripts/probe-new-release-sources.mjs

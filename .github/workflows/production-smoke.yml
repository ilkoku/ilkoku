name: Production smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test-branch-chatgpt-2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify live İlkOku routes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for Hostinger deployment and verify routes
        shell: bash
        run: |
          set -Eeuo pipefail

          USER_AGENT="IlkOku-Production-Smoke/1.0"
          VERIFY_WINDOW_SECONDS=300
          EDGE_BLOCKED=0

          mark_edge_block() {
            local code="$1"
            if [[ "$code" == "403" ]]; then
              EDGE_BLOCKED=1
            fi
          }

          check_public_route() {
            local url="$1"
            local expected="$2"
            local code

            code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            mark_edge_block "$code"
            printf '%s -> HTTP %s\n' "$url" "$code"
            [[ "$code" == "$expected" ]]
          }

          check_body_contains() {
            local url="$1"
            shift
            local body
            local code
            local expected

            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --output "$body" --write-out '%{http_code}' "$url" || true)"
            mark_edge_block "$code"
            printf '%s -> HTTP %s\n' "$url" "$code"
            if [[ "$code" != "200" ]]; then
              rm -f "$body"
              return 1
            fi

            for expected in "$@"; do
              if ! grep -Fq "$expected" "$body"; then
                printf 'Eksik içerik: %s -> %s\n' "$url" "$expected" >&2
                rm -f "$body"
                return 1
              fi
            done

            if [[ "$url" == *"/sitemap.xml" ]]; then
              echo "Sitemap URL'leri:"
              grep -oE '<loc>[^<]+' "$body" | sed 's#<loc>##' | head -80 || true
            fi

            rm -f "$body"
          }

          check_image_asset() {
            local url="$1"
            local body
            local headers
            local code
            local content_type
            local bytes

            body="$(mktemp)"
            headers="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            mark_edge_block "$code"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            bytes="$(wc -c < "$body" | tr -d ' ')"
            printf '%s -> HTTP %s | Content-Type: %s | Bytes: %s\n' "$url" "$code" "${content_type:-YOK}" "$bytes"
            rm -f "$body" "$headers"

            [[ "$code" == "200" ]]
            [[ "${content_type,,}" == image/* ]]
            (( bytes >= 50000 ))
          }

          check_protected_route() {
            local url="$1"
            local headers
            local code
            local location

            headers="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            mark_edge_block "$code"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"

            printf '%s -> HTTP %s | Location: %s\n' "$url" "$code" "${location:-YOK}"

            case "$code" in
              301|302|303|307|308) ;;
              *) return 1 ;;
            esac

            [[ "$location" == *"/giris"* ]]
          }

          check_private_index_header() {
            local url="$1"
            local headers
            local code
            local robots

            headers="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            mark_edge_block "$code"
            robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"

            printf '%s -> HTTP %s | X-Robots-Tag: %s\n' "$url" "$code" "${robots:-YOK}"
            [[ "${robots,,}" == *"noindex"* ]]
            [[ "${robots,,}" == *"nofollow"* ]]
          }

          is_post_merge_main_push() {
            [[ "${GITHUB_EVENT_NAME:-}" == "push" && "${GITHUB_REF_NAME:-}" == "main" ]]
          }

          check_post_merge_protected_route() {
            local url="$1"
            if ! is_post_merge_main_push; then
              return 0
            fi
            check_protected_route "$url"
          }

          check_post_merge_private_index_header() {
            local url="$1"
            if ! is_post_merge_main_push; then
              return 0
            fi
            check_private_index_header "$url"
          }

          check_post_merge_public_route() {
            local url="$1"
            local expected="$2"
            if ! is_post_merge_main_push; then
              return 0
            fi
            check_public_route "$url" "$expected"
          }

          check_post_merge_body_contains() {
            if ! is_post_merge_main_push; then
              return 0
            fi
            check_body_contains "$@"
          }

          check_post_merge_cms_surface() {
            if ! is_post_merge_main_push; then
              return 0
            fi

            local path
            local routes=(
              "/icerik"
              "/icerik/arama"
              "/icerik/ana-sayfa"
              "/icerik/sayfalar"
              "/icerik/menuler"
              "/icerik/yasal"
              "/icerik/medya"
              "/icerik/sss"
              "/icerik/duyurular"
              "/icerik/yayin-kuyrugu"
              "/icerik/zamanlama"
              "/icerik/seo"
              "/icerik/formlar"
              "/icerik/yonlendirmeler"
              "/icerik/diller"
              "/icerik/hazirlik"
              "/icerik/saglik"
              "/icerik/gecmis"
              "/icerik/erisim"
              "/icerik/ayarlar"
            )

            echo "CMS yüzey taraması: ${#routes[@]} ana rota"
            for path in "${routes[@]}"; do
              check_protected_route "https://ilkoku.com${path}" || return 1
              check_private_index_header "https://ilkoku.com${path}" || return 1
            done
          }

          check_post_merge_redirect_route() {
            if ! is_post_merge_main_push; then
              return 0
            fi
            check_redirect_route "$@"
          }

          check_redirect_route() {
            local url="$1"
            local expected_location="$2"
            local headers
            local code
            local location

            headers="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            mark_edge_block "$code"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"

            printf '%s -> HTTP %s | Location: %s\n' "$url" "$code" "${location:-YOK}"
            [[ "$code" == "308" ]]
            [[ "$location" == *"$expected_location"* ]]
          }

          deadline=$((SECONDS + VERIFY_WINDOW_SECONDS))
          attempt=0

          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            EDGE_BLOCKED=0
            remaining=$((deadline - SECONDS))
            echo "Deneme $attempt | doğrulama penceresinde kalan: ${remaining}s"

            if check_public_route "https://ilkoku.com/" "200" \
              && check_public_route "https://ilkoku.com/giris" "200" \
              && check_public_route "https://ilkoku.com/yardim" "200" \
              && check_public_route "https://ilkoku.com/editorler" "200" \
              && check_public_route "https://ilkoku.com/iletisim" "200" \
              && check_public_route "https://ilkoku.com/hakkimizda" "200" \
              && check_image_asset "https://ilkoku.com/about/about-collaboration-hero.webp?v=3" \
              && check_post_merge_public_route "https://ilkoku.com/eserler" "200" \
              && check_public_route "https://ilkoku.com/yasal/kullanim-sartlari" "200" \
              && check_public_route "https://ilkoku.com/yasal/gizlilik-politikasi" "200" \
              && check_public_route "https://ilkoku.com/yasal/kvkk" "200" \
              && check_public_route "https://ilkoku.com/yasal/cerez-politikasi" "200" \
              && check_public_route "https://ilkoku.com/yasal/telif-hakki-politikasi" "200" \
              && check_public_route "https://ilkoku.com/en" "404" \
              && check_public_route "https://ilkoku.com/en/yardim" "404" \
              && check_body_contains "https://ilkoku.com/sitemap.xml" \
                "https://ilkoku.com/yardim" \
                "https://ilkoku.com/editorler" \
                "https://ilkoku.com/iletisim" \
                "https://ilkoku.com/hakkimizda" \
                "https://ilkoku.com/yasal/kullanim-sartlari" \
                "https://ilkoku.com/yasal/gizlilik-politikasi" \
                "https://ilkoku.com/yasal/kvkk" \
                "https://ilkoku.com/yasal/cerez-politikasi" \
                "https://ilkoku.com/yasal/telif-hakki-politikasi" \
              && check_post_merge_body_contains "https://ilkoku.com/" \
                "href=\"/hakkimizda\"" \
                "href=\"/iletisim\"" \
              && check_post_merge_body_contains "https://ilkoku.com/iletisim" \
                "İletişim" \
                "Ad Soyad" \
                "E-posta" \
                "Mesaj" \
              && check_post_merge_body_contains "https://ilkoku.com/sitemap.xml" \
                "https://ilkoku.com/eserler" \
                "https://ilkoku.com/eserler/yeni" \
                "https://ilkoku.com/eserler/guncellenen" \
                "https://ilkoku.com/yazarlar" \
                "https://ilkoku.com/turler" \
                "https://ilkoku.com/nasil-calisir" \
              && check_post_merge_body_contains "https://ilkoku.com/eserler" \
                "KEŞFE AÇIK ESER KÜTÜPHANESİ" \
                "Yeni yayımlananlar" \
                "Son güncellenenler" \
                "Yazarlar" \
                "Türler" \
              && check_post_merge_public_route "https://ilkoku.com/eserler/yeni" "200" \
              && check_post_merge_public_route "https://ilkoku.com/eserler/guncellenen" "200" \
              && check_post_merge_public_route "https://ilkoku.com/yazarlar" "200" \
              && check_post_merge_public_route "https://ilkoku.com/turler" "200" \
              && check_post_merge_public_route "https://ilkoku.com/nasil-calisir" "200" \
              && check_post_merge_body_contains "https://ilkoku.com/nasil-calisir" \
                "Eser İlkOku'da nasıl ilerler?" \
                "Kim neyi görebilir?" \
                "Eser Pasaportu" \
              && check_post_merge_redirect_route "https://ilkoku.com/rehber" "/nasil-calisir" \
              && check_post_merge_redirect_route "https://ilkoku.com/rehber/ilk-eseri-yayinlama-rehberi" "/nasil-calisir" \
              && check_post_merge_body_contains "https://ilkoku.com/eserler/rss.xml" \
                "<rss version=" \
                "İlkOku — Keşfe Açık Eserler" \
              && check_post_merge_public_route "https://ilkoku.com/editorler/merve-kaya" "404" \
              && check_post_merge_public_route "https://ilkoku.com/editorler/baris-erdem" "404" \
              && check_post_merge_public_route "https://ilkoku.com/editorler/derya-unal" "404" \
              && check_post_merge_public_route "https://ilkoku.com/editorler/kaan-sahin" "404" \
              && check_post_merge_public_route "https://ilkoku.com/kitap/test0408-2959175c" "404" \
              && check_post_merge_body_contains "https://ilkoku.com/robots.txt" \
                "Disallow: /admin" \
                "Disallow: /icerik" \
                "Disallow: /sistem-yonetimi" \
                "Disallow: /api" \
                "Disallow: /auth" \
                "Sitemap: https://ilkoku.com/sitemap.xml" \
              && check_post_merge_cms_surface \
              && check_post_merge_private_index_header "https://ilkoku.com/sistem-yonetimi/epostalar" \
              && check_post_merge_private_index_header "https://ilkoku.com/hesabim" \
              && check_post_merge_private_index_header "https://ilkoku.com/yazmaya-devam" \
              && check_post_merge_protected_route "https://ilkoku.com/hesabim" \
              && check_post_merge_protected_route "https://ilkoku.com/yazmaya-devam" \
              && check_post_merge_protected_route "https://ilkoku.com/icerik/onizleme/ana-sayfa" \
              && check_post_merge_protected_route "https://ilkoku.com/icerik/sayfalar/yeni" \
              && check_protected_route "https://ilkoku.com/sistem-yonetimi/epostalar" \
              && check_protected_route "https://ilkoku.com/sistem-yonetimi/okuma-guvenligi" \
              && check_redirect_route "https://ilkoku.com/admin/epostalar" "/sistem-yonetimi/epostalar" \
              && check_redirect_route "https://ilkoku.com/admin/okuma-guvenligi" "/sistem-yonetimi/okuma-guvenligi" \
              && check_protected_route "https://ilkoku.com/yayinevleri" \
              && check_protected_route "https://ilkoku.com/bildirimler" \
              && check_protected_route "https://ilkoku.com/yorumlarim" \
              && check_protected_route "https://ilkoku.com/yorumlarim/rapor" \
              && check_protected_route "https://ilkoku.com/editor/bildirimler" \
              && check_protected_route "https://ilkoku.com/editor/yayinevi-talepleri" \
              && check_protected_route "https://ilkoku.com/yayinevi/bildirimler" \
              && check_protected_route "https://ilkoku.com/yayinevi/editor-talepleri" \
              && check_protected_route "https://ilkoku.com/yayinevi/kesfet/eserler" \
              && check_protected_route "https://ilkoku.com/yayinevi/favorilerim"; then
              echo "PASS: Production public/private route paketi, Hakkımızda/İletişim footer kontratı, Hakkımızda hero asset'i, sitemap/robots ve 20 ana CMS rotası doğrulandı."
              exit 0
            fi

            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi

            if [[ "$EDGE_BLOCKED" == "1" ]]; then
              delay=30
              echo "EDGE/WAF 403 algılandı; tüm rota paketini hemen tekrar taramak yerine kontrollü backoff uygulanıyor."
            else
              delay=10
            fi

            if (( delay > remaining )); then
              delay=$remaining
            fi
            sleep "$delay"
          done

          echo "FAIL: Production deployment 5 dakikalık doğrulama penceresi içinde doğrulanamadı." >&2
          exit 1
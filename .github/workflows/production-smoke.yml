name: Production smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Canlı kontrol kapsamı"
        required: true
        default: "minimum"
        type: choice
        options:
          - minimum
          - deep
  push:
    branches:
      - main
      - test-branch-chatgpt-2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-live-crawler
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'pull_request'
    name: Verify live İlkOku routes
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Run low-impact production smoke
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'minimum' }}
        run: |
          set -Eeuo pipefail

          USER_AGENT="IlkOku-Production-Smoke/1.0"
          REQUEST_DELAY_SECONDS=5

          pace() { sleep "$REQUEST_DELAY_SECONDS"; }

          header_value() {
            local headers="$1"
            local name="$2"
            grep -i "^${name}:" "$headers" | tail -n1 | cut -d: -f2- | tr -d '\r' | xargs || true
          }

          print_edge_headers() {
            local headers="$1"
            local server cf_ray cf_cache hcdn hcdn_cache retry_after
            server="$(header_value "$headers" "server")"
            cf_ray="$(header_value "$headers" "cf-ray")"
            cf_cache="$(header_value "$headers" "cf-cache-status")"
            hcdn="$(header_value "$headers" "hcdn-request-id")"
            hcdn_cache="$(header_value "$headers" "x-hcdn-cache-status")"
            retry_after="$(header_value "$headers" "retry-after")"
            echo "EDGE server=${server:-YOK} | cf-ray=${cf_ray:-YOK} | cf-cache-status=${cf_cache:-YOK} | hcdn-request-id=${hcdn:-YOK} | x-hcdn-cache-status=${hcdn_cache:-YOK} | retry-after=${retry_after:-YOK}"
          }

          fail_on_edge_block() {
            local code="$1"
            local url="$2"
            if [[ "$code" == "403" || "$code" == "429" ]]; then
              echo "CIRCUIT BREAKER: $url returned HTTP $code. No further production requests will be sent." >&2
              exit 1
            fi
          }

          check_status() {
            local url="$1"
            local expected="$2"
            local headers code
            headers="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            echo "$url -> HTTP $code"
            print_edge_headers "$headers"
            if [[ "$code" == "403" || "$code" == "429" ]]; then
              rm -f "$headers"
              fail_on_edge_block "$code" "$url"
            fi
            rm -f "$headers"
            [[ "$code" == "$expected" ]]
            pace
          }

          check_post_merge_public_route() {
            check_status "$1" "$2"
          }

          check_body() {
            local url="$1"
            shift
            local headers body code marker
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            echo "$url -> HTTP $code"
            print_edge_headers "$headers"
            if [[ "$code" == "403" || "$code" == "429" ]]; then
              rm -f "$headers" "$body"
              fail_on_edge_block "$code" "$url"
            fi
            rm -f "$headers"
            [[ "$code" == "200" ]] || { rm -f "$body"; return 1; }
            for marker in "$@"; do
              grep -Fq "$marker" "$body" || { echo "Eksik içerik: $url -> $marker" >&2; rm -f "$body"; return 1; }
            done
            rm -f "$body"
            pace
          }

          check_post_merge_body_excludes() {
            local url="$1"
            shift
            local headers body code forbidden
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            echo "$url -> HTTP $code"
            print_edge_headers "$headers"
            if [[ "$code" == "403" || "$code" == "429" ]]; then
              rm -f "$headers" "$body"
              fail_on_edge_block "$code" "$url"
            fi
            rm -f "$headers"
            [[ "$code" == "200" ]] || { rm -f "$body"; return 1; }
            for forbidden in "$@"; do
              if grep -Fq "$forbidden" "$body"; then
                echo "Beklenmeyen içerik: $url -> $forbidden" >&2
                rm -f "$body"
                return 1
              fi
            done
            rm -f "$body"
            pace
          }

          check_redirect_and_noindex() {
            local url="$1"
            local expected_location="$2"
            local headers code location robots
            headers="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            echo "$url -> HTTP $code"
            print_edge_headers "$headers"
            if [[ "$code" == "403" || "$code" == "429" ]]; then
              rm -f "$headers"
              fail_on_edge_block "$code" "$url"
            fi
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"
            echo "Location: ${location:-YOK} | X-Robots-Tag: ${robots:-YOK}"
            [[ "$code" == "301" || "$code" == "302" || "$code" == "307" || "$code" == "308" ]]
            [[ "$location" == *"$expected_location"* ]]
            [[ "${robots,,}" == *"noindex"* ]]
            [[ "${robots,,}" == *"nofollow"* ]]
            pace
          }

          # Give the Hostinger deployment a quiet window before the first probe.
          sleep 45

          # Automatic main-push smoke: six requests total. This is intentionally
          # small because Hostinger rate-limits Azure/GitHub automation traffic.
          check_body "https://ilkoku.com/" "İlk cümle"
          check_status "https://ilkoku.com/nasil-calisir" "200"
          check_body "https://ilkoku.com/robots.txt" "Allow: /" "Sitemap: https://ilkoku.com/sitemap.xml"
          check_body "https://ilkoku.com/sitemap.xml" "https://ilkoku.com/" "https://ilkoku.com/nasil-calisir"
          check_redirect_and_noindex "https://ilkoku.com/hesabim" "/giris"
          check_status "https://ilkoku.com/eserler" "404"

          if [[ "$REQUESTED_MODE" != "deep" ]]; then
            echo "PASS: low-impact production smoke completed with 6 requests."
            exit 0
          fi

          echo "Manual deep mode selected; continuing slowly and stopping immediately on 403/429."

          # Paused-discovery checks remain available, but only in explicitly
          # requested deep mode so every merge does not spend the edge budget.
          check_post_merge_public_route "https://ilkoku.com/eserler" "404"
          check_post_merge_public_route "https://ilkoku.com/eserler/yeni" "404"
          check_post_merge_public_route "https://ilkoku.com/eserler/guncellenen" "404"
          check_post_merge_public_route "https://ilkoku.com/yazarlar" "404"
          check_post_merge_public_route "https://ilkoku.com/turler" "404"
          check_post_merge_public_route "https://ilkoku.com/eserler/rss.xml" "404"
          check_post_merge_body_excludes "https://ilkoku.com/sitemap.xml" \
            "<loc>https://ilkoku.com/eserler</loc>" \
            "<loc>https://ilkoku.com/eserler/yeni</loc>" \
            "<loc>https://ilkoku.com/eserler/guncellenen</loc>" \
            "<loc>https://ilkoku.com/yazarlar</loc>" \
            "<loc>https://ilkoku.com/turler</loc>"

          critical_redirects=(
            "https://ilkoku.com/yayinevleri"
            "https://ilkoku.com/bildirimler"
            "https://ilkoku.com/yorumlarim"
            "https://ilkoku.com/yorumlarim/rapor"
            "https://ilkoku.com/editor/bildirimler"
            "https://ilkoku.com/editor/yayinevi-talepleri"
            "https://ilkoku.com/yayinevi/bildirimler"
            "https://ilkoku.com/yayinevi/editor-talepleri"
            "https://ilkoku.com/yayinevi/kesfet/eserler"
            "https://ilkoku.com/yazmaya-devam"
          )
          for url in "${critical_redirects[@]}"; do
            check_redirect_and_noindex "$url" "/giris"
          done

          for url in \
            "https://ilkoku.com/editorler" \
            "https://ilkoku.com/iletisim" \
            "https://ilkoku.com/hakkimizda" \
            "https://ilkoku.com/icerik-ve-yas-politikasi" \
            "https://ilkoku.com/yazarlar-icin"; do
            check_status "$url" "200"
          done

          echo "PASS: manually requested deep production smoke completed."

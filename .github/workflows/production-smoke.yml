name: Production smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test-branch-chatgpt-2
  pull_request:
    branches:
      - main

permissions:
  contents: read

# All live-crawler workflows share one queue. Hostinger applies server-level
# rate limits to automated traffic from cloud networks, so production probes
# must never burst against the site in parallel.
concurrency:
  group: production-live-crawler
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify live İlkOku routes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for Hostinger deployment and verify routes
        shell: bash
        run: |
          set -Eeuo pipefail

          USER_AGENT="IlkOku-Production-Smoke/1.0"
          VERIFY_WINDOW_SECONDS=300
          REQUEST_DELAY_SECONDS=2
          EDGE_BLOCKED=0

          pace() {
            sleep "$REQUEST_DELAY_SECONDS"
          }

          mark_edge_block() {
            local code="$1"
            if [[ "$code" == "403" || "$code" == "429" ]]; then
              EDGE_BLOCKED=1
            fi
          }

          fetch_code() {
            local url="$1"
            local follow="${2:-yes}"
            local code
            if [[ "$follow" == "yes" ]]; then
              code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            else
              code="$(curl --silent --show-error --max-time 20 --user-agent "$USER_AGENT" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            fi
            mark_edge_block "$code"
            pace
            printf '%s' "$code"
          }

          check_public_route() {
            local url="$1"
            local expected="$2"
            local code
            code="$(fetch_code "$url")"
            printf '%s -> HTTP %s\n' "$url" "$code"
            [[ "$code" == "$expected" ]]
          }

          check_post_merge_public_route() {
            local url="$1"
            local expected="$2"
            if [[ "${GITHUB_EVENT_NAME:-}" != "push" || "${GITHUB_REF_NAME:-}" != "main" ]]; then
              return 0
            fi
            check_public_route "$url" "$expected"
          }

          check_body_contains() {
            local url="$1"
            shift
            local body code expected
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --output "$body" --write-out '%{http_code}' "$url" || true)"
            mark_edge_block "$code"
            pace
            printf '%s -> HTTP %s\n' "$url" "$code"
            if [[ "$code" != "200" ]]; then
              rm -f "$body"
              return 1
            fi
            for expected in "$@"; do
              grep -Fq "$expected" "$body" || { echo "Eksik içerik: $url -> $expected" >&2; rm -f "$body"; return 1; }
            done
            rm -f "$body"
          }

          check_body_excludes() {
            local url="$1"
            shift
            local body code forbidden
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 20 --user-agent "$USER_AGENT" --output "$body" --write-out '%{http_code}' "$url" || true)"
            mark_edge_block "$code"
            pace
            printf '%s -> HTTP %s\n' "$url" "$code"
            if [[ "$code" != "200" ]]; then
              rm -f "$body"
              return 1
            fi
            for forbidden in "$@"; do
              if grep -Fq "$forbidden" "$body"; then
                echo "Beklenmeyen içerik: $url -> $forbidden" >&2
                rm -f "$body"
                return 1
              fi
            done
            rm -f "$body"
          }

          check_post_merge_body_excludes() {
            if [[ "${GITHUB_EVENT_NAME:-}" != "push" || "${GITHUB_REF_NAME:-}" != "main" ]]; then
              return 0
            fi
            check_body_excludes "$@"
          }

          check_redirect() {
            local url="$1"
            local expected_location="$2"
            local headers code location
            headers="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            mark_edge_block "$code"
            pace
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"
            printf '%s -> HTTP %s | Location: %s\n' "$url" "$code" "${location:-YOK}"
            [[ "$code" == "301" || "$code" == "302" || "$code" == "307" || "$code" == "308" ]]
            [[ "$location" == *"$expected_location"* ]]
          }

          check_private_header() {
            local url="$1"
            local headers code robots
            headers="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --user-agent "$USER_AGENT" --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            mark_edge_block "$code"
            pace
            robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"
            printf '%s -> HTTP %s | X-Robots-Tag: %s\n' "$url" "$code" "${robots:-YOK}"
            [[ "${robots,,}" == *"noindex"* ]]
            [[ "${robots,,}" == *"nofollow"* ]]
          }

          verify_minimum() {
            check_public_route "https://ilkoku.com/" "200" \
              && check_public_route "https://ilkoku.com/giris" "200" \
              && check_public_route "https://ilkoku.com/yardim" "200" \
              && check_body_contains "https://ilkoku.com/robots.txt" \
                "Allow: /" \
                "Sitemap: https://ilkoku.com/sitemap.xml" \
              && check_body_contains "https://ilkoku.com/sitemap.xml" \
                "https://ilkoku.com/" \
                "https://ilkoku.com/nasil-calisir" \
                "https://ilkoku.com/hakkimizda"
          }

          verify_post_merge() {
            if [[ "${GITHUB_EVENT_NAME:-}" != "push" || "${GITHUB_REF_NAME:-}" != "main" ]]; then
              return 0
            fi

            check_public_route "https://ilkoku.com/editorler" "200" \
              && check_public_route "https://ilkoku.com/iletisim" "200" \
              && check_public_route "https://ilkoku.com/nasil-calisir" "200" \
              && check_public_route "https://ilkoku.com/hakkimizda" "200" \
              && check_public_route "https://ilkoku.com/icerik-ve-yas-politikasi" "200" \
              && check_public_route "https://ilkoku.com/yazarlar-icin" "200" \
              && check_public_route "https://ilkoku.com/yasal/kvkk" "200" \
              && check_public_route "https://ilkoku.com/yasal/gizlilik-politikasi" "200" \
              && check_post_merge_public_route "https://ilkoku.com/eserler" "404" \
              && check_post_merge_public_route "https://ilkoku.com/eserler/yeni" "404" \
              && check_post_merge_public_route "https://ilkoku.com/eserler/guncellenen" "404" \
              && check_post_merge_public_route "https://ilkoku.com/yazarlar" "404" \
              && check_post_merge_public_route "https://ilkoku.com/turler" "404" \
              && check_post_merge_public_route "https://ilkoku.com/eserler/rss.xml" "404" \
              && check_post_merge_body_excludes "https://ilkoku.com/sitemap.xml" \
                "<loc>https://ilkoku.com/eserler</loc>" \
                "<loc>https://ilkoku.com/eserler/yeni</loc>" \
                "<loc>https://ilkoku.com/eserler/guncellenen</loc>" \
                "<loc>https://ilkoku.com/yazarlar</loc>" \
                "<loc>https://ilkoku.com/turler</loc>" \
              && check_redirect "https://ilkoku.com/rehber" "/nasil-calisir" \
              && check_redirect "https://ilkoku.com/hesabim" "/giris" \
              && check_private_header "https://ilkoku.com/hesabim" \
              && check_private_header "https://ilkoku.com/icerik" \
              && check_redirect "https://ilkoku.com/bildirimler" "/giris" \
              && check_redirect "https://ilkoku.com/yayinevleri" "/giris" \
              && check_redirect "https://ilkoku.com/yorumlarim" "/giris" \
              && check_redirect "https://ilkoku.com/yorumlarim/rapor" "/giris" \
              && check_redirect "https://ilkoku.com/editor/bildirimler" "/giris" \
              && check_redirect "https://ilkoku.com/editor/yayinevi-talepleri" "/giris" \
              && check_redirect "https://ilkoku.com/yayinevi/bildirimler" "/giris" \
              && check_redirect "https://ilkoku.com/yayinevi/editor-talepleri" "/giris" \
              && check_redirect "https://ilkoku.com/yayinevi/kesfet/eserler" "/giris" \
              && check_redirect "https://ilkoku.com/yazmaya-devam" "/giris"
          }

          deadline=$((SECONDS + VERIFY_WINDOW_SECONDS))
          attempt=0

          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            EDGE_BLOCKED=0
            echo "Deneme $attempt"

            if verify_minimum && verify_post_merge; then
              echo "PASS: rate-limit-safe production smoke tamamlandı."
              exit 0
            fi

            remaining=$((deadline - SECONDS))
            (( remaining > 0 )) || break

            if [[ "$EDGE_BLOCKED" == "1" ]]; then
              delay=60
              echo "EDGE/WAF 403/429 algılandı; 60 saniye backoff uygulanıyor."
            else
              delay=20
            fi

            (( delay <= remaining )) || delay=$remaining
            sleep "$delay"
          done

          echo "FAIL: Production deployment doğrulama penceresinde geçmedi." >&2
          exit 1

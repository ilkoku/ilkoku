name: Production smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify live İlkOku routes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for Hostinger deployment and verify routes
        shell: bash
        run: |
          set -Eeuo pipefail

          check_public_route() {
            local url="$1"
            local expected="$2"
            local code

            code="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$url" || true)"
            printf '%s -> HTTP %s\n' "$url" "$code"
            [[ "$code" == "$expected" ]]
          }

          check_body_contains() {
            local url="$1"
            shift
            local body
            local code
            local expected

            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 20 --output "$body" --write-out '%{http_code}' "$url" || true)"
            printf '%s -> HTTP %s\n' "$url" "$code"
            if [[ "$code" != "200" ]]; then
              rm -f "$body"
              return 1
            fi

            for expected in "$@"; do
              if ! grep -Fq "$expected" "$body"; then
                printf 'Eksik içerik: %s -> %s\n' "$url" "$expected" >&2
                rm -f "$body"
                return 1
              fi
            done

            if [[ "$url" == *"/sitemap.xml" ]]; then
              echo "Sitemap URL'leri:"
              grep -oE '<loc>[^<]+' "$body" | sed 's#<loc>##' | head -80 || true
            fi

            rm -f "$body"
          }

          check_protected_route() {
            local url="$1"
            local headers
            local code
            local location

            headers="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"

            printf '%s -> HTTP %s | Location: %s\n' "$url" "$code" "${location:-YOK}"

            case "$code" in
              301|302|303|307|308) ;;
              *) return 1 ;;
            esac

            [[ "$location" == *"/giris"* ]]
          }

          check_post_merge_protected_route() {
            local url="$1"
            if [[ "${GITHUB_EVENT_NAME:-}" != "push" ]]; then
              return 0
            fi
            check_protected_route "$url"
          }

          check_post_merge_public_route() {
            local url="$1"
            local expected="$2"
            if [[ "${GITHUB_EVENT_NAME:-}" != "push" ]]; then
              return 0
            fi
            check_public_route "$url" "$expected"
          }

          check_post_merge_body_contains() {
            if [[ "${GITHUB_EVENT_NAME:-}" != "push" ]]; then
              return 0
            fi
            check_body_contains "$@"
          }

          check_redirect_route() {
            local url="$1"
            local expected_location="$2"
            local headers
            local code
            local location

            headers="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"

            printf '%s -> HTTP %s | Location: %s\n' "$url" "$code" "${location:-YOK}"
            [[ "$code" == "308" ]]
            [[ "$location" == *"$expected_location"* ]]
          }

          for attempt in $(seq 1 30); do
            echo "Deneme $attempt/30"

            if check_public_route "https://ilkoku.com/" "200" \
              && check_public_route "https://ilkoku.com/giris" "200" \
              && check_public_route "https://ilkoku.com/yardim" "200" \
              && check_public_route "https://ilkoku.com/editorler" "200" \
              && check_public_route "https://ilkoku.com/yasal/kullanim-sartlari" "200" \
              && check_public_route "https://ilkoku.com/yasal/gizlilik-politikasi" "200" \
              && check_public_route "https://ilkoku.com/yasal/kvkk" "200" \
              && check_public_route "https://ilkoku.com/yasal/cerez-politikasi" "200" \
              && check_public_route "https://ilkoku.com/yasal/telif-hakki-politikasi" "200" \
              && check_public_route "https://ilkoku.com/en" "404" \
              && check_public_route "https://ilkoku.com/en/yardim" "404" \
              && check_body_contains "https://ilkoku.com/sitemap.xml" \
                "https://ilkoku.com/yardim" \
                "https://ilkoku.com/editorler" \
                "https://ilkoku.com/rehber" \
                "https://ilkoku.com/yasal/kullanim-sartlari" \
                "https://ilkoku.com/yasal/gizlilik-politikasi" \
                "https://ilkoku.com/yasal/kvkk" \
                "https://ilkoku.com/yasal/cerez-politikasi" \
                "https://ilkoku.com/yasal/telif-hakki-politikasi" \
              && check_post_merge_public_route "https://ilkoku.com/editorler/merve-kaya" "404" \
              && check_post_merge_public_route "https://ilkoku.com/editorler/baris-erdem" "404" \
              && check_post_merge_public_route "https://ilkoku.com/editorler/derya-unal" "404" \
              && check_post_merge_public_route "https://ilkoku.com/editorler/kaan-sahin" "404" \
              && check_post_merge_public_route "https://ilkoku.com/kitap/test0408-2959175c" "404" \
              && check_post_merge_body_contains "https://ilkoku.com/robots.txt" \
                "Disallow: /admin" \
                "Disallow: /icerik" \
                "Disallow: /sistem-yonetimi" \
                "Disallow: /api" \
                "Disallow: /auth" \
                "Sitemap: https://ilkoku.com/sitemap.xml" \
              && check_post_merge_protected_route "https://ilkoku.com/icerik/zamanlama" \
              && check_post_merge_protected_route "https://ilkoku.com/icerik/onizleme/ana-sayfa" \
              && check_post_merge_protected_route "https://ilkoku.com/icerik/yayin-kuyrugu" \
              && check_post_merge_protected_route "https://ilkoku.com/icerik/medya" \
              && check_post_merge_protected_route "https://ilkoku.com/icerik/seo" \
              && check_post_merge_protected_route "https://ilkoku.com/icerik/gecmis" \
              && check_post_merge_protected_route "https://ilkoku.com/icerik/saglik" \
              && check_post_merge_protected_route "https://ilkoku.com/icerik/sayfalar/yeni" \
              && check_protected_route "https://ilkoku.com/sistem-yonetimi/epostalar" \
              && check_protected_route "https://ilkoku.com/sistem-yonetimi/okuma-guvenligi" \
              && check_redirect_route "https://ilkoku.com/admin/epostalar" "/sistem-yonetimi/epostalar" \
              && check_redirect_route "https://ilkoku.com/admin/okuma-guvenligi" "/sistem-yonetimi/okuma-guvenligi" \
              && check_protected_route "https://ilkoku.com/yayinevi/kesfet/eserler" \
              && check_protected_route "https://ilkoku.com/yayinevi/favorilerim"; then
              echo "PASS: Production route'ları, 5 yasal sayfa, sitemap, robots ve Sprint 3 public içerik güvenliği doğrulandı."
              exit 0
            fi

            sleep 10
          done

          echo "FAIL: Production deployment 5 dakika içinde doğrulanamadı." >&2
          exit 1

name: Publisher hero postrelease CDN and LCP diagnostic (read only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/publisher-hero-network-diagnostic-20261119.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check exact live commit and hero image
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/publisher-hero-network
          curl --fail --silent --show-error --max-time 25 'https://ilkoku.com/api/build-info' > /tmp/publisher-hero-network/build.json
          node <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync('/tmp/publisher-hero-network/build.json','utf8'));
          if(b.commitSha!=='dd8f569816de9f46c5845e8184b50dbf05ccfb2f')throw Error('Live SHA differs: '+b.commitSha);
          console.log('LIVE_SHA',b.commitSha);
          NODE
          curl --fail --silent --show-error --max-time 25 'https://ilkoku.com/yayinevleri-icin' > /tmp/publisher-hero-network/page.html
          node <<'NODE'
          const fs=require('node:fs');
          const h=fs.readFileSync('/tmp/publisher-hero-network/page.html','utf8');
          const match=h.match(/<link[^>]+rel="preload"[^>]+for-publishers-w828-q60-v1\.webp[^>]*>/);
          if(!match)throw Error('Hero preload missing');
          const tag=match[0];
          if(!/fetchPriority="high"|fetchpriority="high"/i.test(tag) && !/fetchpriority="high"/i.test(h))throw Error('High fetch priority missing');
          console.log('STATIC_HERO_PRELOAD',tag.slice(0,500));
          NODE
          for path in giris kayit sifremi-unuttum; do
            http=$(curl -L -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://ilkoku.com/$path")
            echo "AUTH_ROUTE $path $http"
            [[ "$http" == "200" ]] || exit 1
          done
      - name: Measure direct HTTP image request repeatedly
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://ilkoku.com/trust-pages/for-publishers-w750-q60-v1.webp'
          echo 'run,code,remote_ip,dns_s,tcp_s,tls_s,ttfb_s,total_s,bytes,download_bytes' > /tmp/publisher-hero-network/http.csv
          for i in 1 2 3 4 5 6; do
            curl -L -sS --fail --connect-timeout 8 --max-time 30 -o /dev/null -D "/tmp/publisher-hero-network/headers-$i.txt"               -w "$i,%{http_code},%{remote_ip},%{time_namelookup},%{time_connect},%{time_appconnect},%{time_starttransfer},%{time_total},%{size_download},%{size_download}\n"               "$url" >> /tmp/publisher-hero-network/http.csv
            sleep 2
          done
          cat /tmp/publisher-hero-network/http.csv
          for f in /tmp/publisher-hero-network/headers-*.txt; do
            echo "--- $f"; grep -Ei '^(HTTP/|cache-control:|age:|cf-cache-status:|x-cache:|content-type:|content-length:|server:|vary:|etag:)' "$f" || true
          done
      - name: Three mobile Lighthouse runs and network timings
        shell: bash
        run: |
          set -Eeuo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          for i in 1 2 3; do
            npx --yes lighthouse@12.8.2 'https://ilkoku.com/yayinevleri-icin'               --only-categories=performance --form-factor=mobile --throttling-method=simulate               --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'               --output=json --output-path="/tmp/publisher-hero-network/lh-$i.json" --quiet
          done
          node <<'NODE'
          const fs=require('node:fs');
          const out=[];
          for(let i=1;i<=3;i++){
            const d=JSON.parse(fs.readFileSync('/tmp/publisher-hero-network/lh-'+i+'.json','utf8'));
            if(d.runtimeError||new URL(d.finalUrl).pathname!=='/yayinevleri-icin')throw Error('invalid Lighthouse run '+i);
            const a=d.audits,net=a['network-requests']?.details?.items||[];
            const hero=net.filter(x=>(x.url||'').includes('for-publishers-w')&&x.statusCode===200);
            if(hero.length!==1)throw Error('Hero response missing or repeated '+i);
            const h=hero[0];
            const phases=a['largest-contentful-paint-element']?.details?.items?.find(x=>x.type==='table'&&x.items?.some(y=>y.phase==='TTFB'))?.items||[];
            const item={run:i,lcp:Math.round(a['largest-contentful-paint'].numericValue),cls:a['cumulative-layout-shift'].numericValue,
              heroPriority:h.priority,heroTransferBytes:h.transferSize,
              requestStartMs:Math.round(h.networkRequestTime),responseEndMs:Math.round(h.networkEndTime),
              heroNetworkDurationMs:Math.round(h.networkEndTime-h.networkRequestTime),
              phases:Object.fromEntries(phases.map(x=>[x.phase,Math.round(x.timing)]))};
            out.push(item);console.log('POSTRELEASE_HERO_DIAGNOSTIC',JSON.stringify(item));
          }
          fs.writeFileSync('/tmp/publisher-hero-network/summary.json',JSON.stringify(out,null,2));
          NODE
      - name: Preserve raw network and Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: publisher-hero-network-diagnostic-20261119
          path: /tmp/publisher-hero-network/
          retention-days: 14
          if-no-files-found: warn

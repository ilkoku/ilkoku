name: Scoped secret presence check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify scoped job secrets exist
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CMS_SCHEDULER_SECRET: ${{ secrets.CMS_SCHEDULER_SECRET }}
      EMAIL_OPERATIONS_SECRET: ${{ secrets.EMAIL_OPERATIONS_SECRET }}
      WEEKLY_DISCOVERY_SUMMARY_SECRET: ${{ secrets.WEEKLY_DISCOVERY_SUMMARY_SECRET }}
    steps:
      - name: Check presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for name in             CMS_SCHEDULER_SECRET             EMAIL_OPERATIONS_SECRET             WEEKLY_DISCOVERY_SUMMARY_SECRET
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing scoped secret::${name} is not configured for GitHub Actions."
              missing=1
            else
              echo "${name}: configured"
            fi
          done

          exit "$missing"

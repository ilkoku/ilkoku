name: SEO indexability smoke

on:
  schedule:
    - cron: "15 6 * * 2"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Çalıştırmak için RUN-SEO-DIAGNOSTIC yazın"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-live-crawler
  cancel-in-progress: true

jobs:
  verify:
    name: Verify search-engine indexability
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Validate explicit confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "RUN-SEO-DIAGNOSTIC"

      - name: Run low-impact SEO diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail

          # Do not impersonate Googlebot. Real Googlebot must be identified from
          # verified Google crawler IP ranges in server logs.
          USER_AGENT="IlkOku-SEO-Indexability/1.0 (+https://ilkoku.com)"
          REQUEST_DELAY_SECONDS=5

          normalize_url() { local value="$1"; printf '%s' "${value%/}"; }
          pace() { sleep "$REQUEST_DELAY_SECONDS"; }

          circuit_break() {
            local code="$1"
            local url="$2"
            if [[ "$code" == "403" || "$code" == "429" ]]; then
              echo "CIRCUIT BREAKER: $url returned HTTP $code; diagnostic stopped immediately." >&2
              exit 1
            fi
          }

          check_page() {
            local path="$1"
            local expected_canonical="$2"
            local url="https://ilkoku.com${path}"
            local headers body code robots canonical raw_bytes gzip_bytes
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            echo "$url -> HTTP $code"
            raw_bytes="$(wc -c < "$body" | tr -d ' ')"
            gzip_bytes="$(gzip -c "$body" | wc -c | tr -d ' ')"
            echo "PAYLOAD path=$path raw_bytes=$raw_bytes gzip_bytes=$gzip_bytes"
            circuit_break "$code" "$url"
            [[ "$code" == "200" ]]
            robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            [[ "${robots,,}" != *"noindex"* ]]
            ! grep -Eqi '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' "$body"
            grep -Eqi '<title>[^<]+' "$body"
            canonical="$(grep -Eoi '<link[^>]+rel="canonical"[^>]+>' "$body" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p')"
            [[ "$(normalize_url "$canonical")" == "$(normalize_url "$expected_canonical")" ]]
            rm -f "$headers" "$body"
            pace
          }

          check_noindex_page() {
            local path="$1"
            local expected_canonical="$2"
            local url="https://ilkoku.com.github/workflows/seo-indexability-smoke.yml"
            local headers body code robots canonical
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            echo "$url -> HTTP $code (expected noindex, follow)"
            circuit_break "$code" "$url"
            [[ "$code" == "200" ]]
            robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            if [[ "${robots,,}" != *"noindex"* ]] && ! grep -Eqi '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' "$body"; then
              echo "FAIL: $url is expected to expose noindex during soft launch." >&2
              rm -f "$headers" "$body"
              exit 1
            fi
            grep -Eqi '<title>[^<]+' "$body"
            canonical="$(grep -Eoi '<link[^>]+rel="canonical"[^>]+>' "$body" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p')"
            [[ "$(normalize_url "$canonical")" == "$(normalize_url "$expected_canonical")" ]]
            rm -f "$headers" "$body"
            pace
          }

          fetch_contract_file() {
            local url="$1"
            local file="$2"
            local code
            code="$(curl --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" --output "$file" --write-out '%{http_code}' "$url" || true)"
            echo "$url -> HTTP $code"
            circuit_break "$code" "$url"
            [[ "$code" == "200" ]]
            pace
          }

          sitemap="$(mktemp)"
          robots="$(mktemp)"
          trap 'rm -f "$sitemap" "$robots"' EXIT

          fetch_contract_file "https://ilkoku.com/robots.txt" "$robots"
          grep -Fq 'Sitemap: https://ilkoku.com/sitemap.xml' "$robots"
          grep -Fq 'Allow: /' "$robots"
          grep -Fq 'Allow: /api/media/' "$robots"
          grep -Fq 'Allow: /api/site-assets/' "$robots"
          grep -Fq 'Allow: /api/site-content/footer-navigation' "$robots"
          grep -Fq 'Allow: /api/public-announcements' "$robots"
          grep -Fxq 'Disallow: /icerik$' "$robots"
          grep -Fxq 'Disallow: /icerik/' "$robots"
          grep -Fxq 'Disallow: /1q6z' "$robots"
          if grep -Fxq 'Disallow: /icerik' "$robots"; then
            echo "FAIL: broad /icerik robots prefix blocks public content policy" >&2
            exit 1
          fi

          for public_resource in \
            'https://ilkoku.com/api/site-content/footer-navigation' \
            'https://ilkoku.com/api/public-announcements'; do
            headers="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$public_resource" || true)"
            echo "$public_resource -> HTTP $code"
            circuit_break "$code" "$public_resource"
            [[ "$code" == "200" ]]
            grep -Eqi '^x-robots-tag:[[:space:]]*noindex' "$headers"
            rm -f "$headers"
            pace
          done

          fetch_contract_file "https://ilkoku.com/sitemap.xml" "$sitemap"
          for required in \
            'https://ilkoku.com/' \
            'https://ilkoku.com/hakkimizda' \
            'https://ilkoku.com/icerik-ve-yas-politikasi' \
            'https://ilkoku.com/topluluk-kurallari' \
            'https://ilkoku.com/telif-bildirimi' \
            'https://ilkoku.com/okurlar-icin' \
            'https://ilkoku.com/yazarlar-icin/kurgu' \
            'https://ilkoku.com/okurlar-icin/okumaya-baslama' \
            'https://ilkoku.com/editorler-icin/egitim/editorluge-baslama'; do
            grep -Fq "<loc>${required}</loc>" "$sitemap"
          done

          for excluded in \
            'https://ilkoku.com/nasil-calisir' \
            'https://ilkoku.com/yazarlar-icin' \
            'https://ilkoku.com/editorler-icin' \
            'https://ilkoku.com/yayinevleri-icin' \
            'https://ilkoku.com/editoryal-standartlar' \
            'https://ilkoku.com/yardim' \
            'https://ilkoku.com/iletisim' \
            'https://ilkoku.com/site-haritasi' \
            'https://ilkoku.com/yasal/kullanim-sartlari' \
            'https://ilkoku.com/yasal/gizlilik-politikasi' \
            'https://ilkoku.com/yasal/kvkk' \
            'https://ilkoku.com/yasal/cerez-politikasi' \
            'https://ilkoku.com/yasal/telif-hakki-politikasi' \
            'https://ilkoku.com/yeni-cikanlar'; do
            ! grep -Fq "<loc>${excluded}</loc>" "$sitemap"
          done
          ! grep -Fq '<loc>https://ilkoku.com/en-cok-satanlar' "$sitemap"
          ! grep -Fq '<loc>https://ilkoku.com/eserler</loc>' "$sitemap"

          check_page '/' 'https://ilkoku.com/'
          check_page '/icerik-ve-yas-politikasi' 'https://ilkoku.com/icerik-ve-yas-politikasi'
          check_page '/okurlar-icin' 'https://ilkoku.com/okurlar-icin'
          check_page '/yazarlar-icin/kurgu' 'https://ilkoku.com/yazarlar-icin/kurgu'
          check_page '/editorler-icin/egitim/editorluge-baslama' 'https://ilkoku.com/editorler-icin/egitim/editorluge-baslama'

          check_noindex_page '/nasil-calisir' 'https://ilkoku.com/nasil-calisir'
          check_noindex_page '/yazarlar-icin' 'https://ilkoku.com/yazarlar-icin'
          check_noindex_page '/editorler-icin' 'https://ilkoku.com/editorler-icin'
          check_noindex_page '/yayinevleri-icin' 'https://ilkoku.com/yayinevleri-icin'
          check_noindex_page '/editoryal-standartlar' 'https://ilkoku.com/editoryal-standartlar'
          check_noindex_page '/yardim' 'https://ilkoku.com/yardim'
          check_noindex_page '/iletisim' 'https://ilkoku.com/iletisim'
          check_noindex_page '/site-haritasi' 'https://ilkoku.com/site-haritasi'
          check_noindex_page '/yasal/kvkk' 'https://ilkoku.com/yasal/kvkk'
          check_noindex_page '/en-cok-satanlar' 'https://ilkoku.com/en-cok-satanlar'
          check_noindex_page '/yeni-cikanlar' 'https://ilkoku.com/yeni-cikanlar'

          echo "PASS: soft-launch index targets and crawlable noindex routes verified."

          echo "PASS: low-impact SEO indexability diagnostic completed."

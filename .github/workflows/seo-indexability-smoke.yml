name: SEO indexability smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: seo-indexability-main
  cancel-in-progress: true

jobs:
  verify:
    name: Verify search-engine indexability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for production and verify SEO contract
        shell: bash
        run: |
          set -Eeuo pipefail

          USER_AGENT="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          VERIFY_WINDOW_SECONDS=300

          check_indexable_page() {
            local path="$1"
            local canonical="$2"
            local url="https://ilkoku.com${path}"
            local headers body code robots

            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"

            echo "$url -> HTTP $code | X-Robots-Tag: ${robots:-YOK}"

            if [[ "$code" != "200" ]]; then
              rm -f "$headers" "$body"
              return 1
            fi
            if [[ "${robots,,}" == *"noindex"* ]]; then
              rm -f "$headers" "$body"
              return 1
            fi
            if grep -Eqi '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' "$body"; then
              rm -f "$headers" "$body"
              return 1
            fi
            grep -Eqi '<title>[^<]+' "$body" || { rm -f "$headers" "$body"; return 1; }
            grep -Eqi '<meta[^>]+name="description"[^>]+content="[^"]+' "$body" || { rm -f "$headers" "$body"; return 1; }
            grep -Eqi 'rel="canonical"' "$body" || { rm -f "$headers" "$body"; return 1; }
            grep -Fq "$canonical" "$body" || { rm -f "$headers" "$body"; return 1; }

            rm -f "$headers" "$body"
            return 0
          }

          verify_contract() {
            local sitemap robots key home
            sitemap="$(mktemp)"
            robots="$(mktemp)"
            key="$(mktemp)"
            home="$(mktemp)"

            cleanup() {
              rm -f "$sitemap" "$robots" "$key" "$home"
            }

            curl --fail --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" https://ilkoku.com/sitemap.xml --output "$sitemap" || { cleanup; return 1; }
            curl --fail --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" https://ilkoku.com/robots.txt --output "$robots" || { cleanup; return 1; }
            curl --fail --silent --show-error --location --max-time 25 https://ilkoku.com/f4c33493caf6550560462af5a424980e.txt --output "$key" || { cleanup; return 1; }

            grep -Fq 'Sitemap: https://ilkoku.com/sitemap.xml' "$robots" || { cleanup; return 1; }
            grep -Fq 'Allow: /' "$robots" || { cleanup; return 1; }
            if grep -Eq '^Disallow:[[:space:]]*/[[:space:]]*$' "$robots"; then
              cleanup
              return 1
            fi
            grep -Fxq 'f4c33493caf6550560462af5a424980e' "$key" || { cleanup; return 1; }

            local required=(
              'https://ilkoku.com/'
              'https://ilkoku.com/eserler'
              'https://ilkoku.com/eserler/yeni'
              'https://ilkoku.com/eserler/guncellenen'
              'https://ilkoku.com/yazarlar'
              'https://ilkoku.com/turler'
              'https://ilkoku.com/yardim'
              'https://ilkoku.com/editorler'
              'https://ilkoku.com/iletisim'
              'https://ilkoku.com/hakkimizda'
              'https://ilkoku.com/nasil-calisir'
              'https://ilkoku.com/editoryal-standartlar'
              'https://ilkoku.com/icerik-ve-yas-politikasi'
              'https://ilkoku.com/topluluk-kurallari'
              'https://ilkoku.com/telif-bildirimi'
              'https://ilkoku.com/yazarlar-icin'
              'https://ilkoku.com/editorler-icin'
              'https://ilkoku.com/yayinevleri-icin'
              'https://ilkoku.com/yasal/kullanim-sartlari'
              'https://ilkoku.com/yasal/gizlilik-politikasi'
              'https://ilkoku.com/yasal/kvkk'
              'https://ilkoku.com/yasal/cerez-politikasi'
              'https://ilkoku.com/yasal/telif-hakki-politikasi'
            )

            local required_url
            for required_url in "${required[@]}"; do
              grep -Fq "<loc>${required_url}</loc>" "$sitemap" || { cleanup; return 1; }
            done

            check_indexable_page '/' 'https://ilkoku.com/' || { cleanup; return 1; }
            check_indexable_page '/eserler' 'https://ilkoku.com/eserler' || { cleanup; return 1; }
            check_indexable_page '/yazarlar' 'https://ilkoku.com/yazarlar' || { cleanup; return 1; }
            check_indexable_page '/turler' 'https://ilkoku.com/turler' || { cleanup; return 1; }
            check_indexable_page '/nasil-calisir' 'https://ilkoku.com/nasil-calisir' || { cleanup; return 1; }
            check_indexable_page '/hakkimizda' 'https://ilkoku.com/hakkimizda' || { cleanup; return 1; }
            check_indexable_page '/yazarlar-icin' 'https://ilkoku.com/yazarlar-icin' || { cleanup; return 1; }
            check_indexable_page '/editorler-icin' 'https://ilkoku.com/editorler-icin' || { cleanup; return 1; }
            check_indexable_page '/yayinevleri-icin' 'https://ilkoku.com/yayinevleri-icin' || { cleanup; return 1; }

            curl --fail --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" https://ilkoku.com/ --output "$home" || { cleanup; return 1; }
            grep -Fq 'application/ld+json' "$home" || { cleanup; return 1; }
            grep -Fq '"@type":"WebSite"' "$home" || { cleanup; return 1; }
            grep -Fq '"@type":"Organization"' "$home" || { cleanup; return 1; }

            cleanup
            return 0
          }

          deadline=$((SECONDS + VERIFY_WINDOW_SECONDS))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            echo "SEO contract attempt ${attempt}"
            if verify_contract; then
              echo "PASS: public İlkOku indexability, canonical, metadata, sitemap, robots, WebSite/Organization structured data and IndexNow key verified."
              exit 0
            fi
            sleep 15
          done

          echo "FAIL: production SEO indexability contract did not pass within 5 minutes." >&2
          exit 1

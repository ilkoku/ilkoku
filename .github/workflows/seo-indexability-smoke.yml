name: SEO indexability smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: seo-indexability-main
  cancel-in-progress: true

jobs:
  verify:
    name: Verify search-engine indexability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for production and verify SEO contract
        shell: bash
        run: |
          set -Eeuo pipefail

          USER_AGENT="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          VERIFY_WINDOW_SECONDS=300

          normalize_url() {
            local value="$1"
            printf '%s' "${value%/}"
          }

          canonical_from_body() {
            local body="$1"
            local canonical_tag
            canonical_tag="$(grep -Eoi '<link[^>]+rel="canonical"[^>]+>' "$body" | head -1 || true)"
            printf '%s' "$canonical_tag" | sed -n 's/.*href="\([^"]*\)".*/\1/p'
          }

          check_indexable_page() {
            local path="$1"
            local expected_canonical="$2"
            local url="https://ilkoku.com${path}"
            local headers body code robots canonical_href

            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"

            echo "$url -> HTTP $code | X-Robots-Tag: ${robots:-YOK}"

            if [[ "$code" != "200" ]]; then
              echo "FAIL: $url returned HTTP $code"
              rm -f "$headers" "$body"
              return 1
            fi
            if [[ "${robots,,}" == *"noindex"* ]]; then
              echo "FAIL: $url returned X-Robots-Tag noindex"
              rm -f "$headers" "$body"
              return 1
            fi
            if grep -Eqi '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' "$body"; then
              echo "FAIL: $url contains meta robots noindex"
              rm -f "$headers" "$body"
              return 1
            fi

            grep -Eqi '<title>[^<]+' "$body" || { echo "FAIL: $url title missing"; rm -f "$headers" "$body"; return 1; }
            grep -Eqi '<meta[^>]+name="description"[^>]+content="[^"]+' "$body" || { echo "FAIL: $url description missing"; rm -f "$headers" "$body"; return 1; }

            canonical_href="$(canonical_from_body "$body")"
            if [[ -z "$canonical_href" ]]; then
              echo "FAIL: $url canonical missing"
              rm -f "$headers" "$body"
              return 1
            fi
            if [[ "$(normalize_url "$canonical_href")" != "$(normalize_url "$expected_canonical")" ]]; then
              echo "FAIL: $url canonical mismatch: expected=$expected_canonical actual=$canonical_href"
              rm -f "$headers" "$body"
              return 1
            fi

            echo "PASS: $url canonical=$canonical_href"
            rm -f "$headers" "$body"
            return 0
          }

          check_filtered_page() {
            local url="$1"
            local expected_canonical="$2"
            local body code canonical_href

            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" --output "$body" --write-out '%{http_code}' "$url" || true)"
            if [[ "$code" != "200" ]]; then
              echo "FAIL: filtered discovery URL returned HTTP $code: $url"
              rm -f "$body"
              return 1
            fi
            if ! grep -Eqi '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' "$body"; then
              echo "FAIL: filtered discovery URL missing noindex: $url"
              rm -f "$body"
              return 1
            fi

            canonical_href="$(canonical_from_body "$body")"
            if [[ "$(normalize_url "$canonical_href")" != "$(normalize_url "$expected_canonical")" ]]; then
              echo "FAIL: filtered discovery canonical mismatch: url=$url expected=$expected_canonical actual=${canonical_href:-YOK}"
              rm -f "$body"
              return 1
            fi

            echo "PASS: filtered discovery noindex + canonical: $url"
            rm -f "$body"
            return 0
          }

          verify_contract() {
            local sitemap robots key home eserler
            local sitemap_count duplicate_count
            sitemap="$(mktemp)"
            robots="$(mktemp)"
            key="$(mktemp)"
            home="$(mktemp)"
            eserler="$(mktemp)"

            cleanup() {
              rm -f "$sitemap" "$robots" "$key" "$home" "$eserler"
            }

            curl --fail --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" https://ilkoku.com/sitemap.xml --output "$sitemap" || { echo "FAIL: sitemap fetch"; cleanup; return 1; }
            curl --fail --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" https://ilkoku.com/robots.txt --output "$robots" || { echo "FAIL: robots fetch"; cleanup; return 1; }
            curl --fail --silent --show-error --location --max-time 25 https://ilkoku.com/f4c33493caf6550560462af5a424980e.txt --output "$key" || { echo "FAIL: IndexNow key fetch"; cleanup; return 1; }

            grep -Fq 'Sitemap: https://ilkoku.com/sitemap.xml' "$robots" || { echo "FAIL: robots sitemap declaration"; cleanup; return 1; }
            grep -Fq 'Allow: /' "$robots" || { echo "FAIL: robots public allow"; cleanup; return 1; }
            # Cloudflare may add Disallow: / for named AI crawlers. That is not a
            # Google Search block; real Googlebot eligibility is verified below.
            grep -Fxq 'f4c33493caf6550560462af5a424980e' "$key" || { echo "FAIL: IndexNow key mismatch"; cleanup; return 1; }

            sitemap_count="$(grep -o '<loc>' "$sitemap" | wc -l | tr -d ' ')"
            duplicate_count="$(grep -oE '<loc>[^<]+' "$sitemap" | sed 's#<loc>##' | sort | uniq -d | wc -l | tr -d ' ')"
            if [[ "$sitemap_count" -lt 23 ]]; then
              echo "FAIL: sitemap URL count=$sitemap_count expected at least 23"
              cleanup
              return 1
            fi
            if [[ "$duplicate_count" != "0" ]]; then
              echo "FAIL: sitemap has $duplicate_count duplicate URLs"
              cleanup
              return 1
            fi

            local required=(
              'https://ilkoku.com/'
              'https://ilkoku.com/eserler'
              'https://ilkoku.com/eserler/yeni'
              'https://ilkoku.com/eserler/guncellenen'
              'https://ilkoku.com/yazarlar'
              'https://ilkoku.com/turler'
              'https://ilkoku.com/yardim'
              'https://ilkoku.com/editorler'
              'https://ilkoku.com/iletisim'
              'https://ilkoku.com/hakkimizda'
              'https://ilkoku.com/nasil-calisir'
              'https://ilkoku.com/editoryal-standartlar'
              'https://ilkoku.com/icerik-ve-yas-politikasi'
              'https://ilkoku.com/topluluk-kurallari'
              'https://ilkoku.com/telif-bildirimi'
              'https://ilkoku.com/yazarlar-icin'
              'https://ilkoku.com/editorler-icin'
              'https://ilkoku.com/yayinevleri-icin'
              'https://ilkoku.com/yasal/kullanim-sartlari'
              'https://ilkoku.com/yasal/gizlilik-politikasi'
              'https://ilkoku.com/yasal/kvkk'
              'https://ilkoku.com/yasal/cerez-politikasi'
              'https://ilkoku.com/yasal/telif-hakki-politikasi'
            )

            local required_url
            for required_url in "${required[@]}"; do
              grep -Fq "<loc>${required_url}</loc>" "$sitemap" || { echo "FAIL: sitemap missing $required_url"; cleanup; return 1; }
            done

            check_indexable_page '/' 'https://ilkoku.com/' || { cleanup; return 1; }
            check_indexable_page '/eserler' 'https://ilkoku.com/eserler' || { cleanup; return 1; }
            check_indexable_page '/yazarlar' 'https://ilkoku.com/yazarlar' || { cleanup; return 1; }
            check_indexable_page '/turler' 'https://ilkoku.com/turler' || { cleanup; return 1; }
            check_indexable_page '/nasil-calisir' 'https://ilkoku.com/nasil-calisir' || { cleanup; return 1; }
            check_indexable_page '/hakkimizda' 'https://ilkoku.com/hakkimizda' || { cleanup; return 1; }
            check_indexable_page '/yazarlar-icin' 'https://ilkoku.com/yazarlar-icin' || { cleanup; return 1; }
            check_indexable_page '/editorler-icin' 'https://ilkoku.com/editorler-icin' || { cleanup; return 1; }
            check_indexable_page '/yayinevleri-icin' 'https://ilkoku.com/yayinevleri-icin' || { cleanup; return 1; }

            local www_headers www_code www_location
            www_headers="$(mktemp)"
            www_code="$(curl --silent --show-error --max-time 25 --dump-header "$www_headers" --output /dev/null --write-out '%{http_code}' https://www.ilkoku.com/ || true)"
            www_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$www_headers")"
            rm -f "$www_headers"
            if [[ "$www_code" != "301" && "$www_code" != "308" ]] || [[ "$(normalize_url "$www_location")" != "https://ilkoku.com" ]]; then
              echo "FAIL: www canonical redirect code=$www_code location=${www_location:-YOK}"
              cleanup
              return 1
            fi
            echo "PASS: www canonical redirect code=$www_code location=$www_location"

            check_filtered_page 'https://ilkoku.com/eserler?arama=test' 'https://ilkoku.com/eserler' || { cleanup; return 1; }
            check_filtered_page 'https://ilkoku.com/yazarlar?arama=test' 'https://ilkoku.com/yazarlar' || { cleanup; return 1; }
            check_filtered_page 'https://ilkoku.com/turler?arama=test' 'https://ilkoku.com/turler' || { cleanup; return 1; }

            curl --fail --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" https://ilkoku.com/eserler --output "$eserler" || { echo "FAIL: eserler social metadata fetch"; cleanup; return 1; }
            grep -Eqi '<meta[^>]+property="og:image"' "$eserler" || { echo "FAIL: eserler og:image missing"; cleanup; return 1; }
            grep -Eqi '<meta[^>]+name="twitter:image"' "$eserler" || { echo "FAIL: eserler twitter:image missing"; cleanup; return 1; }

            curl --fail --silent --show-error --location --max-time 25 --user-agent "$USER_AGENT" https://ilkoku.com/ --output "$home" || { echo "FAIL: homepage schema fetch"; cleanup; return 1; }
            grep -Fq 'application/ld+json' "$home" || { echo "FAIL: JSON-LD missing"; cleanup; return 1; }
            grep -Fq '"@type":"WebSite"' "$home" || { echo "FAIL: WebSite schema missing"; cleanup; return 1; }
            grep -Fq '"@type":"Organization"' "$home" || { echo "FAIL: Organization schema missing"; cleanup; return 1; }

            local discovery_path
            for discovery_path in '/eserler' '/yazarlar' '/turler' '/nasil-calisir'; do
              grep -Fq "href=\"${discovery_path}\"" "$home" || { echo "FAIL: homepage missing crawlable discovery link $discovery_path"; cleanup; return 1; }
            done
            echo "PASS: homepage exposes core crawlable discovery links"

            cleanup
            return 0
          }

          deadline=$((SECONDS + VERIFY_WINDOW_SECONDS))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            echo "SEO contract attempt ${attempt}"
            if verify_contract; then
              echo "PASS: public İlkOku indexability, canonical host, metadata, sitemap, robots, filtered discovery noindex/canonical, crawlable homepage discovery links, social images, structured data and IndexNow key verified."
              exit 0
            fi
            sleep 15
          done

          echo "FAIL: production SEO indexability contract did not pass within 5 minutes." >&2
          exit 1

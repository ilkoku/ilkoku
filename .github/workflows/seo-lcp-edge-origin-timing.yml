name: SEO LCP edge origin timing evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/seo-lcp-edge-origin-timing.yml

permissions:
  contents: read

concurrency:
  group: seo-lcp-edge-origin-timing
  cancel-in-progress: false

jobs:
  inspect:
    name: Observe homepage and hero TLS, first byte, cache headers
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Collect three paced paired requests
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '' > /tmp/ilkoku-lcp-timing.ndjson
          probe() {
            local kind="$1" seq="$2" url="$3" hdr status result
            hdr="$(mktemp)"
            result="$(curl --silent --show-error --location --compressed \
              --connect-timeout 8 --max-time 25 \
              --user-agent 'IlkOku-LCP-Attribution/1.0' \
              --dump-header "$hdr" --output /dev/null \
              --write-out '%{json}' "$url" || true)"
            if [[ -z "$result" ]]; then
              echo "::error::No curl data ($kind sample $seq)"; rm -f "$hdr"; exit 1
            fi
            KIND="$kind" SEQ="$seq" CURL_RESULT="$result" HEADERS_FILE="$hdr" node <<'NODE' | tee -a /tmp/ilkoku-lcp-timing.ndjson
          const fs = require('node:fs');
          const cur = JSON.parse(process.env.CURL_RESULT);
          const raw = fs.readFileSync(process.env.HEADERS_FILE, 'utf8');
          const last = raw.trim().split(/\r?\n\r?\n/).at(-1) || '';
          const headers = {};
          for (const line of last.split(/\r?\n/)) {
            const i = line.indexOf(':');
            if (i > 0) {
              const key = line.slice(0, i).toLowerCase();
              if (['cf-ray','cf-cache-status','x-nextjs-cache','cache-control','age','content-type','server','server-timing'].includes(key)) headers[key] = line.slice(i+1).trim();
            }
          }
          const ms = (n) => typeof n === 'number' ? Math.round(n * 1000) : null;
          const result = {
            kind:process.env.KIND, seq:Number(process.env.SEQ),
            status:cur.http_code, httpVersion:cur.http_version,
            curlError:cur.errormsg || null,
            dnsMs:ms(cur.time_namelookup), tcpMs:ms(cur.time_connect),
            tlsMs:ms(cur.time_appconnect), pretransferMs:ms(cur.time_pretransfer),
            firstByteMs:ms(cur.time_starttransfer), totalMs:ms(cur.time_total),
            postTlsWaitMs: typeof cur.time_starttransfer==='number' && typeof cur.time_pretransfer==='number' ? ms(cur.time_starttransfer-cur.time_pretransfer) : null,
            bytes:cur.size_download, headers
          };
          console.log(JSON.stringify(result));
          NODE
            rm -f "$hdr"
            status="$(RESULT="$result" node -p 'JSON.parse(process.env.RESULT).http_code')"
            if [[ "$status" == "403" || "$status" == "429" ]]; then
              echo "::error::WAF circuit breaker HTTP $status"; exit 1
            fi
            if [[ "$status" != "200" ]]; then
              echo "::error::Probe $kind $seq HTTP=$status; no retries"; exit 1
            fi
          }
          for i in 1 2 3; do
            probe document "$i" 'https://ilkoku.com/'
            sleep 3
            probe hero "$i" 'https://ilkoku.com/_next/image?url=%2Flanding%2Filkoku-hero-user-final.webp&w=750&q=60'
            if [[ "$i" != "3" ]]; then sleep 12; fi
          done

      - name: Summarize timing samples
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source='/tmp/ilkoku-lcp-timing.ndjson';
          if (!fs.existsSync(source)) process.exit(0);
          const rows=fs.readFileSync(source,'utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const med = (xs) => {
            const n=xs.filter(x=>typeof x==='number'&&Number.isFinite(x)).sort((a,b)=>a-b);
            return n.length ? n[Math.floor(n.length/2)] : 'n/a';
          };
          const metric = (k,t)=>med(rows.filter(x=>x.kind===t).map(x=>x[k]));
          const good=rows.filter(x=>x.status===200);
          const md=[
            '## İlkOku — three paired HTTP timing samples',
            '',
            'GitHub runner measurements; not CrUX. Post-TLS wait includes edge-to-origin/network/application and cannot isolate Node, DB or Cloudflare.',
            '',
            '| Request | # | HTTP | DNS ms | TCP ms | TLS ms | First byte ms | Total ms | Post-TLS wait ms | CF-cache | Next cache | CF Ray |',
            '|---|---:|---:|---:|---:|---:|---:|---:|---:|---|---|---|',
            ...rows.map(r=>'| '+[r.kind,r.seq,r.status,r.dnsMs,r.tcpMs,r.tlsMs,r.firstByteMs,r.totalMs,r.postTlsWaitMs,r.headers['cf-cache-status']||'n/a',r.headers['x-nextjs-cache']||'n/a',r.headers['cf-ray']||'n/a'].join(' | ')+' |'),
            '',
            'Healthy sample count: '+good.length+' / 6.',
            'Document median first byte: '+metric('firstByteMs','document')+' ms; post-TLS: '+metric('postTlsWaitMs','document')+' ms.',
            'Hero median first byte: '+metric('firstByteMs','hero')+' ms; post-TLS: '+metric('postTlsWaitMs','hero')+' ms.',
            '',
            'Observation only. No claim of SEO, LCP or production improvement.',
            ''
          ].join('\n');
          fs.writeFileSync('/tmp/ilkoku-lcp-timing-report.md',md);
          if(process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md);
          console.log(md);
          NODE


      - name: P1 audit Ahrefs slow-page cohort and legacy 404/503
        shell: bash
        run: |
          set -Eeuo pipefail
          output=/tmp/ilkoku-p1-http-cohort.tsv
          printf 'cohort\turl\texpected\tstatus\tttfb_s\ttotal_s\tbytes\tcf_cache\n' > "$output"
          fail=0
          while IFS='|' read -r cohort path expected; do
            [[ -n "$cohort" ]] || continue
            url="https://ilkoku.com$path"
            headers="$(mktemp)"
            metrics="$(curl --silent --show-error --location --compressed \
              --connect-timeout 8 --max-time 25 \
              --user-agent 'IlkOku-P1-Sample/1.0 (+https://ilkoku.com)' \
              --dump-header "$headers" --output /dev/null \
              --write-out '%{http_code}\t%{time_starttransfer}\t%{time_total}\t%{size_download}' \
              "$url" || true)"
            cache="$(grep -i '^cf-cache-status:' "$headers" | tail -1 | cut -d: -f2- | tr -d '\r ' || true)"
            rm -f "$headers"
            read -r code ttfb total bytes <<< "$(printf '%s' "$metrics" | tr '\t' ' ')"
            if [[ -z "$code" ]]; then code=000; fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$cohort" "$url" "$expected" "$code" "$ttfb" "$total" "$bytes" "$cache" | tee -a "$output"
            if [[ "$code" == "403" || "$code" == "429" ]]; then
              echo "::error::WAF circuit breaker HTTP $code; stopping all P1 probes."
              exit 1
            fi
            if [[ "$code" == 5* ]]; then
              echo "::error::HTTP $code from $url; do not amplify server errors."
              exit 1
            fi
            if [[ "$code" != "$expected" ]]; then
              echo "::error::P1 HTTP mismatch $url expected=$expected got=$code"
              fail=1
            fi
            sleep 5
          done <<'P1_COHORT'
          slow|/yazarlar-icin/bilgilendirici/psikoloji|200
          slow|/yazarlar-icin/edebiyat/soylesi|200
          slow|/yazarlar-icin/kurgu|200
          slow|/yazarlar-icin/senaryo-ve-sahne/radyo-tiyatrosu|200
          slow|/yazarlar-icin/akademik/bildiri|200
          slow|/yazarlar-icin/kurgu/dram|200
          slow|/yazarlar-icin/edebiyat/gezi-yazisi|200
          slow|/yazarlar-icin/akademik/arastirma|200
          slow|/en-cok-satanlar/uzun-suredir-cok-satanlar|200
          slow|/yazarlar-icin/akademik/akademik-inceleme|200
          slow|/yazarlar-icin/edebiyat/deneme|200
          slow|/yazarlar-icin/kurgu/oyku|200
          public|/turler/roman|200
          legacy-404|/turler/gizem|404
          legacy-404|/turler/genclik|404
          legacy-404|/turler/edeb-roman|404
          historical-503|/kitap/demo-kayip-harfler?from=%2Fyazarlar%2FIKO-U-2026-000014%3Ffrom%3D%2Fturler%2Fbilim-kurgu%3Ffrom%3D%252Fturler%252Fbilim-kurgu%253Ffrom%253D%25252Fturler%25252Fbilim-kurgu%25253Ffrom%25253D%2525252Feserler|200
          P1_COHORT
          exit "$fail"

      - name: P1 summarize present-day HTTP and TTFB
        if: always()
        shell: bash
        run: |
          node <<'P1_SUMMARY'
          const fs = require('node:fs');
          const path = '/tmp/ilkoku-p1-http-cohort.tsv';
          if (!fs.existsSync(path)) process.exit(0);
          const lines = fs.readFileSync(path,'utf8').trim().split('\n').slice(1).filter(Boolean);
          const rows = lines.map(line => {
            const [cohort,url,expected,status,ttfb,total,bytes,cache] = line.split('\t');
            return {cohort,url,expected,status,ttfbMs:Math.round(Number(ttfb)*1000),totalMs:Math.round(Number(total)*1000),bytes:Number(bytes),cache};
          });
          const slow = rows.filter(r => r.cohort === 'slow').map(r=>r.ttfbMs).sort((a,b)=>a-b);
          const percentile = (p)=>slow.length ? slow[Math.min(slow.length-1,Math.ceil(p*slow.length)-1)] : 'n/a';
          const md = [
            '## P1: live sampled speed and historical error cohort',
            '',
            'GitHub-hosted sample; NOT a complete 239/336 Ahrefs recrawl, Google indexing or CrUX. One request per URL. Runner location/cache changes TTFB.',
            '',
            '| Cohort | URL | Expected HTTP | HTTP | TTFB ms | Total ms | Cache |',
            '|---|---|---:|---:|---:|---:|---|',
            ...rows.map(r=>'| '+[r.cohort,r.url,r.expected,r.status,r.ttfbMs,r.totalMs,r.cache||'n/a'].join(' | ')+' |'),
            '',
            'Slow cohort samples: '+slow.length+'; median TTFB='+percentile(.5)+'ms; P90='+percentile(.9)+'ms; >1000ms='+slow.filter(n=>n>1000).length+'.',
            'HTTP mismatches: '+rows.filter(r=>r.expected!==r.status).length+'.',
            '',
          ].join('\n');
          fs.writeFileSync('/tmp/ilkoku-p1-http-cohort-report.md',md);
          if(process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md);
          console.log(md);
          P1_SUMMARY

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ilkoku-lcp-edge-origin-timing
          path: |
            /tmp/ilkoku-lcp-timing.ndjson
            /tmp/ilkoku-lcp-timing-report.md
            /tmp/ilkoku-p1-http-cohort.tsv
            /tmp/ilkoku-p1-http-cohort-report.md
          retention-days: 14
          if-no-files-found: warn
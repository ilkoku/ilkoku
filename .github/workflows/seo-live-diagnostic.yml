name: SEO live diagnostic

on:
  push:
    branches:
      - agent/seo-live-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture live SEO failures
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'

          echo '=== ROBOTS ==='
          curl -fsSL -A "$UA" https://ilkoku.com/robots.txt | sed -n '1,120p'

          echo '=== PARAMETER 500 DETAILS ==='
          for u in 'https://ilkoku.com/eserler?arama=test' 'https://ilkoku.com/yazarlar?arama=test' 'https://ilkoku.com/turler?arama=test'; do
            body=$(mktemp); head=$(mktemp)
            code=$(curl -sSL -A "$UA" -D "$head" -o "$body" -w '%{http_code}' "$u")
            echo "URL=$u HTTP=$code"
            echo '-- headers --'
            sed -n '1,80p' "$head"
            echo '-- body markers --'
            grep -Eo 'digest[^,<}]+' "$body" | head -5 || true
            grep -Eo '<title>[^<]+' "$body" | head -2 || true
            grep -Eo 'Internal Server Error|Application error|server-side exception|This page could not be found' "$body" | head -5 || true
            echo '-- body prefix --'
            head -c 1200 "$body" | tr '\n' ' '; echo
            rm -f "$body" "$head"
          done

          echo 'CAPTURE_DONE'

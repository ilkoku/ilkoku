name: Sprint 7 dependency override validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sprint7-deepmerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-override:
    name: Validate deepmerge-ts 8 override across full release gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: ilkoku_ci
          MARIADB_USER: ci_user
          MARIADB_PASSWORD: ci_password
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      recoverydb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: ilkoku_recovery
          MARIADB_USER: ci_user
          MARIADB_PASSWORD: ci_password
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: "mysql://ci_user:ci_password@127.0.0.1:3306/ilkoku_ci"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      SITE_URL: "http://localhost:3000"
      EMAIL_DELIVERY_MODE: "local"
      ADMIN_ROLE_VIEW_SECRET: "ci-admin-role-view-secret-0000000000000000000000000000000000000000"
      READING_ACCESS_HASH_SECRET: "ci-reading-access-hash-secret-00000000000000000000000000000000000000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Generate controlled deepmerge override lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          npm pkg set 'overrides.deepmerge-ts=8.0.1'
          npm install --package-lock-only --ignore-scripts

      - name: Replace temporary audit allowance with strict gate
        shell: bash
        run: |
          cat > scripts/audit-high-dependencies.mjs <<'EOF'
          import { spawnSync } from "node:child_process";

          const HIGH_SEVERITIES = new Set(["high", "critical"]);

          const result = spawnSync("npm", ["audit", "--json"], {
            encoding: "utf8",
            maxBuffer: 20 * 1024 * 1024,
          });

          if (result.error) {
            console.error("npm audit could not be executed:", result.error.message);
            process.exit(1);
          }

          let report;
          try {
            report = JSON.parse(result.stdout || "{}");
          } catch (error) {
            console.error("npm audit did not return valid JSON.");
            if (result.stderr) console.error(result.stderr.trim());
            process.exit(1);
          }

          const vulnerabilities = report.vulnerabilities ?? {};
          const blocked = [];

          for (const [packageName, vulnerability] of Object.entries(vulnerabilities)) {
            if (!HIGH_SEVERITIES.has(vulnerability?.severity)) continue;
            blocked.push({ packageName, severity: vulnerability?.severity ?? "unknown" });
          }

          if (blocked.length > 0) {
            console.error("High/critical dependency vulnerabilities detected:");
            for (const item of blocked) {
              console.error(`- ${item.packageName}: ${item.severity}`);
            }
            process.exit(1);
          }

          console.log("Dependency audit gate passed: no high/critical vulnerabilities.");
          EOF

      - name: Install generated dependency graph
        run: npm ci

      - name: Verify patched deepmerge resolution
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const entry = lock.packages?.['node_modules/deepmerge-ts'];
          if (!entry || entry.version !== '8.0.1') {
            console.error(`Expected deepmerge-ts 8.0.1, got ${entry?.version ?? 'missing'}`);
            process.exit(1);
          }
          console.log('PASS: deepmerge-ts resolved to 8.0.1');
          NODE

      - name: Prove final strict audit gate
        run: node scripts/audit-high-dependencies.mjs

      - name: Run lint
        run: npm run lint

      - name: Run security contract tests
        run: npm run test:security

      - name: Build disposable MariaDB schema
        run: npx prisma db push

      - name: Run MariaDB security integration contracts
        run: npm run test:security:db

      - name: Run release measurement report
        run: npm run release:measure:strict

      - name: Recover brand-new MariaDB from version-controlled baseline
        env:
          DATABASE_URL: "mysql://ci_user:ci_password@127.0.0.1:3307/ilkoku_recovery"
          RECOVERY_CONFIRM_EMPTY_DATABASE: "YES"
        run: npm run db:recover:fresh

      - name: Validate release measurement on recovered database
        env:
          DATABASE_URL: "mysql://ci_user:ci_password@127.0.0.1:3307/ilkoku_recovery"
        run: npm run release:measure:strict

      - name: Build application
        run: npm run build:ci

      - name: Prepare verified final commit object without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          head_sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"

          def request(method, path, payload):
              body = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  api + path,
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def create_blob(path):
              with open(path, "rb") as handle:
                  encoded = base64.b64encode(handle.read()).decode("ascii")
              return request("POST", f"/repos/{repo}/git/blobs", {
                  "content": encoded,
                  "encoding": "base64",
              })["sha"]

          base_tree = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()

          entries = []
          for path in ["package.json", "package-lock.json", "scripts/audit-high-dependencies.mjs"]:
              entries.append({
                  "path": path,
                  "mode": "100644",
                  "type": "blob",
                  "sha": create_blob(path),
              })

          entries.append({
              "path": ".github/workflows/sprint7-deepmerge-override-validation.yml",
              "mode": "100644",
              "type": "blob",
              "sha": None,
          })

          tree = request("POST", f"/repos/{repo}/git/trees", {
              "base_tree": base_tree,
              "tree": entries,
          })
          commit = request("POST", f"/repos/{repo}/git/commits", {
              "message": "Sprint 7.1: close deepmerge dependency advisory",
              "tree": tree["sha"],
              "parents": [head_sha],
          })

          with open("/tmp/sprint7-final-commit-sha.txt", "w", encoding="utf-8") as handle:
              handle.write(commit["sha"] + "\n")
          print("Prepared verified final commit object:", commit["sha"])
          PY

      - name: Upload final commit reference and generated files
        uses: actions/upload-artifact@v4
        with:
          name: sprint7-deepmerge-final
          path: |
            /tmp/sprint7-final-commit-sha.txt
            package.json
            package-lock.json
            scripts/audit-high-dependencies.mjs
          if-no-files-found: error
          retention-days: 1

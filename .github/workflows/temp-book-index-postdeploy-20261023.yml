name: TEMP Book Index post-deployment warm TTFB check
on:
  pull_request:
    paths:
      - ".github/workflows/temp-book-index-postdeploy-20261023.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Post-deploy six paced GET measurements
        run: |
          set -Eeuo pipefail
          echo '| Round | Route | HTTP | TTFB sec | Total sec |'
          echo '|---:|---|---:|---:|---:|'
          for round in 1 2 3; do
            for route in /en-cok-satanlar /en-cok-satanlar/turkiye; do
              result="$(curl --silent --show-error --compressed --connect-timeout 10 --max-time 35 \
                --user-agent 'IlkOku-ReadOnly-PostDeploy/20261023' \
                --output /dev/null --write-out '%{http_code}|%{time_starttransfer}|%{time_total}' \
                "https://ilkoku.com$route" || true)"
              IFS='|' read -r status ttfb total <<< "$result"
              echo "| $round | $route | ${status:-000} | ${ttfb:--} | ${total:--} |"
              if [[ "${status:-000}" == 403 || "${status:-000}" == 429 ]]; then
                echo "Circuit breaker: Cloudflare blocked diagnostic" >&2
                exit 1
              fi
              [[ "${status:-000}" == 200 ]]
              sleep 5
            done
          done
          echo 'PASS: read-only post-deploy recheck; no application settings changed.'

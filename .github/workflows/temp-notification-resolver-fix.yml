name: Temporary notification resolver fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temp-notification-resolver-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "mysql://ci_user:ci_password@127.0.0.1:3306/ilkoku_ci"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      SITE_URL: "http://localhost:3000"
      EMAIL_DELIVERY_MODE: "local"
      ADMIN_ROLE_VIEW_SECRET: "ci-admin-role-view-secret-0000000000000000000000000000000000000000"
      READING_ACCESS_HASH_SECRET: "ci-reading-access-hash-secret-00000000000000000000000000000000000000"

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic resolver type fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = r'''import "server-only";

          import { prisma } from "@/lib/prisma";

          export type NotificationTargetScope =
            | "default"
            | "editor"
            | "publisher";

          export type NotificationTargetInput = {
            id: string;
            relatedEntityId?: string | null;
            relatedEntityType?: string | null;
            type?: string | null;
          };

          const publicWorkWhere = {
            archivedAt: null,
            publishedAt: { not: null },
            status: "published" as const,
            visibility: "public" as const,
          };

          function uniqueEntityIds(
            notifications: NotificationTargetInput[],
            entityType: string,
          ) {
            const ids = new Set<string>();

            for (const notification of notifications) {
              if (
                notification.relatedEntityType === entityType &&
                notification.relatedEntityId
              ) {
                ids.add(notification.relatedEntityId);
              }
            }

            return Array.from(ids);
          }

          export async function resolveNotificationTargets(input: {
            notifications: NotificationTargetInput[];
            scope: NotificationTargetScope;
            userId: string;
          }) {
            const workIds = uniqueEntityIds(input.notifications, "work");
            const commentIds = uniqueEntityIds(input.notifications, "comment");
            const submissionIds = uniqueEntityIds(
              input.notifications,
              "publisher_submission",
            );
            const publisherEditorRequestIds = uniqueEntityIds(
              input.notifications,
              "publisher_editor_request",
            );

            const workSlugById = new Map<string, string>();
            if (workIds.length) {
              const works = await prisma.work.findMany({
                where: {
                  ...publicWorkWhere,
                  id: { in: workIds },
                },
                select: { id: true, slug: true },
              });

              for (const work of works) {
                workSlugById.set(work.id, work.slug);
              }
            }

            const commentHrefById = new Map<string, string>();
            if (commentIds.length) {
              const comments = await prisma.comment.findMany({
                where: {
                  deletedAt: null,
                  id: { in: commentIds },
                  parentId: null,
                  status: "visible",
                  chapter: {
                    is: {
                      archivedAt: null,
                      publishedAt: { not: null },
                      status: "published",
                    },
                  },
                  work: {
                    is: publicWorkWhere,
                  },
                },
                select: {
                  id: true,
                  chapter: {
                    select: { position: true },
                  },
                  work: {
                    select: { slug: true },
                  },
                },
              });

              for (const comment of comments) {
                if (!comment.chapter) continue;

                commentHrefById.set(
                  comment.id,
                  `/oku/${encodeURIComponent(comment.work.slug)}/bolum-${comment.chapter.position}#yorum-${comment.id}`,
                );
              }
            }

            const writerSubmissionIds = new Set<string>();
            if (input.scope === "default" && submissionIds.length) {
              const submissions = await prisma.publisherSubmission.findMany({
                where: {
                  archivedAt: null,
                  authorId: input.userId,
                  id: { in: submissionIds },
                },
                select: { id: true },
              });

              for (const submission of submissions) {
                writerSubmissionIds.add(submission.id);
              }
            }

            const publisherSubmissionIdSet = new Set<string>();
            const publisherEditorRequestIdSet = new Set<string>();

            if (
              input.scope === "publisher" &&
              (submissionIds.length || publisherEditorRequestIds.length)
            ) {
              const membership = await prisma.publisherMembership.findFirst({
                where: {
                  active: true,
                  userId: input.userId,
                  publisher: {
                    active: true,
                    archivedAt: null,
                  },
                },
                select: { publisherId: true },
              });

              if (membership) {
                if (submissionIds.length) {
                  const submissions = await prisma.publisherSubmission.findMany({
                    where: {
                      archivedAt: null,
                      id: { in: submissionIds },
                      publisherId: membership.publisherId,
                    },
                    select: { id: true },
                  });

                  for (const submission of submissions) {
                    publisherSubmissionIdSet.add(submission.id);
                  }
                }

                if (publisherEditorRequestIds.length) {
                  const editorRequests = await prisma.publisherEditorRequest.findMany({
                    where: {
                      id: { in: publisherEditorRequestIds },
                      publisherId: membership.publisherId,
                    },
                    select: { id: true },
                  });

                  for (const request of editorRequests) {
                    publisherEditorRequestIdSet.add(request.id);
                  }
                }
              }
            }

            const editorSecondAssignmentByWork = new Map<
              string,
              "active" | "completed"
            >();
            const editorRecommendationWorkIds = new Set<string>();

            if (input.scope === "editor" && workIds.length) {
              const assignments = await prisma.editorReviewAssignment.findMany({
                where: {
                  editorId: input.userId,
                  stage: "second",
                  workId: { in: workIds },
                },
                select: {
                  status: true,
                  workId: true,
                },
              });

              const recommendations = await prisma.editorRecommendation.findMany({
                where: {
                  recipientEditorId: input.userId,
                  workId: { in: workIds },
                },
                select: { workId: true },
              });

              for (const assignment of assignments) {
                const assignmentStatus = String(assignment.status);

                if (assignmentStatus === "completed") {
                  editorSecondAssignmentByWork.set(
                    assignment.workId,
                    "completed",
                  );
                } else if (
                  assignmentStatus === "assigned" ||
                  assignmentStatus === "in_progress"
                ) {
                  editorSecondAssignmentByWork.set(
                    assignment.workId,
                    "active",
                  );
                }
              }

              for (const recommendation of recommendations) {
                editorRecommendationWorkIds.add(recommendation.workId);
              }
            }

            const targets = new Map<string, string>();

            for (const notification of input.notifications) {
              const entityId = notification.relatedEntityId ?? null;
              const entityType = notification.relatedEntityType ?? null;
              let href: string | null = null;

              if (entityType === "comment" && entityId) {
                href = commentHrefById.get(entityId) ?? null;
              } else if (entityType === "work" && entityId) {
                if (input.scope === "editor") {
                  const assignmentState =
                    editorSecondAssignmentByWork.get(entityId);

                  if (assignmentState === "active") {
                    href = "/editor/incelemeler?asama=ikinci";
                  } else if (assignmentState === "completed") {
                    href = "/editor/incelemeler?durum=tamamlanan";
                  } else if (editorRecommendationWorkIds.has(entityId)) {
                    href = "/editor/onerilenler";
                  }
                }

                if (!href) {
                  const slug = workSlugById.get(entityId);
                  href = slug
                    ? `/kitap/${encodeURIComponent(slug)}`
                    : null;
                }
              } else if (
                entityType === "publisher_submission" &&
                entityId
              ) {
                if (
                  input.scope === "publisher" &&
                  publisherSubmissionIdSet.has(entityId)
                ) {
                  href = `/yayinevi/basvurular/${encodeURIComponent(entityId)}`;
                } else if (
                  input.scope === "default" &&
                  writerSubmissionIds.has(entityId)
                ) {
                  href = `/yayinevleri?basvuru=${encodeURIComponent(entityId)}`;
                }
              } else if (
                entityType === "publisher_editor_request" &&
                entityId &&
                input.scope === "publisher" &&
                publisherEditorRequestIdSet.has(entityId)
              ) {
                href = "/yayinevi/editor-talepleri";
              } else if (
                entityType === "publisher_permission_request" &&
                input.scope === "publisher"
              ) {
                href = "/yayinevi/yetkilerim";
              }

              if (
                !href &&
                input.scope === "publisher" &&
                notification.type === "publisher_discovery_share"
              ) {
                href = "/yayinevi/paylasilanlar";
              }

              if (href) {
                targets.set(notification.id, href);
              }
            }

            return targets;
          }
          '''

          editor_page = r'''import Link from "next/link";
          import type { Metadata } from "next";
          import { AppShell } from "@/components/layout/AppShell";
          import { markNotificationReadAction } from "@/features/editor-workspace/actions";
          import { requireEditorProfile } from "@/features/editor-workspace/access";
          import { EditorPageHeader } from "@/features/editor-workspace/components/EditorPageHeader";
          import { resolveNotificationTargets } from "@/features/notifications/targets";
          import { prisma } from "@/lib/prisma";

          export const metadata: Metadata = {
            title: "Editör Bildirimleri | İlkOku",
          };
          export const dynamic = "force-dynamic";

          function formatDate(value: Date) {
            return new Intl.DateTimeFormat("tr-TR", {
              dateStyle: "medium",
              timeStyle: "short",
            }).format(value);
          }

          export default async function EditorNotificationsPage() {
            const profile = await requireEditorProfile("/editor/bildirimler");
            const notifications = await prisma.notification.findMany({
              where: { userId: profile.id },
              orderBy: { createdAt: "desc" },
              take: 100,
            });
            const targets = await resolveNotificationTargets({
              notifications,
              scope: "editor",
              userId: profile.id,
            });

            return (
              <AppShell profile={profile}>
                <div className="editor-workspace">
                  <EditorPageHeader
                    description="İnceleme ve editör önerilerinizle ilgili güncellemeler."
                    title="Bildirimler"
                  />
                  <div className="editor-notification-list">
                    {notifications.map((notification) => {
                      const href = targets.get(notification.id) ?? null;

                      return (
                        <article data-read={Boolean(notification.readAt)} key={notification.id}>
                          <div>
                            <strong>{notification.title}</strong>
                            <p>{notification.message}</p>
                            <time dateTime={notification.createdAt.toISOString()}>
                              {formatDate(notification.createdAt)}
                            </time>
                            {href ? (
                              <Link className="button button--ghost" href={href}>
                                İlgili kaydı aç
                              </Link>
                            ) : null}
                          </div>
                          {!notification.readAt && (
                            <form action={markNotificationReadAction}>
                              <input name="notificationId" type="hidden" value={notification.id} />
                              <input name="returnPath" type="hidden" value="/editor/bildirimler" />
                              <button className="button button--ghost" type="submit">
                                Okundu İşaretle
                              </button>
                            </form>
                          )}
                        </article>
                      );
                    })}
                  </div>
                  {notifications.length === 0 && (
                    <div className="editor-empty">
                      <h2>Bildirim yok</h2>
                      <p>Yeni gelişmeler burada gösterilecek.</p>
                    </div>
                  )}
                </div>
              </AppShell>
            );
          }
          '''

          dollar = "$"
          final_ci = f'''name: CI

          on:
            workflow_dispatch:
            push:
              branches:
                - main
                - test-branch-chatgpt-2
                - deploy/2026-08-04-production
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          concurrency:
            group: ci-{dollar}{{{{ github.workflow }}}}-{dollar}{{{{ github.ref }}}}
            cancel-in-progress: true

          jobs:
            quality:
              name: Lint, security contracts and build
              runs-on: ubuntu-latest
              timeout-minutes: 15
              env:
                DATABASE_URL: "mysql://ci_user:ci_password@127.0.0.1:3306/ilkoku_ci"
                NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
                SITE_URL: "http://localhost:3000"
                EMAIL_DELIVERY_MODE: "local"
                ADMIN_ROLE_VIEW_SECRET: "ci-admin-role-view-secret-0000000000000000000000000000000000000000"
                READING_ACCESS_HASH_SECRET: "ci-reading-access-hash-secret-00000000000000000000000000000000000000"

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v6

                - name: Set up Node.js
                  uses: actions/setup-node@v6
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Audit high-severity dependencies
                  run: npm audit --audit-level=high

                - name: Run lint
                  run: npm run lint

                - name: Run security contract tests
                  run: npm run test:security

                - name: Build application
                  run: npm run build:ci
          '''

          Path("src/features/notifications/targets.ts").write_text(targets.strip() + "\n")
          Path("src/app/editor/bildirimler/page.tsx").write_text(editor_page.strip() + "\n")
          Path(".github/workflows/ci.yml").write_text(final_ci.replace("          ", "").lstrip())
          PY

      - name: Validate proposed fix
        run: |
          npm run lint
          npm run test:security
          npm run build:ci

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-notification-resolver-fix.yml
          git config user.name "ilkoku"
          git config user.email "ilkoku@ilkoku.com"
          git add src/features/notifications/targets.ts src/app/editor/bildirimler/page.tsx .github/workflows/ci.yml .github/workflows/temp-notification-resolver-fix.yml
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git commit -m "Fix notification resolver production types and remove diagnostics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

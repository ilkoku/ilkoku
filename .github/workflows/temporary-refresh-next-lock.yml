name: Temporary refresh Next lock

on:
  push:
    branches:
      - fix/book-index-insight-ranking-metadata-20260930

permissions:
  contents: write

jobs:
  refresh-next-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/book-index-insight-ranking-metadata-20260930
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Refresh Next.js lockfile
        run: npm install --package-lock-only --save-exact next@16.3.7 eslint-config-next@16.3.7

      - name: Verify high-severity audit
        run: node scripts/audit-high-dependencies.mjs

      - name: Commit refreshed manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "Patch Next.js security release"
            git push origin HEAD:fix/book-index-insight-ranking-metadata-20260930
          fi

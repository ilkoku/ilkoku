name: Temporary Amazon TR access probe

on:
  push:
    branches:
      - probe/amazon-tr-access

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Amazon TR bestseller structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, json, re, urllib.error, urllib.request

          urls=[
            ("gp","https://www.amazon.com.tr/gp/bestsellers/books"),
            ("zgbs","https://www.amazon.com.tr/Best-Sellers-Kitap/zgbs/books"),
          ]
          headers={
            "User-Agent":"IlkOkuBookIndex/0.1 (+https://ilkoku.com)",
            "Accept":"text/html,application/xhtml+xml",
            "Accept-Language":"tr-TR,tr;q=0.9,en;q=0.5",
          }

          for key,url in urls:
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=35) as resp:
                body=html.unescape(resp.read().decode("utf-8","replace"))
                cards=list(re.finditer(r'<div\b(?=[^>]*\bid=["\']p13n-asin-index-(\d+)["\'])[^>]*>',body,re.I))
                ranks=[int(x) for x in re.findall(r'class=["\'][^"\']*zg-bdg-text[^"\']*["\'][^>]*>\s*#(\d+)\s*<',body,re.I)]
                asins=re.findall(r'\bdata-asin=["\']([A-Z0-9]{10})["\']',body,re.I)
                print("META="+json.dumps({
                  "key":key,
                  "status":resp.status,
                  "finalUrl":resp.geturl(),
                  "bytes":len(body.encode("utf-8")),
                  "cards":len(cards),
                  "cardIndexes":[int(m.group(1)) for m in cards[:40]],
                  "rankCount":len(ranks),
                  "ranks":ranks[:40],
                  "asinCount":len(set(asins)),
                  "challenge":bool(re.search(r"automated access|captcha|robot check|enter the characters",body,re.I)),
                },ensure_ascii=False))
                snippets=[]
                for i,m in enumerate(cards[:3]):
                  end=cards[i+1].start() if i+1<len(cards) else min(len(body),m.start()+9000)
                  card=body[m.start():end]
                  asin=re.search(r'\bdata-asin=["\']([A-Z0-9]{10})["\']',card,re.I)
                  rank=re.search(r'class=["\'][^"\']*zg-bdg-text[^"\']*["\'][^>]*>\s*#(\d+)\s*<',card,re.I)
                  img=re.search(r'<img\b[^>]*class=["\'][^"\']*p13n-product-image[^"\']*["\'][^>]*>',card,re.I)
                  alt=re.search(r'\balt=["\']([^"\']+)["\']',img.group(0),re.I) if img else None
                  snippets.append({"asin":asin.group(1) if asin else None,"rank":rank.group(1) if rank else None,"title":alt.group(1) if alt else None})
                print("SAMPLE="+json.dumps({"key":key,"rows":snippets},ensure_ascii=False))
            except urllib.error.HTTPError as e:
              body=e.read().decode("utf-8","replace")
              print("META="+json.dumps({"key":key,"status":e.code,"finalUrl":e.geturl(),"bytes":len(body.encode("utf-8"))},ensure_ascii=False))
              print("ERROR_PREFIX="+repr(body[:1200]))
          PY

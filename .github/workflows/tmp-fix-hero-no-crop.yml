name: Apply no-crop hero layout fix

on:
  push:
    branches:
      - agent/fix-hero-no-crop

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-hero-no-crop
          fetch-depth: 0
      - name: Preserve full hero artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/landing-v2.css')
          s = p.read_text()
          old = '''.landing-page .landing-hero-product {
            background-color: #11102f;
            background-image: url("/landing/ilkoku-hero-user-final.webp");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
          }

          .landing-page .landing-hero-product > img {
            opacity: 0;
          }'''
          new = '''.landing-page .landing-hero-product {
            align-self: center;
            width: 100%;
            min-height: 0;
            aspect-ratio: 3 / 2;
            background-color: #11102f;
            background-image: url("/landing/ilkoku-hero-user-final.webp");
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
          }

          .landing-page .landing-hero-product > img {
            opacity: 0;
          }

          .landing-page .landing-hero-product__veil {
            background: none;
          }'''
          if old not in s:
              raise SystemExit('expected hero CSS block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/tmp-fix-hero-no-crop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/landing-v2.css
          git commit -m 'Preserve full homepage hero artwork'
          git push origin HEAD:agent/fix-hero-no-crop

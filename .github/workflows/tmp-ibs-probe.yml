name: Temporary IBS bestseller probe

on:
  push:
    branches:
      - probe/ibs-global
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect IBS ranked product containers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,json,re,urllib.request

          urls=[
            ("p1","https://www.ibs.it/classifica/libri/1day/SOLD?page=1",["9791259856265","9788828869269"]),
            ("p2","https://www.ibs.it/classifica/libri/1day/SOLD?page=2",["9788858037218","9781409592402"]),
            ("p3","https://www.ibs.it/classifica/libri/1day/SOLD?page=3",["9788806274252","9788818036305"]),
          ]
          for key,url,isbns in urls:
            req=urllib.request.Request(url,headers={
              "User-Agent":"IlkOkuBookIndex/0.1 (+https://ilkoku.com)",
              "Accept":"text/html,application/xhtml+xml",
              "Accept-Language":"it-IT,it;q=0.9,en;q=0.6",
            })
            with urllib.request.urlopen(req,timeout=40) as resp:
              body=html.unescape(resp.read().decode("utf-8","replace"))
            print("META="+json.dumps({"key":key,"bytes":len(body.encode("utf-8"))}))

            for isbn in isbns:
              positions=[m.start() for m in re.finditer(isbn,body)]
              print("ISBN_OCCURRENCES="+json.dumps({"key":key,"isbn":isbn,"count":len(positions)}))
              for n,pos in enumerate(positions[:4]):
                ctx=re.sub(r"\s+"," ",body[max(0,pos-5000):min(len(body),pos+6500)]).strip()
                print("CTX="+json.dumps({"key":key,"isbn":isbn,"n":n,"text":ctx[:11000]},ensure_ascii=False))

            # Explicit positions/rank field snippets anywhere.
            tokens=[]
            for pat in [
              r'(?i)data-[\w-]*(?:rank|position)[\w-]*=["\'][^"\']+["\']',
              r'(?i)(?:ranking|rank|position|posizione)[^<>{}]{0,120}[=:]["\']?[0-9]+',
              r'(?i)"(?:rank|position|posizione)"\s*:\s*[0-9]+',
            ]:
              for m in re.finditer(pat,body):
                val=re.sub(r"\s+"," ",m.group(0)).strip()
                if val not in tokens: tokens.append(val)
                if len(tokens)>=150: break
              if len(tokens)>=150: break
            print("RANK_TOKENS="+json.dumps({"key":key,"tokens":tokens},ensure_ascii=False))
          PY

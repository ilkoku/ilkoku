name: Temporary IBS bestseller probe

on:
  push:
    branches:
      - probe/ibs-global
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe IBS daily bestseller pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,json,re,urllib.parse,urllib.request

          base="https://www.ibs.it/classifica/libri/1day/SOLD"
          for page in (1,2,3):
            url=base+"?"+urllib.parse.urlencode({"page":page})
            req=urllib.request.Request(url,headers={
              "User-Agent":"IlkOkuBookIndex/0.1 (+https://ilkoku.com)",
              "Accept":"text/html,application/xhtml+xml",
              "Accept-Language":"it-IT,it;q=0.9,en;q=0.6",
            })
            with urllib.request.urlopen(req,timeout=40) as resp:
              body=html.unescape(resp.read().decode("utf-8","replace"))
              print("META="+json.dumps({"page":page,"status":resp.status,"bytes":len(body.encode("utf-8")),"finalUrl":resp.geturl()}))

            plain=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",body)).strip()
            print("SEMANTICS="+json.dumps({
              "page":page,
              "daily":bool(re.search(r"Classifica Libri del giorno",plain,re.I)),
              "sold":bool(re.search(r"I Più Venduti",plain,re.I)),
            }))

            # Surface likely product containers / rank metadata
            attrs=[]
            for m in re.finditer(r'(?i)(?:class|id|data-[\w-]+)=["\'][^"\']*(?:rank|product|item|card|position|classifica)[^"\']*["\']',body):
              v=re.sub(r"\s+"," ",m.group(0)).strip()
              if v not in attrs: attrs.append(v)
              if len(attrs)>=100: break
            print("ATTRS="+json.dumps({"page":page,"attrs":attrs},ensure_ascii=False))

            # Product ISBN URL format is often /.../e/978...
            products=[]
            seen=set()
            for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',body,re.I|re.S):
              href=urllib.parse.urljoin(url,m.group(1))
              if href in seen: continue
              isbnm=re.search(r'(?:/e/|[-/])((?:978|979)[0-9]{10})(?:[/?#]|$)',href)
              if not isbnm: continue
              label=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",html.unescape(m.group(2)))).strip()
              if not label: continue
              block=body[max(0,m.start()-5000):min(len(body),m.end()+7000)]
              ranks=[]
              for pat in [
                r'(?i)(?:rank|position|posizione)[^0-9]{0,120}([1-9][0-9]{0,3})',
                r'<(?:span|div|p)[^>]*>\s*([1-9][0-9]{0,3})\s*(?:°|º)\s*</(?:span|div|p)>',
                r'>\s*([1-9][0-9]{0,3})\s*(?:°|º)\s*<',
              ]:
                ranks += re.findall(pat,block,re.I|re.S)
              products.append({
                "href":href,
                "isbn13":isbnm.group(1),
                "label":label[:220],
                "rankCandidates":ranks[:12],
              })
              seen.add(href)
              if len(products)>=120: break
            print("PRODUCT_COUNT="+json.dumps({"page":page,"count":len(products)}))
            print("PRODUCTS="+json.dumps({"page":page,"rows":products[:60]},ensure_ascii=False))

            # Exact snippets around first several ordinal markers.
            snippets=[]
            for m in re.finditer(r'(?is).{0,700}>\s*([1-9][0-9]{0,3})\s*(?:°|º)\s*<.{0,2200}',body):
              s=re.sub(r"\s+"," ",m.group(0)).strip()
              snippets.append({"rank":m.group(1),"text":s[:2900]})
              if len(snippets)>=12: break
            print("RANK_SNIPPETS="+json.dumps({"page":page,"snippets":snippets},ensure_ascii=False))
          PY

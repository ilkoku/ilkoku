name: Temporary IBS bestseller probe

on:
  push:
    branches:
      - probe/ibs-global
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Diagnose IBS Top 100 identity anomalies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,json,re,urllib.parse,urllib.request,collections

          rows=[]
          raw_by_rank={}
          for page in (1,2,3):
            url=f"https://www.ibs.it/classifica/libri/1day/SOLD?page={page}"
            req=urllib.request.Request(url,headers={
              "User-Agent":"IlkOkuBookIndex/0.1 (+https://ilkoku.com)",
              "Accept":"text/html,application/xhtml+xml",
              "Accept-Language":"it-IT,it;q=0.9,en;q=0.6",
            })
            with urllib.request.urlopen(req,timeout=40) as resp:
              body=html.unescape(resp.read().decode("utf-8","replace"))

            starts=[*re.finditer(r'<[^>]+\bdata-item-position=["\']([0-9]{1,3})["\'][^>]*>',body,re.I)]
            seen=set()
            for i,m in enumerate(starts):
              rank=int(m.group(1))
              if rank in seen or not ((page-1)*40+1 <= rank <= min(page*40,100)):
                continue
              next_m=next((x for x in starts[i+1:] if int(x.group(1))!=rank),None)
              end=next_m.start() if next_m else min(len(body),m.start()+35000)
              block=body[max(0,m.start()-3500):end]
              raw_by_rank[rank]=block

              links=[*re.finditer(r'<a\b[^>]*href=["\']([^"\']+/e/((?:978|979)[0-9]{10})(?:[^"\']*)?)["\'][^>]*>(.*?)</a>',block,re.I|re.S)]
              best=None
              for a in links:
                tag=a.group(0)
                cls=(re.search(r'\bclass=["\']([^"\']+)["\']',tag,re.I) or [None,""])[1]
                label=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",html.unescape(a.group(3)))).strip()
                if label and ("title" in cls.lower() or "product" in cls.lower()):
                  best=(a,label,cls); break
              if not best and links:
                a=links[0]
                label=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",html.unescape(a.group(3)))).strip()
                best=(a,label,"")
              if not best:
                rows.append({"rank":rank,"isbn":None,"title":None,"author":None,"href":None})
                seen.add(rank); continue
              a,title,cls=best
              href=urllib.parse.urljoin(url,a.group(1))
              isbn=a.group(2)
              visible=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",block)).strip()

              author=None
              tm=re.escape(title)
              mm=re.search(tm+r"\s+di\s+(.+?)(?=\s+Recensioni:)",visible,re.I)
              if mm: author=mm.group(1).strip()

              rows.append({"rank":rank,"isbn":isbn,"title":title or None,"author":author,"href":href})
              seen.add(rank)

          rows.sort(key=lambda x:x["rank"])
          by_isbn=collections.defaultdict(list)
          for r in rows:
            if r["isbn"]: by_isbn[r["isbn"]].append(r["rank"])
          duplicates={k:v for k,v in by_isbn.items() if len(v)>1}
          anomalies=[r for r in rows if not r["title"] or not r["author"] or (r["isbn"] in duplicates if r["isbn"] else True)]
          print("DUPLICATES="+json.dumps(duplicates,ensure_ascii=False))
          print("ANOMALIES="+json.dumps(anomalies,ensure_ascii=False))
          for r in anomalies:
            block=raw_by_rank.get(r["rank"],"")
            print("ANOMALY_CTX="+json.dumps({
              "rank":r["rank"],
              "text":re.sub(r"\s+"," ",block).strip()[:9000]
            },ensure_ascii=False))
          PY

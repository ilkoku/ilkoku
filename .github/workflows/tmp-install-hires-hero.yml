name: Install high-resolution homepage hero

on:
  push:
    branches:
      - agent/fix-hero-hires-final
    paths:
      - ".github/workflows/tmp-install-hires-hero.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-hero-hires-final
          fetch-depth: 0

      - name: Install original-resolution hero
        shell: bash
        run: |
          set -euo pipefail
          cat .hero-parts/part-1 .hero-parts/part-2 > /tmp/hero.b64
          base64 --decode /tmp/hero.b64 > public/landing/ilkoku-hero-user-final.webp
          actual="$(git hash-object public/landing/ilkoku-hero-user-final.webp)"
          echo "decoded hero hash=$actual"
          test "$actual" = "ac165d1d78e6eb84a2a65b7e72bf228dc15f1ae0"
          rm -rf .hero-parts .github/workflows/tmp-install-hires-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install high-resolution homepage hero"
          git push origin HEAD:agent/fix-hero-hires-final

name: remove-home-hero-cards
on:
  push:
    branches: ["agent/remove-home-hero-cards"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-home-hero-cards
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/app/page.tsx")
          s = p.read_text()
          start = s.index('            <div className="landing-product-card landing-product-card--passport">')
          pub = s.index('            <div className="landing-product-card landing-product-card--publisher">', start)
          end = s.index('            </div>\n', pub) + len('            </div>\n')
          s = s[:start] + s[end:]
          if 'landing-product-card landing-product-card--' in s:
              raise SystemExit("hero cards remain")
          p.write_text(s)
          PY
          rm .github/workflows/tmp-remove-home-hero-cards.yml
          git config user.name ilkoku
          git config user.email ilkoku@ilkoku.com
          git add src/app/page.tsx .github/workflows/tmp-remove-home-hero-cards.yml
          git diff --cached --check
          git commit -m "Remove homepage hero overlay cards"
          git push origin HEAD:agent/remove-home-hero-cards

name: Apply SEO deep fixes

on:
  push:
    branches:
      - agent/seo-deep-fixes
    paths:
      - .github/workflows/tmp-seo-deep-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-deep-fixes
          fetch-depth: 0
      - name: Apply patch and clean temporary files
        shell: bash
        run: |
          set -Eeuo pipefail
          python .tmp/apply_seo_fixes.py
          rm -f .tmp/apply_seo_fixes.py .github/workflows/tmp-seo-deep-fixes.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix canonical host and public SEO search paths"
          git push origin HEAD:agent/seo-deep-fixes
          echo "Application SEO patch pushed"

name: Temporary SEO Yandex build

on:
  push:
    branches:
      - agent/seo-live-sitemap-count

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ci

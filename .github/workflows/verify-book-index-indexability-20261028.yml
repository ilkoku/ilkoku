name: Verify Book Index search publication (read only)
on:
  push:
    branches:
      - seo/verify-book-index-indexability-20261028
    paths:
      - .github/workflows/verify-book-index-indexability-20261028.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect live HTTP 200, robots, canonical and sitemap for all eight pages
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          import time
          from html.parser import HTMLParser
          from pathlib import Path

          urls = [
            "/yeni-cikanlar",
            "/en-cok-satanlar",
            "/en-cok-satanlar/turkiye",
            "/en-cok-satanlar/dunya",
            "/en-cok-satanlar/cok-satanlara-yeni-girenler",
            "/en-cok-satanlar/cok-satanlarda-yukselenler",
            "/en-cok-satanlar/birden-fazla-listede-cok-satanlar",
            "/en-cok-satanlar/uzun-suredir-cok-satanlar",
          ]
          class MetaReader(HTMLParser):
            def __init__(self):
              super().__init__()
              self.robots=[]
              self.canonical=None
            def handle_starttag(self, tag, attrs):
              fields=dict(attrs)
              if tag=="meta" and fields.get("name","").lower() in ("robots","googlebot"):
                self.robots.append((fields.get("name"),fields.get("content","")))
              if tag=="link" and fields.get("rel","").lower()=="canonical":
                self.canonical=fields.get("href")

          def fetch(url):
            for attempt in range(2):
              with tempfile.TemporaryDirectory() as d:
                h=Path(d)/"headers"
                b=Path(d)/"body"
                q=subprocess.run(
                  ["curl","--silent","--show-error","--compressed","--location",
                   "--connect-timeout","8","--max-time","22","--retry","0",
                   "--user-agent","IlkOku-SEO-Indexability-Verification/1.0",
                   "--dump-header",str(h),"--output",str(b),
                   "--write-out","%{http_code}","https://ilkoku.com"+url],
                  capture_output=True,text=True,timeout=28,
                )
                code=q.stdout.strip() or "000"
                hdr=h.read_text(errors="replace") if h.exists() else ""
                body=b.read_text(errors="replace") if b.exists() else ""
                ray=next((line.strip().split(":",1)[1].strip() for line in hdr.splitlines() if line.lower().startswith("cf-ray:")),None)
                if code in ("403","429"):
                  raise RuntimeError(f"Blocked by edge on {url}: HTTP {code}, Ray {ray}. Stop further requests.")
                if code not in ("520","521","522","524","525","000"):
                  return code,hdr,body,ray
                print(f"TRANSIENT HTTP {code} {url} ray={ray} attempt={attempt+1}/2",flush=True)
                if attempt==0: time.sleep(6)
            return code,hdr,body,ray
          out=[]
          errors=[]
          for path in urls:
            status,hdr,body,ray=fetch(path)
            meta=MetaReader()
            meta.feed(body)
            xrobots=" ".join(l.split(":",1)[1].strip() for l in hdr.splitlines() if l.lower().startswith("x-robots-tag:"))
            denied="noindex" in (xrobots+" "+ " ".join(c for _,c in meta.robots)).lower()
            canonical_ok=meta.canonical=="https://ilkoku.com"+path
            row=dict(path=path,http=status,canonical=meta.canonical,robots=meta.robots,xrobots=xrobots,indexable=(not denied and status=="200" and canonical_ok),ray=ray)
            out.append(row)
            print("PAGE "+json.dumps(row,ensure_ascii=False),flush=True)
            if status!="200" or not canonical_ok:
              errors.append(path+" HTTP/canonical failed")
            time.sleep(4)
          status,headers,sitemap,ray=fetch("/sitemap.xml")
          if status!="200":errors.append("sitemap fetch HTTP "+status)
          for row in out:
            present="<loc>https://ilkoku.com"+row["path"]+"</loc>" in sitemap
            row["in_sitemap"]=present
            print(f"SITEMAP path={row['path']} listed={present} indexable={row['indexable']}",flush=True)
            if present!=row["indexable"]:
              errors.append(row["path"]+" sitemap/robots mismatch")
          data_gated=[r["path"] for r in out if not r["indexable"]]
          print("FINAL "+json.dumps({"indexable":sum(r["indexable"] for r in out),"total":len(out),"data_gated":data_gated,"errors":errors},ensure_ascii=False),flush=True)
          with open("/tmp/indexability-summary.json","w") as f:
            json.dump({"pages":out,"errors":errors},f,ensure_ascii=False,indent=2)
          if errors:
            raise SystemExit(1)
          PY
      - name: Upload read-only verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexability-verify-20261028
          path: /tmp/indexability-summary.json
          if-no-files-found: warn
          retention-days: 7

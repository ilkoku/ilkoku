name: Writer daily summary

on:
  schedule:
    - cron: "5 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: writer-daily-summary
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger writer daily summaries
        env:
          SUMMARY_SECRET: ${{ secrets.WRITER_DAILY_SUMMARY_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUMMARY_SECRET"
          response="$(curl \
            --fail-with-body \
            --max-time 300 \
            --retry 2 \
            --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $SUMMARY_SECRET" \
            https://ilkoku.com/api/internal/writer-daily-summary)"
          # A 200 may still contain failed writers. Fail CI without making
          # extra POST retries that could duplicate an ambiguous SMTP send.
          if ! printf '%s\n' "$response" | jq -e \
            '.ok == true and (.failed | type == "number") and .failed == 0' >/dev/null; then
            echo "::error::Writer daily summary contained failed writers or invalid JSON."
            exit 1
          fi
          printf '%s\n' "$response"

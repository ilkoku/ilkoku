name: Writing guide template audit one-off

on:
  push:
    branches:
      - "diag/http-cache-validators-20260930"
    paths:
      - ".github/workflows/writing-guide-template-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Measure writing guide similarity and boilerplate
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://ilkoku.com";
          const sm=await fetch(BASE+"/sitemap.xml");
          const xml=await sm.text();
          const urls=[...new Set([...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1].trim()))]
            .filter(u=>/^https:\/\/ilkoku\.com\/yazarlar-icin\/[^/]+\/[^/]+$/.test(u));

          const decode=s=>String(s||"")
            .replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&quot;/g,'"')
            .replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">")
            .replace(/&#\d+;/g," ");
          const strip=s=>decode(s)
            .replace(/<script\b[\s\S]*?<\/script>/gi," ")
            .replace(/<style\b[\s\S]*?<\/style>/gi," ")
            .replace(/<svg\b[\s\S]*?<\/svg>/gi," ")
            .replace(/<[^>]+>/g," ")
            .replace(/\s+/g," ").trim();
          const words=s=>s.toLocaleLowerCase("tr-TR")
            .replace(/[^a-z0-9çğıöşüâîû]+/giu," ")
            .trim().split(/\s+/).filter(Boolean);
          const shingles=(ws,n=5)=>{
            const set=new Set();
            for(let i=0;i<=ws.length-n;i++) set.add(ws.slice(i,i+n).join(" "));
            return set;
          };
          const jacc=(a,b)=>{
            let inter=0;
            const small=a.size<b.size?a:b, large=a.size<b.size?b:a;
            for(const x of small) if(large.has(x)) inter++;
            const union=a.size+b.size-inter;
            return union?inter/union:0;
          };

          const docs=[];
          let cursor=0;
          async function worker(){
            while(true){
              const i=cursor++;
              if(i>=urls.length)return;
              const url=urls[i];
              const res=await fetch(url,{headers:{"user-agent":"Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"},signal:AbortSignal.timeout(30000)});
              const html=await res.text();
              const main=(html.match(/<main\b[^>]*>([\s\S]*?)<\/main>/i)||[])[1]||html;
              const heads=[...main.matchAll(/<h([1-4])\b[^>]*>([\s\S]*?)<\/h\1>/gi)]
                .map(m=>({level:Number(m[1]),text:strip(m[2])})).filter(x=>x.text);
              const text=strip(main);
              const ws=words(text);
              docs.push({url,status:res.status,words:ws.length,heads,sh:shingles(ws),text});
            }
          }
          await Promise.all(Array.from({length:6},()=>worker()));
          docs.sort((a,b)=>a.url.localeCompare(b.url));

          const headingFreq=new Map();
          for(const d of docs){
            for(const h of new Set(d.heads.filter(x=>x.level>=2).map(x=>x.text.toLocaleLowerCase("tr-TR")))){
              headingFreq.set(h,(headingFreq.get(h)||0)+1);
            }
          }
          const commonHeads=[...headingFreq.entries()]
            .filter(([,n])=>n>=Math.ceil(docs.length*0.25))
            .sort((a,b)=>b[1]-a[1])
            .map(([heading,count])=>({heading,count,pct:Number((100*count/docs.length).toFixed(1))}));

          const pairs=[];
          for(let i=0;i<docs.length;i++) for(let j=i+1;j<docs.length;j++){
            pairs.push({a:docs[i].url,b:docs[j].url,score:jacc(docs[i].sh,docs[j].sh)});
          }
          pairs.sort((a,b)=>b.score-a.score);

          // 8-word shingles shared across many documents = boilerplate.
          const shFreq=new Map();
          const perDoc8=[];
          for(const d of docs){
            const s=shingles(words(d.text),8);
            perDoc8.push([d.url,s]);
            for(const x of s) shFreq.set(x,(shFreq.get(x)||0)+1);
          }
          const boilerplateByDoc=perDoc8.map(([url,set])=>{
            let common=0;
            for(const x of set) if((shFreq.get(x)||0)>=Math.ceil(docs.length*0.2)) common++;
            return {url,total8:set.size,common8:common,pct:set.size?Number((100*common/set.size).toFixed(1)):0};
          }).sort((a,b)=>b.pct-a.pct);

          const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
          console.log("SUMMARY",JSON.stringify({
            docs:docs.length,
            non200:docs.filter(d=>d.status!==200).length,
            wordAvg:Math.round(avg(docs.map(d=>d.words))),
            wordMin:Math.min(...docs.map(d=>d.words)),
            wordMax:Math.max(...docs.map(d=>d.words)),
            headingCommon25pctCount:commonHeads.length,
            maxPairSimilarity:Number((pairs[0]?.score||0).toFixed(4)),
            avgTop20PairSimilarity:Number(avg(pairs.slice(0,20).map(p=>p.score)).toFixed(4)),
            avgBoilerplate8Pct:Number(avg(boilerplateByDoc.map(x=>x.pct)).toFixed(2)),
            maxBoilerplate8Pct:boilerplateByDoc[0]?.pct||0
          }));
          for(const x of commonHeads.slice(0,40)) console.log("COMMON_HEADING",JSON.stringify(x));
          for(const x of pairs.slice(0,30)) console.log("SIMILAR_PAIR",JSON.stringify({...x,score:Number(x.score.toFixed(4))}));
          for(const x of boilerplateByDoc.slice(0,30)) console.log("BOILERPLATE",JSON.stringify(x));
          NODE

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Roman fikri akışı</title><desc id="d">Bir gözlemin meraka, soruya, karaktere, çatışmaya ve roman fikrine dönüşmesini gösterir.</desc><rect width="640" height="360" rx="30" fill="#fffaf2"/><text x="54" y="58" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24153f">Bir roman fikri nasıl büyür?</text><g font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle"><rect x="42" y="126" width="82" height="62" rx="16" fill="#f0e8ff" stroke="#cab8ef"/><text x="83" y="162" fill="#38205e">Gözlem</text><rect x="146" y="126" width="82" height="62" rx="16" fill="#f0e8ff" stroke="#cab8ef"/><text x="187" y="162" fill="#38205e">Merak</text><rect x="250" y="126" width="82" height="62" rx="16" fill="#f0e8ff" stroke="#cab8ef"/><text x="291" y="162" fill="#38205e">Soru</text><rect x="354" y="126" width="90" height="62" rx="16" fill="#e8dcff" stroke="#b99eea"/><text x="399" y="162" fill="#38205e">Karakter</text><rect x="466" y="126" width="90" height="62" rx="16" fill="#dccbff" stroke="#a988e3"/><text x="511" y="162" fill="#38205e">Çatışma</text></g><g stroke="#6b3bea" stroke-width="4" fill="none" stroke-linecap="round"><path d="M124 157h18m86 0h18m86 0h18m94 0h18"/><path d="M136 151l8 6-8 6m98-12 8 6-8 6m98-12 8 6-8 6m106-12 8 6-8 6"/></g><rect x="205" y="242" width="230" height="64" rx="20" fill="#2c174e"/><text x="320" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white">Roman cümlesi</text><path d="M511 190C500 235 448 260 437 269" fill="none" stroke="#6b3bea" stroke-width="4" stroke-dasharray="8 8"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Roman yapı diyagramı</title><desc id="d">Başlangıç, yükselen gerilim, doruk ve çözüm aşamalarını gösteren anlatı eğrisi.</desc><rect width="640" height="360" rx="30" fill="#fbf8f2"/><text x="50" y="56" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24153f">Romanın yapısı bir hareket çizgisidir</text><path d="M70 276C135 270 170 238 210 211C265 175 294 118 340 93C388 67 414 112 445 157C477 205 520 242 574 258" fill="none" stroke="#6738e7" stroke-width="8" stroke-linecap="round"/><g fill="#fff" stroke="#6738e7" stroke-width="5"><circle cx="72" cy="275" r="10"/><circle cx="211" cy="210" r="10"/><circle cx="341" cy="93" r="10"/><circle cx="445" cy="157" r="10"/><circle cx="574" cy="258" r="10"/></g><g font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#38205e"><text x="52" y="318">Başlangıç</text><text x="155" y="246">Gerilim yükselir</text><text x="309" y="74">Doruk</text><text x="431" y="135">Sonuçlar</text><text x="536" y="300">Çözüm</text></g><text x="50" y="338" font-family="Arial,sans-serif" font-size="13" fill="#71677f">Katı bir formül değil; sahnelerin ritmini görmek için bir harita.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Baştan sona mini roman projesi</title><desc id="d">Araştırmadan karaktere, plandan taslağa, revizyondan yayına uzanan mini roman projesi akışı.</desc><rect width="640" height="360" rx="30" fill="#fffaf2"/><text x="50" y="58" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24153f">Bir fikir nasıl tamamlanmış romana dönüşür?</text><path d="M78 191H562" stroke="#c4b3e8" stroke-width="6" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#6b3bea" stroke-width="4"><circle cx="84" cy="191" r="31"/><circle cx="178" cy="191" r="31"/><circle cx="272" cy="191" r="31"/><circle cx="366" cy="191" r="31"/><circle cx="460" cy="191" r="31"/><circle cx="554" cy="191" r="31"/></g><g font-size="13" font-weight="700" fill="#38205e"><text x="84" y="250">Araştır</text><text x="178" y="250">Karakter</text><text x="272" y="250">Planla</text><text x="366" y="250">Taslak</text><text x="460" y="250">Revize et</text><text x="554" y="250">Yayınla</text></g><g font-size="22" font-weight="700" fill="#6b3bea"><text x="84" y="199">?</text><text x="178" y="199">◎</text><text x="272" y="199">≡</text><text x="366" y="199">✎</text><text x="460" y="199">↻</text><text x="554" y="199">✓</text></g></g><rect x="166" y="288" width="308" height="34" rx="17" fill="#eee4ff"/><text x="320" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5a35b8">İLHAM + PLAN + YAZIM + REVİZYON</text></svg>